<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
<title>Marca — Brand Lift, tráfico y atribución declarada</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card-hover: #263348;
    --border: #334155; --border-strong: #4b5563; --row-border: #283548;
    --text: #e2e8f0; --text-title: #f8fafc;
    --text-muted: #cbd5e1; --text-muted-2: #94a3b8; --text-muted-3: #64748b;
    --accent: #818cf8; --accent-on: #f8fafc;
    --warn-bg: #78350f; --warn-fg: #fde68a;
  }
  body.light {
    --bg: #f5f7fa; --card: #ffffff; --card-hover: #f1f5f9;
    --border: #e2e8f0; --border-strong: #cbd5e1; --row-border: #f1f5f9;
    --text: #334155; --text-title: #0f172a;
    --text-muted: #475569; --text-muted-2: #64748b; --text-muted-3: #94a3b8;
    --accent: #6366f1; --accent-on: #ffffff;
    --warn-bg: #fef3c7; --warn-fg: #92400e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px; transition: background .2s, color .2s; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted-2); text-decoration: none; font-size: 13px; margin-bottom: 16px; transition: color .15s, border-color .15s; }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 22px; font-weight: 600; color: var(--text-title); }
  .header h1 span { color: var(--accent); }
  .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-muted-2); border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer; transition: background .15s, color .15s; }
  .theme-btn:hover { background: var(--card-hover); color: var(--accent); }
  .sub { color: var(--text-muted-2); font-size: 13px; line-height: 1.6; max-width: 820px; margin-bottom: 18px; }

  /* Selector estándar: grupos de chips. Single-select para país y para los filtros. */
  .filters { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 20px; }
  .fgroup { display: flex; flex-direction: column; gap: 6px; }
  .flabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted-3); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--border); color: var(--text-muted-2); border-radius: 999px; padding: 5px 13px; font-size: 12.5px; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-weight: 600; }

  .section { margin-bottom: 26px; }
  .section > h2 { font-size: 15px; color: var(--text-title); font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .section > p.hint { font-size: 12.5px; color: var(--text-muted-3); margin-bottom: 12px; line-height: 1.55; max-width: 780px; }

  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 5px; background: var(--warn-bg); color: var(--warn-fg); }
  .src { font-size: 10.5px; color: var(--text-muted-3); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 15px 12px; display: flex; flex-direction: column; }
  .panel h3 { font-size: 12.5px; color: var(--text-title); font-weight: 700; margin-bottom: 2px; }
  .panel .cap { font-size: 11px; color: var(--text-muted-3); margin-bottom: 8px; }
  .ch { position: relative; height: 200px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .legend span { font-size: 11px; color: var(--text-muted-2); display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* El vacío explícito: cuando falta la FUENTE, se explica. Nunca un chart en blanco ni ceros. */
  .empty-metric { background: var(--card); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 28px 24px; text-align: center; }
  .empty-metric .icon { font-size: 22px; color: var(--text-muted-3); display: block; margin-bottom: 8px; }
  .empty-metric strong { display: block; font-size: 13.5px; color: var(--text-muted); margin-bottom: 8px; }
  .empty-metric p { font-size: 12.5px; color: var(--text-muted-3); line-height: 1.65; max-width: 620px; margin: 0 auto; }
</style>
<script>
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('tablero-theme', isLight ? 'light' : 'dark');
    document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
    if (window.rerender) window.rerender();
  }
</script>
</head>
<body>
<a href="../" class="back-link">← Volver al hub</a>

<div class="header">
  <h1>Marca — <span id="paisTitulo">México</span></h1>
  <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
</div>
<p class="sub">Salud de marca medida por tres vías independientes: recordación declarada en encuestas
de Meta, tráfico y costo por visita por plaza, y atribución declarada por quien se registra.
Se lee como <strong>Brand Equity</strong>, no como respuesta directa: acá no hay costo por lead.</p>

<div class="filters" id="filtros"></div>
<div id="app"></div>

<script>
if (localStorage.getItem('tablero-theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('themeToggle').textContent = '☀️';
}

const cssv = n => getComputedStyle(document.body).getPropertyValue(n).trim();
let _charts = [];
function destroyCharts() { _charts.forEach(c => c.destroy()); _charts = []; }

// Extiende el mkChart de la plantilla del repo a varias series: Brand Lift necesita
// expuesto y control juntos, y el CPV es una serie aparte del volumen.
function mkMulti(id, labels, datasets, o = {}) {
  const c = document.getElementById(id); if (!c || !window.Chart) return;
  const grid = cssv('--border'), tick = cssv('--text-muted-2');
  _charts.push(new Chart(c, {
    data: { labels, datasets: datasets.map(d => ({
      type: d.type || 'line', label: d.label, data: d.data,
      borderColor: d.color, backgroundColor: d.fill || d.color,
      borderDash: d.dash || [], tension: .35, pointRadius: 0, borderWidth: 2, borderRadius: 3,
      // spanGaps: false a propósito — un cpv nulo debe dejar HUECO, no unir la línea por encima
      // de un mes sin medición. Ver el contrato de data.json.
      spanGaps: false })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => {
        const y = ctx.parsed.y;
        if (y == null) return `${ctx.dataset.label}: sin dato`;
        return `${ctx.dataset.label}: ${o.pct ? (100 * y).toFixed(2) + '%'
          : o.pts ? (100 * y).toFixed(1) + ' pts'
          : o.money ? '$' + y.toLocaleString('es-MX', { maximumFractionDigits: 2 })
          : y.toLocaleString('es-MX')}`; } } } },
      scales: { x: { ticks: { color: tick, maxTicksLimit: 8 }, grid: { display: false } },
        y: { beginAtZero: !o.pts, ticks: { color: tick, callback: v =>
              o.pct ? (100 * v).toFixed(0) + '%' : o.pts ? (100 * v).toFixed(0)
              : o.money ? '$' + v.toLocaleString('es-MX', { maximumFractionDigits: 1 })
              : v.toLocaleString('es-MX') },
            grid: { color: grid } } }
    }
  }));
}

const C = { azul: '#818cf8', gris: '#94a3b8', ambar: '#fbbf24', verde: '#34d399',
            rosa: '#f472b6', cian: '#22d3ee' };
const PALETA = [C.azul, C.verde, C.ambar, C.cian, C.rosa, C.gris];
const NOMBRE_PREGUNTA = { ad_recall: 'Ad Recall (recordación del anuncio)', toma: 'Top of Mind (TOMA)' };
const meses = s => [...new Set(s.map(r => r.month))].sort();
const legend = items => `<div class="legend">${items.map(([c, t]) =>
  `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;

let DATA = null, PAIS = 'MX', PLAZA = 'Todas';

// ── El corazón del tablero: cada métrica se dibuja según su `status`, no según si su
// serie viene vacía. Un `not_available` explica qué fuente falta; jamás pinta un chart
// en blanco ni una serie de ceros, porque un cero se lee como "el valor es cero" en vez
// de "la fuente no está conectada". Ver el contrato en contract.py.
function renderMetric(host, metric, drawFn) {
  if (!metric) {
    host.innerHTML = `<div class="empty-metric"><span class="icon">—</span>
      <strong>Métrica no declarada</strong><p>No aparece en data.json para este país.</p></div>`;
    return '';
  }
  if (metric.status === 'not_available' || metric.status === 'error') {
    const t = metric.status === 'error' ? 'Falló la última actualización' : 'Sin fuente conectada';
    host.innerHTML = `<div class="empty-metric"><span class="icon">${metric.status === 'error' ? '⚠' : '—'}</span>
      <strong>${t}</strong><p>${metric.reason || ''}</p></div>`;
    return '';
  }
  drawFn(host, metric.series || []);
  // El badge de vencido: si no hubo NINGÚN refresco exitoso, `last_updated` no existe y
  // decirlo es más honesto que mostrar un guion donde debería ir una fecha.
  const cuando = metric.last_updated
    ? `sin refrescar desde ${metric.last_updated.slice(0, 16).replace('T', ' ')} UTC`
    : 'nunca se ha refrescado con éxito: se sirve el histórico en caché';
  return metric.status === 'stale' ? `<span class="badge">${cuando}</span>` : '';
}

const srcTag = m => (m && m.source)
  ? `<span class="src">fuente: ${{ bq: 'BigQuery', api: 'Meta API', cache: 'caché en repo' }[m.source] || m.source}</span>` : '';

// ── Brand Lift ────────────────────────────────────────────────────────────────
function drawBrandLift(host, serie) {
  const preguntas = [...new Set(serie.map(r => r.question))].sort();
  const L = meses(serie);
  const paneles = preguntas.map((q, i) => {
    const s = serie.filter(r => r.question === q);
    const ult = s[s.length - 1] || {};
    return `<div class="panel">
      <h3>${NOMBRE_PREGUNTA[q] || q}</h3>
      <div class="cap">Último dato ${ult.month || '—'}: expuesto ${(100 * (ult.exposed || 0)).toFixed(1)}%
        vs control ${(100 * (ult.control || 0)).toFixed(1)}% · lift ${(100 * (ult.lift || 0)) >= 0 ? '+' : ''}${(100 * (ult.lift || 0)).toFixed(1)} pts</div>
      <div class="ch"><canvas id="bl-${i}"></canvas></div>
      ${legend([[C.azul, 'Expuesto'], [C.gris, 'Control']])}</div>`;
  }).join('');
  host.innerHTML = `<div class="charts-grid">${paneles}
    <div class="panel"><h3>Lift neto en puntos</h3>
      <div class="cap">Diferencia expuesto − control. Es la métrica que aísla el efecto de la pauta.</div>
      <div class="ch"><canvas id="bl-lift"></canvas></div>
      ${legend(preguntas.map((q, i) => [PALETA[i], NOMBRE_PREGUNTA[q] || q]))}</div></div>`;

  preguntas.forEach((q, i) => {
    const s = serie.filter(r => r.question === q);
    mkMulti(`bl-${i}`, L, [
      { label: 'Expuesto', color: C.azul, data: L.map(m => (s.find(r => r.month === m) || {}).exposed ?? null) },
      { label: 'Control', color: C.gris, dash: [4, 4], data: L.map(m => (s.find(r => r.month === m) || {}).control ?? null) },
    ], { pct: true });
  });
  mkMulti('bl-lift', L, preguntas.map((q, i) => {
    const s = serie.filter(r => r.question === q);
    return { type: 'bar', label: NOMBRE_PREGUNTA[q] || q, color: PALETA[i],
             data: L.map(m => (s.find(r => r.month === m) || {}).lift ?? null) };
  }), { pts: true });
}

// ── Tráfico y CPV ─────────────────────────────────────────────────────────────
const porPlaza = (serie, campo) => {
  if (PLAZA !== 'Todas') return serie.filter(r => r.plaza === PLAZA);
  const acc = {};
  serie.forEach(r => {
    const a = acc[r.month] || (acc[r.month] = { month: r.month, users: 0, spend: null });
    a.users += r.users || 0;
    if (r.spend != null) a.spend = (a.spend || 0) + r.spend;
  });
  return Object.values(acc).sort((x, y) => x.month.localeCompare(y.month))
    .map(a => ({ ...a, cpv: (a.spend != null && a.users) ? a.spend / a.users : null }));
};

function drawTraffic(host, serie) {
  const s = porPlaza(serie), L = s.map(r => r.month);
  const conCpv = s.filter(r => r.cpv != null).length;
  host.innerHTML = `<div class="charts-grid">
    <div class="panel"><h3>Usuarios activos</h3>
      <div class="cap">GA4, usuarios únicos por mes${PLAZA !== 'Todas' ? ' en ' + PLAZA : ' (todas las plazas)'}. Desvía ±25% de la UI de GA4.</div>
      <div class="ch"><canvas id="tr-users"></canvas></div>${legend([[C.azul, 'Usuarios activos']])}</div>
    <div class="panel"><h3>Costo por visita (CPV)</h3>
      <div class="cap">Inversión de la plaza ÷ usuarios activos. Mensual por diseño: la tabla de inversión no tiene granularidad diaria.
        ${conCpv < L.length ? `<br><strong>${L.length - conCpv} de ${L.length} meses sin inversión registrada</strong> — la línea deja hueco, no cero.` : ''}</div>
      <div class="ch"><canvas id="tr-cpv"></canvas></div>${legend([[C.ambar, 'CPV']])}</div></div>`;
  mkMulti('tr-users', L, [{ label: 'Usuarios activos', color: C.azul, data: s.map(r => r.users) }], {});
  mkMulti('tr-cpv', L, [{ label: 'CPV', color: C.ambar, data: s.map(r => r.cpv) }], { money: true });
}

// ── Exit poll ─────────────────────────────────────────────────────────────────
const esUber = k => k.toUpperCase().includes('UBER');
function aggExit(serie) {
  if (PLAZA !== 'Todas') return serie.filter(r => r.plaza === PLAZA);
  const acc = {};
  serie.forEach(r => {
    const a = acc[r.month] || (acc[r.month] = { month: r.month, registros_web: 0, respuestas: 0, opciones: {} });
    a.registros_web += r.registros_web; a.respuestas += r.respuestas;
    Object.entries(r.opciones || {}).forEach(([k, v]) => a.opciones[k] = (a.opciones[k] || 0) + v);
  });
  return Object.values(acc).sort((x, y) => x.month.localeCompare(y.month))
    .map(a => ({ ...a, tasa: a.registros_web ? a.respuestas / a.registros_web : 0 }));
}

function drawExitPoll(host, serie) {
  const s = aggExit(serie), L = s.map(r => r.month);
  // Top opciones por volumen total, y Uber siempre presente aunque sea marginal:
  // es la que motiva el informe de campaña.
  const tot = {};
  s.forEach(r => Object.entries(r.opciones).forEach(([k, v]) => tot[k] = (tot[k] || 0) + v));
  const top = Object.entries(tot).sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0]);
  const uber = Object.keys(tot).filter(esUber);
  const mostrar = [...new Set([...top, ...uber])];
  const share = (r, k) => r.respuestas ? (r.opciones[k] || 0) / r.respuestas : null;
  const ult = s[s.length - 1] || { opciones: {} };
  const shareUber = uber.length ? share(ult, uber[0]) : null;

  host.innerHTML = `<div class="charts-grid">
    <div class="panel"><h3>Tasa de respuesta</h3>
      <div class="cap">Quién contesta "¿dónde nos conociste?" sobre registros WEB. Último mes: ${(100 * (ult.tasa || 0)).toFixed(1)}%.</div>
      <div class="ch"><canvas id="ep-tasa"></canvas></div>${legend([[C.gris, 'Tasa de respuesta']])}</div>
    <div class="panel"><h3>Share por canal declarado</h3>
      <div class="cap">Sobre el total de respuestas del mes. Es <strong>selección múltiple</strong>:
        una persona marca varios canales, así que los shares suman más de 100%.${shareUber != null
        ? ` Uber en ${ult.month}: <strong>${(100 * shareUber).toFixed(2)}%</strong>.` : ''}
        El texto libre de "Otro" no se guarda — traía datos personales.</div>
      <div class="ch"><canvas id="ep-share"></canvas></div>
      ${legend(mostrar.map((k, i) => [esUber(k) ? C.verde : PALETA[(i + 1) % PALETA.length], k]))}</div></div>`;

  mkMulti('ep-tasa', L, [{ label: 'Tasa de respuesta', color: C.gris, data: s.map(r => r.tasa) }], { pct: true });
  mkMulti('ep-share', L, mostrar.map((k, i) => ({
    label: k, color: esUber(k) ? C.verde : PALETA[(i + 1) % PALETA.length],
    data: s.map(r => share(r, k)) })), { pct: true });
}

// ── Filtros y render ──────────────────────────────────────────────────────────
function chips(label, opciones, activo, onPick) {
  return `<div class="fgroup"><span class="flabel">${label}</span><div class="chips">${
    opciones.map(o => `<button class="chip ${o === activo ? 'on' : ''}" data-pick="${onPick}" data-val="${o}">${o}</button>`).join('')
  }</div></div>`;
}

function render() {
  const M = DATA.metrics;
  document.getElementById('paisTitulo').textContent = PAIS === 'MX' ? 'México' : 'Colombia';
  document.getElementById('filtros').innerHTML =
    chips('País', ['MX', 'CO'], PAIS, 'pais') +
    chips('Plaza · aplica a tráfico y exit poll', ['Todas', 'MTY', 'GDL', 'CDMX', 'Resto'], PLAZA, 'plaza');

  destroyCharts();
  const app = document.getElementById('app');
  const secs = [
    ['brand_lift', 'Recordación de marca — Brand Lift de Meta',
     'Encuesta mensual a un grupo expuesto a la pauta y a un grupo de control equivalente al que se le retiene. El lift es la diferencia neta.',
     drawBrandLift],
    ['traffic', 'Tráfico y costo por visita por plaza',
     'Si la marca funciona, el tráfico sube y el costo por visita baja. La marca es la pólvora; el performance, la mecha.',
     drawTraffic],
    ['exit_poll', 'Atribución declarada — exit poll de registro',
     'Lo que la gente dice cuando se le pregunta dónde nos conoció. Es declarado, no medido: sirve para tendencia, no para atribuir cierres.',
     drawExitPoll],
  ];
  app.innerHTML = secs.map(([k]) =>
    `<div class="section"><h2 id="h-${k}"></h2><p class="hint" id="p-${k}"></p><div id="c-${k}"></div></div>`).join('');

  secs.forEach(([k, titulo, hint, fn]) => {
    const m = M[k] && M[k][PAIS];
    document.getElementById(`p-${k}`).innerHTML = hint;
    const badge = renderMetric(document.getElementById(`c-${k}`), m, fn);
    document.getElementById(`h-${k}`).innerHTML = titulo + ' ' + badge + ' ' + srcTag(m);
  });
}
window.rerender = render;

// La vista queda en la URL: así se puede mandar "el tablero de Colombia" por Slack en vez de
// "abre el tablero y dale click a CO".
function syncURL() {
  const q = new URLSearchParams({ pais: PAIS, plaza: PLAZA });
  history.replaceState(null, '', `?${q}`);
}
function readURL() {
  const q = new URLSearchParams(location.search);
  if (['MX', 'CO'].includes(q.get('pais'))) PAIS = q.get('pais');
  if (['Todas', 'MTY', 'GDL', 'CDMX', 'Resto'].includes(q.get('plaza'))) PLAZA = q.get('plaza');
}

document.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.pick === 'pais') PAIS = b.dataset.val; else PLAZA = b.dataset.val;
  syncURL();
  render();
});

(async () => {
  readURL();
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty-metric">
      <span class="icon">—</span><strong>Aún no hay data.json</strong>
      <p>Se genera con <code>python3 build.py</code> desde esta carpeta, y el cron del hub lo
      regenera cada 4 horas.</p></div>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
