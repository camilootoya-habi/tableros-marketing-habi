<style>
  /* Mismo sistema visual que salud-marca: tokens, header fijo, ayuda con "?" y tarjetas. */
  :root {

  body.light {
    --bg: #f5f7fa; --card: #ffffff; --card-hover: #f1f5f9;

    --text: #334155; --text-title: #0f172a;

  .section { margin-bottom: 28px; }

  .pz { display: flex; align-items: center; gap: 9px; }

  .posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; }
  .post { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; color: inherit; text-decoration: none; }
  .post:hover { border-color: var(--accent); }

  .post .red.ig { background: #e1306c; } .post .red.fb { background: #1877f2; }
  .post .curso { position: absolute; bottom: 7px; left: 7px; background: rgba(0, 0, 0, .65); color: #fff; font-size: 10.5px; border-radius: 5px; padding: 2px 7px; }

  .vista { max-width: 760px; padding: 18px; }

  .vista-cuerpo img { width: 100%; border-radius: 8px; background: var(--row-border); display: block; }

  .vista-cuerpo .cap { font-size: 12px; color: var(--text-muted-3); margin-bottom: 10px; line-height: 1.5; }
  .vista-cuerpo ul { list-style: none; padding: 0; margin: 0; }

  .vista-cuerpo li a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 10px; }
  .vista-cuerpo li a:hover { text-decoration: underline; }
  .red-h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--text-title); margin: 16px 0 9px; }

  .tipo-camp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 900px) { .tipo-camp { grid-template-columns: 1fr; } }

  .tipo-camp .k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--c); }
  .tipo-camp .v { font-size: 22px; font-weight: 800; color: var(--text-title); margin: 3px 0; font-variant-numeric: tabular-nums; }
  .tipo-camp .v small { font-size: 12px; font-weight: 600; color: var(--text-muted-2); }
  .tipo-camp .d { font-size: 12px; color: var(--text-muted); line-height: 1.55; }
  .tipo-camp .off { opacity: .55; }
  .barra-pct { display: inline-block; width: 90px; height: 8px; border-radius: 99px; background: var(--row-border); overflow: hidden; vertical-align: middle; margin-right: 6px; }
  .barra-pct i { display: block; height: 100%; background: var(--accent); }
  .lado { display: flex; height: 9px; border-radius: 99px; overflow: hidden; background: var(--row-border); min-width: 120px; }
  .lado i:first-child { background: var(--accent); } .lado i:last-child { background: #0ea5e9; }
  td.mejor b, td.mejor { color: #059669 !important; font-weight: 700; } td.peor { color: #dc2626 !important; }
  .bloque { border-top: 2px solid var(--accent); padding-top: 10px; margin: 26px 0 12px; }
  .bloque-h { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.3px; color: var(--accent); display: flex; align-items: center; }
  .bloque-p { font-size: 12.5px; color: var(--text-muted-2); margin-top: 3px; line-height: 1.5; max-width: 860px; }
  .tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tres > * { min-width: 0; }
  @media (max-width: 1000px) { .tres { grid-template-columns: 1fr; } }
  .tres + .red-h, .cuatro + .red-h { margin-top: 18px; }
  .coms { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .com { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 9px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .com.pend { border-color: var(--border); border-left-color: #f59e0b; }

<script>
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    try { localStorage.setItem('tablero-theme', isLight ? 'light' : 'dark'); } catch (e) {}
    document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
    if (window.rerender) window.rerender();
  }
</script>

</div>
<p class="sub">Lo que movió la acción con <strong>La Rosa de Guadalupe</strong>: las publicaciones orgánicas
en Instagram y Facebook, los anuncios <code>Rosa_*</code> separados por el objetivo de su campaña, y cómo
se compara todo contra lo normal de la cuenta.</p>

<dialog id="ayuda" class="help-dialog"><div id="ayudaCuerpo"></div>
  <button type="button" class="close-btn" onclick="this.closest('dialog').close()">Cerrar</button></dialog>

<script>
// Modo claro por defecto, como el resto del hub; oscuro solo si alguien lo eligió.
let _tema = null;
try { _tema = localStorage.getItem('tablero-theme'); } catch (e) {}
if (_tema !== 'dark') document.body.classList.add('light');
else document.getElementById('themeToggle').textContent = '🌙';

const cssv = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const C = { rosa: '#e11d48', rosaClaro: '#fb7185', azul: '#6366f1', verde: '#10b981', ambar: '#f59e0b',
            gris: '#94a3b8', fb: '#1877f2', ig: '#e1306c', cian: '#06b6d4' };
const COLOR_OBJ = { alcance: C.azul, leads: C.rosa, interaccion: C.verde, trafico: C.cian, otro: C.gris };
const NOMBRE_OBJ = { alcance: 'Alcance', leads: 'Leads', interaccion: 'Interacción', trafico: 'Tráfico', otro: 'Otro' };
const ORDEN_OBJ = ['alcance', 'leads', 'interaccion'];

// ── Formatos ──────────────────────────────────────────────────────────────────
const n0 = v => v == null || !isFinite(v) ? '—' : Math.round(v).toLocaleString('es-MX');
const fmtMil = v => v == null || !isFinite(v) ? '—' : Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString('es-MX', { maximumFractionDigits: 2 }) + ' M'
  : Math.abs(v) >= 1e4 ? (v / 1e3).toLocaleString('es-MX', { maximumFractionDigits: 1 }) + ' mil' : n0(v);
const usd = v => v == null || !isFinite(v) ? '—' : 'US$' + (Math.abs(v) >= 100 ? Math.round(v).toLocaleString('es-MX')
  : v.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: Math.abs(v) < 0.1 ? 3 : 2 }));
const pct = (v, d = 2) => v == null || !isFinite(v) ? '—' : (100 * v).toFixed(d) + '%';
const div = (a, b) => b ? a / b : null;
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const diaMes = d => d ? `${d.slice(8, 10)} ${MESES[+d.slice(5, 7) - 1]}` : '';
const FMT = { num: n0, compacto: n0, usd: usd, pct: v => pct(v, 2), pct1: v => pct(v, 1) };
const FMT_EJE = { num: fmtMil, compacto: fmtMil, usd: v => usd(v), pct: v => pct(v, 1), pct1: v => pct(v, 0) };

// Cambio relativo con color. `menosEsMejor`: para costos (CPM, CPL), bajar es bueno.
function delta(a, b, menosEsMejor = false) {
  if (a == null || b == null || !b) return '';
  const r = a / b - 1;
  const bueno = menosEsMejor ? r < 0 : r > 0;
  const cls = Math.abs(r) < 0.03 ? 'neutro' : bueno ? 'sube' : 'baja';
  return `<span class="delta ${cls}">${r >= 0 ? '+' : ''}${(100 * r).toFixed(0)}%</span>`;
}

// ── Ayuda ─────────────────────────────────────────────────────────────────────
const AYUDA = {
  fuentes: ['De dónde sale cada número', `
    <p><strong>Pagado</strong>: API de Meta, cuenta de anuncios de Tuhabi México (en dólares). Entran los anuncios
    cuyo nombre empieza con <code>Rosa</code>, de cualquier campaña. El objetivo (alcance, leads, interacción)
    es el de la campaña que los contiene: si mañana se lanza una campaña de interacción con anuncios
    <code>Rosa_*</code>, aparece sola.</p>
    <p><strong>Orgánico</strong>: publicaciones de @tuhabimx y de la página de Tuhabi desde el 2-oct con 🌹,

// ── Gráficas ──────────────────────────────────────────────────────────────────
// Líneas verticales punteadas en fechas clave (arranque de lo orgánico y de cada objetivo).
const marcasFecha = {
  id: 'marcasFecha',
  afterDatasetsDraw(chart) {
    const o = (chart.options.plugins || {}).marcasFecha || {};
    const x = chart.scales.x, a = chart.chartArea;
    if (!(o.indices || []).length || !x || !a) return;
    const ctx = chart.ctx;
    ctx.save(); ctx.strokeStyle = o.color; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    o.indices.forEach(i => { const px = x.getPixelForValue(i); ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke(); });
    ctx.restore();
  },
};
if (window.Chart) Chart.register(marcasFecha);
let _charts = [];
function destroyCharts() { _charts.forEach(c => c.destroy()); _charts = []; }

function mkMulti(id, labels, datasets, o = {}) {
  const c = document.getElementById(id); if (!c || !window.Chart) return;
  const grid = cssv('--border'), tick = cssv('--text-muted-2');
  const izq = o.fmt || 'num', der = o.fmtDerecha || 'num';
  const scales = {
    x: { stacked: !!o.apilado, ticks: { color: tick, maxTicksLimit: 8 }, grid: { display: false } },
    y: { beginAtZero: true, stacked: !!o.apilado, ticks: { color: tick, callback: FMT_EJE[izq] }, grid: { color: grid } },
  };
  if (datasets.some(d => d.eje === 'y1')) {
    scales.y1 = { position: 'right', beginAtZero: true, ticks: { color: tick, callback: FMT_EJE[der] }, grid: { drawOnChartArea: false } };
  }
  _charts.push(new Chart(c, {
    data: { labels: labels.map(l => /^\d{4}-\d\d-\d\d$/.test(l) ? diaMes(l) : l), datasets: datasets.map(d => ({
      type: d.type || 'line', label: d.label, data: d.data, yAxisID: d.eje || 'y', order: d.orden ?? 0,
      borderColor: d.color, backgroundColor: d.fill || d.color, borderDash: d.dash || [], tension: .3,
      pointRadius: d.type === 'bar' ? 0 : 2.5, borderWidth: d.type === 'bar' ? 0 : 2, borderRadius: 3, spanGaps: false })) },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      indexAxis: o.horizontal ? 'y' : 'x',
      plugins: { legend: { display: false },
        marcasFecha: o.marcas ? { color: cssv('--text-muted-3'), indices: o.marcas } : {},
        tooltip: { callbacks: { label: ctx => {
          const y = o.horizontal ? ctx.parsed.x : ctx.parsed.y;
          if (y == null) return `${ctx.dataset.label}: sin dato`;
          return `${ctx.dataset.label}: ${FMT[ctx.dataset.yAxisID === 'y1' ? der : izq](y)}`; } } } },
      scales: o.horizontal ? { x: { ...scales.y, ticks: { color: tick, callback: FMT_EJE[izq] } }, y: { ticks: { color: tick }, grid: { display: false } } } : scales,
    },
  }));
}
const leyenda = items => `<div class="legend">${items.map(([t, c]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;

// ── Datos ─────────────────────────────────────────────────────────────────────
let D = null;
const SUMABLES = ['inversion', 'impresiones', 'clics', 'clics_link', 'landing', 'interacciones', 'reacciones', 'comentarios',
  'compartidos', 'guardados', 'video_3s', 'leads', 'thruplay', 'p25', 'p50', 'p75', 'p100', 'recordacion',
  'compras', 'compras_vista', 'leads_vista', 'valor_compras', 'registros', 'unlikes'];
function sumar(filas) {
  const o = {}; SUMABLES.forEach(k => o[k] = 0);
  filas.forEach(f => SUMABLES.forEach(k => o[k] += f[k] || 0));
  return o;
}
function rangoDias(desde, hasta) {
  const out = []; let d = new Date(desde + 'T12:00:00Z'); const fin = new Date(hasta + 'T12:00:00Z');
  while (d <= fin) { out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); }
  return out;
}
const porDia = (filas, dias, fn) => dias.map(d => { const fs = filas.filter(f => f.d === d); return fs.length ? fn(sumar(fs)) : null; });
const objetivosPresentes = () => ORDEN_OBJ.concat(Object.keys(NOMBRE_OBJ).filter(k => !ORDEN_OBJ.includes(k)))
  .filter(o => ((D.pagado || {}).filas || []).some(f => f.obj === o));

function estado(sec, nombre) {
  if (!sec) return `<div class="aviso">${nombre}: sin datos.</div>`;
  if (sec.status === 'ok') return '';
  const cuando = sec.last_updated ? ` Último dato bueno: ${sec.last_updated.slice(0, 16).replace('T', ' ')} UTC.` : '';
  return `<div class="aviso"><b>${nombre}: ${sec.status === 'stale' ? 'datos de la corrida anterior' : 'no se pudo leer'}.</b>
    ${sec.reason || ''}${cuando}</div>`;
}

// ── Hojas ─────────────────────────────────────────────────────────────────────
const HOJAS = [['resumen', 'Resumen'], ['pagado', 'Pagado'], ['organico', 'Orgánico'], ['comentarios', 'Comentarios'], ['cuenta', 'Efecto en la cuenta']];
const params = new URLSearchParams(location.search);
let HOJA = HOJAS.some(h => h[0] === params.get('hoja')) ? params.get('hoja') : 'resumen';
let OBJ = params.get('obj') || 'todos';
let F_CANAL = params.get('canal') || 'todos', F_RED = params.get('red') || 'todas', F_PEND = params.get('pend') === '1';

function syncURL() {
  const p = new URLSearchParams();
  if (HOJA !== 'resumen') p.set('hoja', HOJA);
  if (HOJA === 'pagado' && OBJ !== 'todos') p.set('obj', OBJ);
  if (HOJA === 'comentarios') { if (F_CANAL !== 'todos') p.set('canal', F_CANAL); if (F_RED !== 'todas') p.set('red', F_RED); if (F_PEND) p.set('pend', '1'); }
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
}

function renderHeader() {
  document.getElementById('hojas').innerHTML = HOJAS.map(([k, t]) =>
    `<button class="tab ${k === HOJA ? 'active' : ''}" data-hoja="${k}">${t}</button>`).join('');
  const f = document.getElementById('filtros');
  if (HOJA === 'comentarios') {
    const grupo = (nombre, attr, val, ops) => `<span class="flabel">${nombre}</span>` +
      ops.map(([k, t]) => `<button class="chip ${k === val ? 'on' : ''}" data-${attr}="${k}">${t}</button>`).join('');
    f.innerHTML = grupo('Canal', 'canal', F_CANAL, [['todos', 'Todos'], ['organico', 'Orgánico'], ['pago', 'Pago']]) +
      '<span style="width:14px"></span>' + grupo('Red', 'red', F_RED, [['todas', 'Todas'], ['ig', 'Instagram'], ['fb', 'Facebook']]) +
      `<span style="width:14px"></span><button class="chip ${F_PEND ? 'on' : ''}" data-pend="1">Solo sin respuesta de Tuhabi</button>`;
    return;
  }
  if (HOJA !== 'pagado') { f.innerHTML = ''; return; }
  const hay = objetivosPresentes();
  const chips = [['todos', 'Todos']].concat(ORDEN_OBJ.map(o => [o, NOMBRE_OBJ[o]]))
    .concat(hay.filter(o => !ORDEN_OBJ.includes(o)).map(o => [o, NOMBRE_OBJ[o]]));
  f.innerHTML = `<span class="flabel">Objetivo de campaña</span>` + chips.map(([k, t]) => {
    const off = k !== 'todos' && !hay.includes(k);
    return `<button class="chip ${k === OBJ ? 'on' : ''} ${off ? 'off' : ''}" data-obj="${k}" ${off ? 'disabled title="Todavía no hay anuncios Rosa en una campaña con este objetivo"' : ''}>${t}${off ? ' <small>sin campaña</small>' : ''}</button>`;
  }).join('');
}

function render() {
  destroyCharts();
  renderHeader();
  const app = document.getElementById('app');
  ({ resumen: renderResumen, pagado: renderPagado, organico: renderOrganico, comentarios: renderComentarios, cuenta: renderCuenta })[HOJA](app);
  syncURL();
}
window.rerender = render;

      <div><div class="k">Inversión</div><div class="v">${usd(t.inversion)}</div><div class="d">${usd(div(t.inversion, dias.length))} por día en promedio</div></div>
      <div><div class="k">Vistas totales</div><div class="v">${fmtMil(lado[0][1] + lado[0][2])}</div><div class="d">${pct(div(lado[0][2], lado[0][1] + lado[0][2]), 1)} orgánicas</div></div>
      <div><div class="k">Interacciones totales</div><div class="v">${n0(lado[2][1] + lado[2][2])}</div><div class="d">${pct(div(lado[2][2], lado[2][1] + lado[2][2]), 0)} orgánicas</div></div>
    </div>
  </div>
  <div class="section">
    <h2>Inversión por tipo de campaña ${ayuda('tipos_campana')}</h2>
    <div class="tipo-camp">${TIPOS.map(([o, k, nombre, porQue]) => {
      const sf = sumar(filas.filter(f => f.obj === o));
      const hay = filas.some(f => f.obj === o);
      return `<div style="--c:${COLOR_OBJ[o]}" class="${hay ? '' : 'off'}"><div class="k">${NOMBRE_OBJ[o]}</div>
        ${hay ? `<div class="v">${usd(sf.inversion)} <small>${pct(div(sf.inversion, t.inversion), 0)} del total</small></div>
          <div class="d"><b>${n0(o === 'interaccion' ? interSinVideo(sf) : sf[k])}</b> ${nombre} · ${usd(div(sf.inversion, o === 'interaccion' ? interSinVideo(sf) : sf[k]))} ${porQue}<br>
          ${fmtMil(sf.impresiones)} impresiones · CPM ${usd(div(sf.inversion * 1000, sf.impresiones))} · ${n0(sf.clics_link)} clics al sitio</div>`
        : '<div class="v">—</div><div class="d">Todavía no hay una campaña de este tipo con anuncios Rosa. Cuando exista, aparece aquí sola.</div>'}</div>`;
    }).join('')}</div>
    <div class="grid2">
      <div class="panel"><h3>Inversión por día, por tipo de campaña</h3><div class="cap">US$ por día</div>
        <div class="ch"><canvas id="r_inv"></canvas></div>${leyenda(TIPOS.filter(([o]) => filas.some(f => f.obj === o)).map(([o]) => [NOMBRE_OBJ[o], COLOR_OBJ[o]]))}</div>
      <div class="panel"><h3>Publicaciones por día</h3><div class="cap">Columnas: posts orgánicos publicados. Línea: anuncios Rosa con inversión ese día (eje derecho).</div>
        <div class="ch"><canvas id="r_pubs"></canvas></div>${leyenda([['Instagram', C.ig], ['Facebook', C.fb], ['Anuncios activos', C.rosa]])}</div>
    </div>
  </div>
  <div class="section">
    <h2>Pago contra orgánico ${ayuda('pago_org')}</h2>
    <p class="hint">Los indicadores principales de la Rosa, lado a lado. La barra muestra qué parte es pago (rosa) y qué parte orgánico (azul).</p>
    <div class="t-wrap"><table class="t">
      <tr><th>Indicador</th><th>Pago</th><th>Orgánico</th><th>Total</th><th style="text-align:left">Pago · orgánico</th><th style="text-align:left">Nota</th></tr>
      ${lado.map(([n, p, o, nota]) => { const tot = (p || 0) + (o || 0); return `<tr><td><b>${n}</b></td><td>${n0(p)}</td><td>${n0(o)}</td><td><b>${n0(tot)}</b></td>
        <td><div class="lado"><i style="width:${tot ? 100 * (p || 0) / tot : 0}%"></i><i style="width:${tot ? 100 * (o || 0) / tot : 0}%"></i></div></td>
        <td style="text-align:left;color:var(--text-muted-3)">${nota}</td></tr>`; }).join('')}
      <tr><td><b>Inversión</b></td><td>${usd(t.inversion)}</td><td>—</td><td><b>${usd(t.inversion)}</b></td><td></td><td style="text-align:left;color:var(--text-muted-3)">ThruPlays pagados: ${n0(t.thruplay)}</td></tr>
    </table></div>
  </div>`;

  mkMulti('r_inv', dias, TIPOS.filter(([o]) => filas.some(f => f.obj === o)).map(([o]) =>
    ({ type: 'bar', label: NOMBRE_OBJ[o], color: COLOR_OBJ[o], data: porDia(filas.filter(f => f.obj === o), dias, x => x.inversion) })), { apilado: true, fmt: 'usd' });
  const pubs = r => dias.map(d => posts.filter(p => p.red === r && p.fecha === d).length || null);
  const activosDia = dias.map(d => new Set(filas.filter(f => f.d === d && f.inversion).map(f => f.ad)).size || null);
  mkMulti('r_pubs', dias, [{ type: 'bar', label: 'Instagram', color: C.ig, data: pubs('ig'), orden: 2 },
                           { type: 'bar', label: 'Facebook', color: C.fb, data: pubs('fb'), orden: 2 },
                           { label: 'Anuncios activos', color: C.rosa, eje: 'y1', data: activosDia }], { apilado: true });
}

// ── Pagado ────────────────────────────────────────────────────────────────────
function renderPagado(app) {
  const pg = D.pagado || {};
  if (!pg.filas) { app.innerHTML = estado(pg, 'Pagado'); return; }
  const filas = pg.filas.filter(f => OBJ === 'todos' || f.obj === OBJ);
  const A = pg.anuncios || {};
  const t = sumar(filas);
  const camps = Object.values((pg.alcance || {}).campanas || {}).filter(c => OBJ === 'todos' || c.obj === OBJ);
  const alc = OBJ === 'todos' ? ((pg.alcance || {}).total || {}).alcance : camps.reduce((s, c) => s + c.alcance, 0);
  const desde = filas.length ? filas.map(f => f.d).sort()[0] : D.config.inicio_pagado;
  const dias = filas.length ? rangoDias(desde, filas.map(f => f.d).sort().pop()) : [];
  const esAlc = OBJ === 'alcance', esLeads = OBJ === 'leads';

  const fichas = [
    ['Inversión', usd(t.inversion), `${dias.length} días`],
    ['Impresiones', fmtMil(t.impresiones), `CPM ${usd(div(t.inversion * 1000, t.impresiones))}`],
    [`Alcance único ${ayuda('alcance_unico')}`, fmtMil(alc), `frecuencia ${(div(t.impresiones, alc) || 0).toFixed(2)} ${ayuda('frecuencia')}`],
    [`Clics al sitio ${ayuda('ctr')}`, n0(t.clics_link), `CTR ${pct(div(t.clics_link, t.impresiones))} · ${usd(div(t.inversion, t.clics_link))} c/u`],
    [`Visitas a la landing ${ayuda('landing')}`, n0(t.landing), `${pct(div(t.landing, t.clics_link), 0)} de los clics · ${usd(div(t.inversion, t.landing))} c/u`],
    [`Evento Lead (píxel) ${ayuda('leads')}`, n0(t.leads), `${n0(t.leads - t.leads_vista)} por clic · ${n0(t.leads_vista)} por vista · ${pct(div(t.leads, t.landing), 0)} de las visitas · ${usd(div(t.inversion, t.leads))} c/u`],
    [`Evento Purchase (píxel) ${ayuda('compras')}`, n0(t.compras), t.compras ? `${n0(t.compras - t.compras_vista)} por clic · ${n0(t.compras_vista)} por vista · ${usd(div(t.inversion, t.compras))} c/u · valor ${usd(t.valor_compras)}` : 'sin compras atribuidas'],
    [`ThruPlays ${ayuda('thruplay')}`, fmtMil(t.thruplay), `${usd(div(t.inversion, t.thruplay))} c/u · ${pct(div(t.thruplay, t.impresiones), 1)} de impresiones`],
    [`Recordación estimada ${ayuda('recordacion')}`, n0(t.recordacion), t.recordacion ? `${usd(div(sumar(filas.filter(f => f.obj === 'alcance')).inversion, t.recordacion))} por persona (inversión de alcance)` : 'solo campañas de alcance'],
  ];
  const comp = (pg.comparativo || []).filter(c => OBJ === 'todos' || c.obj === OBJ);

  app.innerHTML = estado(pg, 'Pagado') + `
  <div class="section">
    <h2>${OBJ === 'todos' ? 'Toda la pauta Rosa' : 'Objetivo: ' + NOMBRE_OBJ[OBJ]} ${ayuda('fuentes')}</h2>
    <p class="hint">${camps.length} campaña${camps.length === 1 ? '' : 's'} · ${new Set(filas.map(f => f.ad)).size} anuncios · desde el ${diaMes(desde)}.
      ${esAlc ? 'Una campaña de alcance se juzga por CPM, alcance y recordación, no por leads.' : esLeads ? 'Una campaña de leads se juzga por costo por lead y por visita a la landing.' : ''}</p>
    <div class="ficha">${fichaOptimiza(pg, OBJ)}${fichas.map(([k, v, d]) => `<div><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('')}</div>
  </div>
  <div class="section">
    <h2>Día a día</h2>
    <p class="hint">Arriba los valores del día (columnas); abajo las tasas y costos (líneas).</p>
    <div class="cinco">
      ${['inversion:Inversión', 'impresiones:Impresiones', 'clics_link:Clics al sitio', 'landing:Visitas a la landing', 'leads:Evento Lead (píxel)']
        .map(s => { const [k, n] = s.split(':'); return `<div class="panel mini"><h3>${n}</h3><div class="tot">${k === 'inversion' ? usd(t[k]) : n0(t[k])}</div><div class="ch chico"><canvas id="p_${k}"></canvas></div></div>`; }).join('')}
    </div>
    <div class="cuatro">
      ${['cpm:CPM', 'ctr:CTR al sitio', 'tasa_landing:Visitas a la landing ÷ clics', 'cpl:Costo por evento Lead']
        .map(s => { const [k, n] = s.split(':'); return `<div class="panel mini"><h3>${n}</h3><div class="ch chico"><canvas id="p_${k}"></canvas></div></div>`; }).join('')}
    </div>
  </div>
  <div class="section">
    <h2>Contra los otros anuncios de la campaña ${ayuda('comparativo')}</h2>
    <p class="hint">Misma campaña, mismos días: ¿los anuncios Rosa rinden mejor o peor que el resto?</p>
    ${comp.length ? `<div class="comp">${comp.map(panelComparativo).join('')}</div>` : '<div class="empty-metric">Sin campañas para comparar.</div>'}
  </div>
  <div class="section">
    <h2>Dónde se mostró: plataforma y posición ${ayuda('posiciones')}</h2>
    <p class="hint">Meta reparte solo (ubicaciones automáticas). Así se fue la inversión de los anuncios Rosa${OBJ === 'todos' ? '' : ' de ' + NOMBRE_OBJ[OBJ].toLowerCase()}.</p>
    ${tablaPosiciones(filas, pg.plataforma || [])}
  </div>
  <div class="section">
    <h2>Piezas ${ayuda('piezas')}</h2>
    <p class="hint">Ordenadas por inversión. Cada pieza junta sus versiones de Facebook e Instagram.</p>
    ${tablaPiezas(filas, A, pg.plataforma || [])}
  </div>
  <div class="section">
    <h2>Retención del video ${ayuda('thruplay')}</h2>
    <div class="grid2">
      <div class="panel"><h3>Cuántos llegan a cada punto del video</h3><div class="cap">Reproducciones, de 3 segundos al final.</div>
        <div class="ch"><canvas id="p_ret"></canvas></div></div>
      <div class="panel"><h3>Reparto de la inversión por posición</h3><div class="cap">Cada columna es un tipo de campaña (100% = su inversión).</div>
        <div class="ch"><canvas id="p_plat"></canvas></div><div id="p_plat_ley"></div></div>
    </div>
  </div>`;

  const v = k => porDia(filas, dias, s => s[k] || 0);
  const color = OBJ === 'todos' ? C.rosa : COLOR_OBJ[OBJ];
  ['inversion', 'impresiones', 'clics_link', 'landing', 'leads'].forEach(k =>
    mkMulti('p_' + k, dias, [{ type: 'bar', label: k === 'inversion' ? 'Inversión' : k, color, data: v(k) }], { fmt: k === 'inversion' ? 'usd' : 'num' }));
  mkMulti('p_cpm', dias, [{ label: 'CPM', color, data: porDia(filas, dias, s => div(s.inversion * 1000, s.impresiones)) }], { fmt: 'usd' });
  mkMulti('p_ctr', dias, [{ label: 'CTR', color, data: porDia(filas, dias, s => div(s.clics_link, s.impresiones)) }], { fmt: 'pct' });
  mkMulti('p_tasa_landing', dias, [{ label: 'Landing ÷ clics', color, data: porDia(filas, dias, s => div(s.landing, s.clics_link)) }], { fmt: 'pct1' });
  mkMulti('p_cpl', dias, [{ label: 'CPL', color, data: porDia(filas, dias, s => div(s.inversion, s.leads)) }], { fmt: 'usd' });
  const ret = [['3 s', t.video_3s], ['25%', t.p25], ['50%', t.p50], ['75%', t.p75], ['100%', t.p100], ['ThruPlay', t.thruplay]];
  mkMulti('p_ret', ret.map(r => r[0]), [{ type: 'bar', label: 'Reproducciones', color, data: ret.map(r => r[1]) }]);
  // Reparto por posición, una columna por tipo de campaña. Las posiciones chicas (<3%) van juntas.
  const objs = objetivosPresentes().filter(o => OBJ === 'todos' || o === OBJ);
  const filasPos = (pg.plataforma || []).filter(x => objs.includes((pg.anuncios[x.ad] || {}).obj));
  const totObj = o => sumar(filasPos.filter(x => (pg.anuncios[x.ad] || {}).obj === o)).inversion;
  const grandes = [...new Set(filasPos.map(nombrePos))].filter(n => objs.some(o => div(sumar(filasPos.filter(x => nombrePos(x) === n && (pg.anuncios[x.ad] || {}).obj === o)).inversion, totObj(o)) >= .03));
  const series = grandes.concat(['Otras posiciones']);
  const PAL = [C.ig, C.rosaClaro, C.fb, C.azul, C.cian, C.verde, C.ambar, '#a855f7', '#64748b', C.gris];
  mkMulti('p_plat', objs.map(o => NOMBRE_OBJ[o]), series.map((n, i) => ({ type: 'bar', label: n, color: PAL[i % PAL.length],
    data: objs.map(o => div(sumar(filasPos.filter(x => (pg.anuncios[x.ad] || {}).obj === o && (n === 'Otras posiciones' ? !grandes.includes(nombrePos(x)) : nombrePos(x) === n))).inversion, totObj(o))) })),
    { apilado: true, fmt: 'pct1' });
  document.getElementById('p_plat_ley').innerHTML = leyenda(series.map((n, i) => [n, PAL[i % PAL.length]]));
}

// Una ficha que dice, por campaña, a qué optimiza Meta y con qué atribución.
const RED_NOMBRE = { instagram: 'Instagram', facebook: 'Facebook', audience_network: 'Audience Network', threads: 'Threads', messenger: 'Messenger' };
const POS_NOMBRE = { instagram_reels: 'Reels', instagram_stories: 'Historias', feed: 'Feed', instagram_search: 'Búsqueda',
  instagram_explore: 'Explorar', facebook_reels: 'Reels', facebook_reels_overlay: 'Reels (overlay)', facebook_stories: 'Historias',
  instream_video: 'Video in-stream', marketplace: 'Marketplace', right_hand_column: 'Columna derecha', search: 'Búsqueda',
  facebook_profile_feed: 'Feed de perfil', facebook_notification: 'Notificaciones', an_classic: 'Audience Network', threads_feed: 'Feed', video_feeds: 'Feed de videos' };
const nombrePos = x => `${RED_NOMBRE[x.red] || x.red} · ${POS_NOMBRE[x.pos] || (x.pos || '').replace(/_/g, ' ')}`;

function tablaPosiciones(filas, plat) {
  const ads = new Set(filas.map(f => f.ad));
  const grupos = {};
  plat.filter(x => ads.has(x.ad)).forEach(x => { const k = nombrePos(x); (grupos[k] = grupos[k] || { red: x.red, filas: [] }).filas.push(x); });
  const tot = sumar(plat.filter(x => ads.has(x.ad)));
  const rows = Object.entries(grupos).map(([k, g]) => ({ k, red: g.red, s: sumar(g.filas) })).filter(r => r.s.inversion >= 0.5 || r.s.impresiones >= 500)
    .sort((a, b) => b.s.inversion - a.s.inversion);
  if (!rows.length) return '<div class="empty-metric">Sin datos por posición.</div>';
  // Mejor y peor costo por columna, solo entre posiciones con ≥5% de la inversión.
  const relevantes = rows.filter(r => div(r.s.inversion, tot.inversion) >= .05);
  const cols = { cpm: r => div(r.s.inversion * 1000, r.s.impresiones), cpr: r => div(r.s.inversion, r.s.recordacion),
                 cpc: r => div(r.s.inversion, r.s.compras), cpl: r => div(r.s.inversion, r.s.clics_link) };
  const extremos = {};
  Object.entries(cols).forEach(([c, f]) => { const v = relevantes.map(f).filter(x => x != null); if (v.length > 1) extremos[c] = [Math.min(...v), Math.max(...v)]; });
  const marca = (c, v) => v == null || !extremos[c] ? '' : v === extremos[c][0] ? 'mejor' : v === extremos[c][1] ? 'peor' : '';
  const celda = (c, r, fmt) => { const v = cols[c](r); return `<td class="${marca(c, v)}">${fmt(v)}</td>`; };
  const color = r => r.red === 'instagram' ? C.ig : r.red === 'facebook' ? C.fb : C.gris;
  return `<div class="t-wrap"><table class="t">
    <tr><th>Plataforma · posición</th><th>Inversión</th><th style="text-align:left">% de la inversión</th><th>Impresiones</th><th>CPM</th><th>CTR al sitio</th><th>Costo x clic</th>
      <th>Landing</th><th>Evento Lead</th><th>Purchase</th><th>Costo x Purchase</th><th>Recordación</th><th>Costo x recordación</th><th>ThruPlay ÷ impr.</th></tr>
    ${rows.map(r => `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color(r)};margin-right:6px"></span><b>${r.k}</b></td>
      <td><b>${usd(r.s.inversion)}</b></td>
      <td style="text-align:left"><span class="barra-pct"><i style="width:${100 * (div(r.s.inversion, tot.inversion) || 0)}%;background:${color(r)}"></i></span>${pct(div(r.s.inversion, tot.inversion), 0)}</td>
      <td>${n0(r.s.impresiones)}</td>${celda('cpm', r, usd)}<td>${pct(div(r.s.clics_link, r.s.impresiones))}</td>${celda('cpl', r, usd)}
      <td>${n0(r.s.landing)}</td><td>${n0(r.s.leads)}</td><td>${r.s.compras ? n0(r.s.compras) : '—'}</td>${celda('cpc', r, usd)}
      <td>${r.s.recordacion ? n0(r.s.recordacion) : '—'}</td>${celda('cpr', r, usd)}<td>${pct(div(r.s.thruplay, r.s.impresiones), 1)}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${usd(tot.inversion)}</b></td><td></td><td><b>${n0(tot.impresiones)}</b></td><td>${usd(div(tot.inversion * 1000, tot.impresiones))}</td>
      <td>${pct(div(tot.clics_link, tot.impresiones))}</td><td>${usd(div(tot.inversion, tot.clics_link))}</td><td>${n0(tot.landing)}</td><td>${n0(tot.leads)}</td>
      <td>${n0(tot.compras)}</td><td>${usd(div(tot.inversion, tot.compras))}</td><td>${n0(tot.recordacion)}</td><td>${usd(div(tot.inversion, tot.recordacion))}</td><td>${pct(div(tot.thruplay, tot.impresiones), 1)}</td></tr>
  </table></div>`;
}

function fichaOptimiza(pg, obj) {
  const camps = Object.entries(pg.optimizacion || {}).filter(([cid]) => {
    const o = ((pg.alcance || {}).campanas || {})[cid] || {};
    return obj === 'todos' || o.obj === obj;
  });
  if (!camps.length) return '';
  const nombreCamp = cid => ((pg.comparativo || []).find(c => c.campana_id === cid) || {}).campana || cid;
  return `<div style="grid-column: span 2"><div class="k">Optimiza a ${ayuda('optimiza')}</div>
    ${camps.map(([cid, sets]) => {
      const obj = (((pg.alcance || {}).campanas || {})[cid] || {}).obj;
      const unicos = [...new Map(sets.map(s => [`${s.meta}|${s.evento}|${s.atribucion}`, s])).values()];
      return `<div class="opt"><b>${NOMBRE_OBJ[obj] || ''}:</b> ${unicos.map(s => `${s.meta}${s.evento ? ' · evento <b>' + s.evento.charAt(0) + s.evento.slice(1).toLowerCase() + '</b>' : ''} · atribución ${s.atribucion}`).join('; ')}
        <br><span style="color:var(--text-muted-3)">${nombreCamp(cid)}</span></div>`;
    }).join('')}</div>`;
}

function panelComparativo(c) {
  const r = c.rosa, o = c.otros;
  const filas = [
    ['CPM', div(r.inversion * 1000, r.impresiones), div(o.inversion * 1000, o.impresiones), usd, true],
    ['CTR al sitio', div(r.clics_link, r.impresiones), div(o.clics_link, o.impresiones), v => pct(v), false],
    ['Costo por clic al sitio', div(r.inversion, r.clics_link), div(o.inversion, o.clics_link), usd, true],
    ['Costo por visita a la landing', div(r.inversion, r.landing), div(o.inversion, o.landing), usd, true],
    ['Costo por evento Lead', div(r.inversion, r.leads), div(o.inversion, o.leads), usd, true],
    ['Costo por evento Purchase', div(r.inversion, r.compras), div(o.inversion, o.compras), usd, true],
  ];
  if (c.obj === 'alcance') filas.push(['Costo por recordación', div(r.inversion, r.recordacion), div(o.inversion, o.recordacion), usd, true]);
  filas.push(['Costo por ThruPlay', div(r.inversion, r.thruplay), div(o.inversion, o.thruplay), usd, true]);
  return `<div class="panel"><h3><span class="delta neutro" style="margin-right:6px;background:${COLOR_OBJ[c.obj]};color:#fff">${NOMBRE_OBJ[c.obj]}</span>${c.campana}</h3>
    <div class="cap">${diaMes(c.desde)} – ${diaMes(c.hasta)} · Rosa ${usd(r.inversion)} (${pct(div(r.inversion, r.inversion + (o.inversion || 0)), 0)} de la campaña) · otros ${usd(o.inversion)}</div>
    <table><tr><th></th><th>Rosa</th><th>Otros anuncios</th><th>Rosa vs otros</th></tr>
    ${filas.filter(f => f[1] != null || f[2] != null).map(([n, a, b, f, menos]) => `<tr><td>${n}</td><td><b>${f(a)}</b></td><td>${f(b)}</td><td>${delta(a, b, menos)}</td></tr>`).join('')}
    </table></div>`;
}

function tablaPiezas(filas, A, plat) {
  const grupos = {};
  filas.forEach(f => { const a = A[f.ad] || {}; const k = a.pieza || f.ad; (grupos[k] = grupos[k] || { filas: [], ads: new Set(), objs: new Set() }); grupos[k].filas.push(f); grupos[k].ads.add(f.ad); grupos[k].objs.add(f.obj); });
  const rows = Object.entries(grupos).map(([k, g]) => ({ k, g, s: sumar(g.filas) })).sort((a, b) => b.s.inversion - a.s.inversion);
  if (!rows.length) return '<div class="empty-metric">Sin anuncios con este objetivo.</div>';
  const nombre = k => k.replace(/^Rosa_?/, '').replace(/_/g, ' ').replace(/^(\d) /, '$1 · ') || k;
  return `<div class="t-wrap"><table class="t">
    <tr><th>Pieza</th><th>Objetivo</th><th>Inversión</th><th>Impresiones</th><th>FB / IG</th><th>CPM</th><th>CTR al sitio</th><th>Landing</th><th>Evento Lead</th><th>Costo x Lead</th><th>Purchase</th><th>ThruPlay ÷ impr.</th></tr>
    ${rows.map(({ k, g, s }) => {
      const mini = [...g.ads].find(i => (A[i] || {}).mini);
      const pf = plat.filter(x => g.ads.has(x.ad));
      const fb = pf.filter(x => x.plat === 'facebook').reduce((a, x) => a + (x.impresiones || 0), 0);
      const ig = pf.filter(x => x.plat === 'instagram').reduce((a, x) => a + (x.impresiones || 0), 0);
      const activos = [...g.ads].filter(i => (A[i] || {}).estado === 'ACTIVE').length;
      return `<tr><td><div class="pz">${mini ? `<img src="miniaturas/${mini}.jpg" alt="Ver la pieza" loading="lazy" data-pieza="${k}" title="Clic para ver la pieza">` : '<span class="sin"></span>'}
        <div><b>${nombre(k)}</b><small>${g.ads.size} anuncio${g.ads.size === 1 ? '' : 's'}${activos ? ` · ${activos} activo${activos === 1 ? '' : 's'}` : ' · en pausa'}</small></div></div></td>
        <td>${[...g.objs].map(o => NOMBRE_OBJ[o]).join(', ')}</td><td><b>${usd(s.inversion)}</b></td><td>${n0(s.impresiones)}</td>
        <td title="Facebook ${n0(fb)} · Instagram ${n0(ig)}"><span class="barra-pl"><i style="width:${fb + ig ? 100 * ig / (fb + ig) : 0}%;margin-left:auto"></i></span> ${fb + ig ? pct(ig / (fb + ig), 0) : '—'} IG</td>
        <td>${usd(div(s.inversion * 1000, s.impresiones))}</td><td>${pct(div(s.clics_link, s.impresiones))}</td><td>${n0(s.landing)}</td>
        <td>${n0(s.leads)}</td><td>${usd(div(s.inversion, s.leads))}</td><td>${s.compras ? n0(s.compras) : '—'}</td><td>${pct(div(s.thruplay, s.impresiones), 1)}</td></tr>`;
    }).join('')}
  </table></div>`;
}

// ── Impacto orgánico: la cuenta orgánica total (sin anuncios) y lo que aportó la Rosa ──────────
const OC = () => D.organico_cuenta || {};
const serieOC = (red, k) => ((OC()[red] || {})[k]) || [];
function promOC(red, k, a, b) {
  const v = [];
  (OC().dias || []).forEach((d, i) => { const x = serieOC(red, k)[i]; if (d >= a && d <= b && x != null) v.push(x); });
  if (!v.length) return null;
  const total = v.reduce((s, x) => s + x, 0);
  return { prom: total / v.length, dias: v.length, total };
}
const sumaPosts = (ps, k) => ps.reduce((a, p) => a + (p[k] || 0), 0);
const vistasOrgPost = p => p.vistas_org != null ? p.vistas_org : (p.vistas || 0);
function fichaDelta(titulo, despues, antes, extra = '') {
  return `<div><div class="k">${titulo}</div><div class="v">${n0(despues)} <small style="font-size:12px;font-weight:500">/día</small> ${delta(despues, antes)}</div>
    <div class="d">antes: ${n0(antes)}/día${extra}</div></div>`;
}
function fichaAporte(titulo, rosa, total, cola) {
  const p = total ? Math.min(1, rosa / total) : null;
  return `<div><div class="k">${titulo} ${ayuda('aporte_rosa')}</div><div class="v">${p == null ? '—' : pct(p, 0)}</div>
    <div class="d">${fmtMil(rosa)} de ${fmtMil(total)} ${cola}</div></div>`;
}

    </div>

// Acumulado de la Rosa: Meta solo da el total de por vida de cada post. Donde hay foto diaria
// (`historia`) se usa; el último día siempre lleva el total de hoy. Sin foto, el día queda vacío.
function acumRosa(posts, red, dias) {
  const ps = posts.filter(p => p.red === red), H = D.historia || {};
  const vista = (p, snap) => red === 'fb' && p.vistas_org != null && p.vistas ? (snap.vistas || 0) * p.vistas_org / p.vistas : (snap.vistas || 0);
  return dias.map((d, i) => {
    if (i === dias.length - 1) return ps.reduce((s, p) => s + (red === 'fb' ? vistasOrgPost(p) : (p.vistas || 0)), 0);
    const con = ps.filter(p => (H[p.id] || {})[d]);
    return con.length ? con.reduce((s, p) => s + vista(p, H[p.id][d]), 0) : null;
  });
}

      <div class="t-wrap" style="align-self:start"><table class="t">
        <tr><th>Pieza o canal</th><th>Comentarios</th><th>IG</th><th>FB</th><th>Likes</th><th>Sin respuesta</th></tr>
        ${filasG.map(([k, g]) => `<tr><td><span class="delta neutro" style="background:${g.canal === 'pago' ? C.rosa : C.verde};color:#fff;margin-right:6px">${g.canal === 'pago' ? 'Pago' : 'Orgánico'}</span><b>${esc(k)}</b></td>
          <td><b>${g.total}</b></td><td>${g.ig || '—'}</td><td>${g.fb || '—'}</td><td>${g.likes || '—'}</td><td>${g.sin ? `<b style="color:#b45309">${g.sin}</b>` : '—'}</td></tr>`).join('')}
      </table></div>
    </div>
  </div>
  <div class="section">
    <h2>Todos los comentarios <small style="font-weight:500;color:var(--text-muted-3);font-size:12px">${lista.length} con los filtros de arriba · del más reciente al más viejo</small></h2>
    ${lista.length ? `<div class="coms">${lista.map(c => `<div class="com ${c.respondido ? '' : 'pend'}" style="--c:${c.canal === 'pago' ? C.rosa : C.verde}">
      <div class="meta"><span class="tag" style="background:${c.red === 'ig' ? C.ig : C.fb}">${c.red === 'ig' ? 'Instagram' : 'Facebook'}</span>
        <span class="tag" style="background:${c.canal === 'pago' ? C.rosa : C.verde}">${c.canal === 'pago' ? 'Pago' : 'Orgánico'}</span>
        ${c.piezas.length ? `<span class="tag gris">${esc(c.piezas.map(nombrePieza).join(' / '))}</span>` : ''}
        <span class="tag ${c.respondido ? 'ok' : 'no'}">${c.respondido ? '✓ Respondido' : 'Sin respuesta'}</span></div>
      <div class="txt">${esc(c.texto) || '<i style="color:var(--text-muted-3)">(sin texto: sticker o imagen)</i>'}</div>
      <div class="pie"><span>${c.autor ? esc(c.autor) + ' · ' : ''}${diaMes(c.fecha)}${c.likes ? ` · ${c.likes} ♥` : ''}${c.respuestas ? ` · ${c.respuestas} respuesta${c.respuestas === 1 ? '' : 's'}` : ''}</span>
        ${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">Ver en Meta ↗</a>` : ''}</div></div>`).join('')}</div>`
      : '<div class="empty-metric">No hay comentarios con estos filtros.</div>'}
  </div>`;
  const porDiaC = canal => dias.map(d => todos.filter(c => c.canal === canal && c.fecha === d).length || null);
  mkMulti('cm_dia', dias, [{ type: 'bar', label: 'Orgánico', color: C.verde, data: porDiaC('organico') },
                           { type: 'bar', label: 'Pago', color: C.rosa, data: porDiaC('pago') }], { apilado: true });
}

// ── Efecto en la cuenta: orgánico, pago, seguidores y reacciones ─────────────────────────────
// Todo sale de `organico_cuenta` (días cerrados por Meta, ventana corregida). Cada panel: promedio por
// día desde el 2-oct contra los 14 días anteriores, y su gráfica con la línea del arranque.
let _pend = [];
function sumaDia(red, keys, signo = []) {
  return (OC().dias || []).map((d, i) => {
    const vals = keys.map(k => serieOC(red, k)[i]);
    return vals.every(v => v == null) ? null : vals.reduce((a, v, j) => a + (v || 0) * (signo[j] || 1), 0);
  });
}
function promSerie(serie, a, b) {
  const v = []; (OC().dias || []).forEach((d, i) => { if (d >= a && d <= b && serie[i] != null) v.push(serie[i]); });
  return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
}
// Un panel con su promedio antes/después. `capas`: [[clave, nombre, color, signo]] (signo -1 = abajo del cero).
function panelOC(id, titulo, red, capas, o = {}) {
  const oc = OC();
  const total = sumaDia(red, capas.map(c => c[0]), capas.map(c => c[3] || 1));
  const desp = promSerie(total, oc.despues[0], oc.dias[oc.dias.length - 1]), ant = promSerie(total, oc.antes[0], oc.antes[1]);
  _pend.push(() => {
    const iIni = oc.dias.indexOf(oc.despues[0]);
    mkMulti(id, oc.dias, capas.map(([k, n, c, sg]) => ({ type: o.linea ? 'line' : 'bar', label: n, color: c,
      data: serieOC(red, k).map(v => v == null ? null : v * (sg || 1)) })), { apilado: !o.linea && capas.length > 1, marcas: iIni >= 0 ? [iIni] : [], fmt: o.fmt });
  });
  return `<div class="panel mini"><h3>${titulo}</h3>
    ${o.sinTot ? '' : `<div class="tot">${n0(desp)} <small style="font-size:11.5px;font-weight:500;color:var(--text-muted-2)">/día</small> ${delta(desp, ant, o.menosEsMejor)}</div>`}
    <div class="cap">${o.cap || `antes: ${n0(ant)}/día`}</div><div class="ch chico"><canvas id="${id}"></canvas></div>
    ${capas.length > 1 ? leyenda(capas.map(c => [c[1], c[2]])) : ''}</div>`;
}

function renderCuenta(app) {
  const oc = OC();
  if (!oc.dias) { app.innerHTML = estado(oc, 'Orgánico de la cuenta'); return; }
  _pend = [];
  const pg = D.pagado || {};
  const [a0, a1] = oc.antes, d0 = oc.despues[0], d1 = oc.dias[oc.dias.length - 1];
  const tot = (red, k) => (promOC(red, k, d0, d1) || {}).total || 0;
  // Parte Rosa de la pauta: impresiones de los anuncios Rosa en cada red, mismos días.
  const rosaImp = red => (pg.plataforma || []).filter(x => x.red === red).reduce((s, x) => s + (x.impresiones || 0), 0);
  const filasRosa = (pg.filas || []).filter(f => f.d >= d0 && f.d <= d1);
  const R = sumar(filasRosa);
  const sig = red => serieOC(red, 'seguidores');
  // Neto = altas − bajas desde el arranque (la foto diaria del total no siempre llega tan atrás).
  const netoSeg = red => {
    const alt = red === 'ig' ? sumaDia('ig', ['altas']) : sumaDia('fb', ['altas_pag', 'altas_org']), baj = serieOC(red, 'bajas');
    let s = 0, hay = false;
    oc.dias.forEach((d, i) => { if (d >= d0 && alt[i] != null) { s += alt[i] - (baj[i] || 0); hay = true; } });
    return hay ? s : null;
  };
  const negPct = (a, b) => { const p = promSerie(sumaDia('fb', ['r_pos']), a, b), n = promSerie(sumaDia('fb', ['r_neg']), a, b); return p + n ? n / (p + n) : null; };
  const fbPosts = ((D.organico || {}).posts || []).filter(p => p.red === 'fb');
  const tiposR = ['like', 'love', 'care', 'haha', 'wow', 'sorry', 'anger'];
  const NOMBRE_R = { like: 'Me gusta', love: 'Me encanta', care: 'Me importa', haha: 'Me divierte', wow: 'Me asombra', sorry: 'Me entristece', anger: 'Me enoja' };
  const rosaR = tiposR.map(k => fbPosts.reduce((s, p) => s + (p['r_' + k] || 0), 0));

  app.innerHTML = estado(oc, 'Orgánico de la cuenta') + `
  <div class="section">
    <h2>Efecto en la cuenta ${ayuda('cuenta')}</h2>
    <p class="hint">Toda la cuenta de Tuhabi, promedio por día del ${diaMes(d0)} al ${diaMes(d1)} contra el ${diaMes(a0)}–${diaMes(a1)}.
      Lo orgánico y lo pago van por separado; en gris los días antes de la acción, la línea punteada es el arranque.</p>

    <div class="bloque"><div class="bloque-h">Efecto orgánico ${ayuda('impacto_org')}</div>
      <div class="bloque-p">Lo que la cuenta movió sin anuncios.</div></div>
    <div class="red-h"><i style="background:${C.ig}"></i>Instagram</div>
    <div class="cuatro">
      ${panelOC('e_ig_v', 'Vistas orgánicas', 'ig', [['vistas_org', 'Vistas', C.ig]])}
      ${panelOC('e_ig_a', `Alcance orgánico ${ayuda('alcance_formato')}`, 'ig', [['alcance_org', 'Alcance', C.ig]])}
      ${panelOC('e_ig_i', 'Interacciones orgánicas', 'ig', [['likes_org', 'Likes', C.ig], ['comentarios_org', 'Comentarios', C.ambar], ['compartidos_org', 'Compartidos', C.azul], ['guardados_org', 'Guardados', C.verde]])}
      ${panelOC('e_ig_c', 'Compartidos y guardados', 'ig', [['compartidos_org', 'Compartidos', C.azul], ['guardados_org', 'Guardados', C.verde]])}
    </div>
    <div class="red-h"><i style="background:${C.fb}"></i>Facebook</div>
    <div class="tres">
      ${panelOC('e_fb_v', 'Vistas orgánicas', 'fb', [['vistas_org', 'Vistas', C.fb]])}
      ${panelOC('e_fb_vid', 'Reproducciones de video orgánicas', 'fb', [['video_org', 'Reproducciones', C.fb]])}
      ${panelOC('e_fb_alt', 'Seguidores nuevos orgánicos', 'fb', [['altas_org', 'Altas orgánicas', C.fb]])}
    </div>

    <div class="bloque"><div class="bloque-h">Efecto pago ${ayuda('efecto_pago')}</div>
      <div class="bloque-p">Toda la pauta de la cuenta (todas las campañas). Los anuncios Rosa fueron
        <b>${pct(div(rosaImp('instagram'), tot('ig', 'vistas_ads')), 1)}</b> de las vistas de anuncios en Instagram y
        <b>${pct(div(rosaImp('facebook'), tot('fb', 'vistas_ads')), 1)}</b> en Facebook desde el ${diaMes(d0)}.</div></div>
    <div class="red-h"><i style="background:${C.ig}"></i>Instagram</div>
    <div class="tres">
      ${panelOC('p_ig_v', 'Vistas de anuncios', 'ig', [['vistas_ads', 'Vistas', C.ig]])}
      ${panelOC('p_ig_i', 'Interacciones con anuncios', 'ig', [['likes_ads', 'Likes', C.ig], ['comentarios_ads', 'Comentarios', C.ambar], ['compartidos_ads', 'Compartidos', C.azul], ['guardados_ads', 'Guardados', C.verde]])}
      ${panelOC('p_ig_a', 'Alcance de anuncios', 'ig', [['alcance_ads', 'Alcance', C.ig]])}
    </div>
    <div class="red-h"><i style="background:${C.fb}"></i>Facebook</div>
    <div class="tres">
      ${panelOC('p_fb_v', 'Vistas de anuncios', 'fb', [['vistas_ads', 'Vistas', C.fb]])}
      ${panelOC('p_fb_vid', 'Reproducciones de video pagadas', 'fb', [['video_ads', 'Reproducciones', C.fb]])}
      ${panelOC('p_fb_alt', 'Seguidores nuevos por anuncios', 'fb', [['altas_pag', 'Altas pagadas', C.fb]])}
    </div>
    <div class="red-h"><i style="background:${C.rosa}"></i>Anuncios Rosa <small>del ${diaMes(d0)} al ${diaMes(d1)}</small></div>
    <div class="ficha">
      <div><div class="k">Reacciones</div><div class="v">${n0(R.reacciones)}</div><div class="d">${n0(R.comentarios)} comentarios</div></div>
      <div><div class="k">Compartidos</div><div class="v">${n0(R.compartidos)}</div><div class="d">${n0(R.guardados)} guardados</div></div>
      <div><div class="k">"Ya no me gusta" ${ayuda('reacciones')}</div><div class="v">${n0(R.unlikes)}</div><div class="d">${pct(div(R.unlikes, R.reacciones), 0)} de las reacciones</div></div>
      <div><div class="k">Interacciones por mil impresiones</div><div class="v">${(div(interSinVideo(R) * 1000, R.impresiones) || 0).toFixed(2)}</div><div class="d">reacciones + comentarios + compartidos + guardados</div></div>
    </div>

    <div class="bloque"><div class="bloque-h">Seguidores ${ayuda('seguidores')}</div>
      <div class="bloque-p">Altas arriba del cero, bajas abajo. Facebook separa las altas que trajeron los anuncios; Instagram no.</div></div>
    <div class="ficha">
      <div><div class="k">Instagram · neto (altas − bajas) desde el ${diaMes(d0)}</div><div class="v">${netoSeg('ig') == null ? '—' : (netoSeg('ig') >= 0 ? '+' : '') + n0(netoSeg('ig'))}</div>
        <div class="d">${n0([...sig('ig')].reverse().find(v => v != null))} seguidores hoy</div></div>
      <div><div class="k">Facebook · neto (altas − bajas) desde el ${diaMes(d0)}</div><div class="v">${netoSeg('fb') == null ? '—' : (netoSeg('fb') >= 0 ? '+' : '') + n0(netoSeg('fb'))}</div>
        <div class="d">${n0([...sig('fb')].reverse().find(v => v != null))} seguidores hoy</div></div>
    </div>
    <div class="cuatro">
      ${panelOC('s_ig_ab', 'Instagram · altas y bajas', 'ig', [['altas', 'Altas', C.ig], ['bajas', 'Bajas', C.gris, -1]], { cap: `altas ${n0(promSerie(serieOC('ig', 'altas'), d0, d1))}/día · bajas ${n0(promSerie(serieOC('ig', 'bajas'), d0, d1))}/día (neto por día arriba)` })}
      ${panelOC('s_ig_t', 'Instagram · seguidores', 'ig', [['seguidores', 'Seguidores', C.ig]], { linea: true, sinTot: true, cap: 'total por día' })}
      ${panelOC('s_fb_ab', 'Facebook · altas y bajas', 'fb', [['altas_pag', 'Altas pagadas', C.rosa], ['altas_org', 'Altas orgánicas', C.fb], ['bajas', 'Bajas', C.gris, -1]], { cap: `bajas ${n0(promSerie(serieOC('fb', 'bajas'), d0, d1))}/día (neto por día arriba)` })}
      ${panelOC('s_fb_t', 'Facebook · seguidores', 'fb', [['seguidores', 'Seguidores', C.fb]], { linea: true, sinTot: true, cap: 'total por día' })}
    </div>

    <div class="bloque"><div class="bloque-h">Reacciones positivas y negativas ${ayuda('reacciones')}</div>
      <div class="bloque-p">Solo Facebook (Instagram no tiene tipos de reacción). Las de la página mezclan pauta y orgánico.</div></div>
    <div class="ficha">
      <div><div class="k">% negativas en la página</div><div class="v">${pct(negPct(d0, d1), 2)} ${delta(negPct(d0, d1), negPct(a0, a1), true)}</div><div class="d">antes: ${pct(negPct(a0, a1), 2)}</div></div>
      <div><div class="k">Posts Rosa · negativas</div><div class="v">${n0(rosaR[5] + rosaR[6])}</div><div class="d">de ${n0(rosaR.reduce((a, b) => a + b, 0))} reacciones en ${fbPosts.length} posts</div></div>
    </div>
    <div class="tres">
      ${panelOC('r_fb_pn', 'Página · positivas y negativas por día', 'fb', [['r_pos', 'Positivas', C.verde], ['r_neg', 'Negativas', '#dc2626', -1]], { cap: 'negativas abajo del cero' })}
      <div class="panel mini"><h3>Posts Rosa · reacciones por tipo</h3><div class="cap">De por vida, ${fbPosts.length} posts de Facebook</div><div class="ch chico"><canvas id="r_rosa_tipo"></canvas></div></div>
      <div class="panel mini"><h3>Anuncios Rosa · reacciones y "ya no me gusta"</h3><div class="cap">Por día</div><div class="ch chico"><canvas id="r_ads"></canvas></div>
        ${leyenda([['Reacciones', C.verde], ['Ya no me gusta', '#dc2626']])}</div>
    </div>
  </div>`;
  _pend.forEach(f => f());
  mkMulti('r_rosa_tipo', tiposR.map(k => NOMBRE_R[k]), [{ type: 'bar', label: 'Reacciones', data: rosaR,
    color: tiposR.map(k => ['sorry', 'anger'].includes(k) ? '#dc2626' : C.verde) }]);
  const diasR = rangoDias(D.config.inicio_pagado, (pg.filas || []).map(f => f.d).sort().pop() || d1);
  mkMulti('r_ads', diasR, [{ type: 'bar', label: 'Reacciones', color: C.verde, data: porDia(pg.filas || [], diasR, s => s.reacciones) },
                            { type: 'bar', label: 'Ya no me gusta', color: '#dc2626', data: porDia(pg.filas || [], diasR, s => -(s.unlikes || 0)) }], { apilado: true });
}

// ── Arranque ──────────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const h = e.target.closest('.help-btn[data-ayuda]');
  if (h) { e.preventDefault(); const [t, b] = AYUDA[h.dataset.ayuda]; document.getElementById('ayudaCuerpo').innerHTML = `<h3>${t}</h3>${b}`; document.getElementById('ayuda').showModal(); return; }
  const pz = e.target.closest('img[data-pieza]');
  if (pz) { abrirPieza(pz.dataset.pieza); return; }
  const t = e.target.closest('.tab[data-hoja]');
  if (t) { HOJA = t.dataset.hoja; render(); window.scrollTo(0, 0); return; }
  const fc = e.target.closest('.chip[data-canal], .chip[data-red], .chip[data-pend]');
  if (fc) {
    if (fc.dataset.canal) F_CANAL = fc.dataset.canal;
    else if (fc.dataset.red) F_RED = fc.dataset.red;
    else F_PEND = !F_PEND;
    render(); return;
  }
  const o = e.target.closest('.chip[data-obj]');
  if (o && !o.disabled) { OBJ = o.dataset.obj; render(); }
});

fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  D = d;
  if (OBJ !== 'todos' && !objetivosPresentes().includes(OBJ)) OBJ = 'todos';
  const ultimo = ((D.pagado || {}).filas || []).map(f => f.d).sort().pop();
  document.getElementById('cobertura').textContent =
    `Actualizado ${(D.generated_at || '').slice(0, 16).replace('T', ' ')} UTC${ultimo ? ' · pauta hasta el ' + diaMes(ultimo) : ''}`;
  render();
}).catch(e => { document.getElementById('app').innerHTML = `<div class="empty-metric">No se pudo leer data.json: ${e}</div>`; });
</script>
</body>
</html>
