name: Actualizar Salud de marca (diario)

# Corre salud-marca/build.py: Brand Lift (Meta), exit poll y tráfico por plaza (BigQuery) y el
# encuestador (API pública de Pulso). Hasta el 25-sep NINGÚN workflow lo corría: se actualizaba
# solo cuando alguien lo corría a mano, y Brand Lift quedó congelado desde el 31-ago.
#
# El panel de TV (metrics.tv) NO lo toca: lo escribe tv-diario.yml, y build.py lo conserva al
# reescribir el archivo (build.conservar_ajenos).
#
# 7:41 CDMX, con respaldo a las 13:41: minuto no redondo porque GitHub descarta más los cron del
# minuto 0, y aun así el 7-oct se saltó el de la mañana. Con la fila de tendencia diaria ya no
# alcanza con "lo recupera el siguiente día". Correr dos veces no gasta cuota de más: Brand Lift
# llama a Meta una sola vez por día (build._refresco_reciente).
#
# ⚠ Este es el ÚNICO workflow que debe correr build.py: tiene los tokens de Meta. El cron del hub
# (update-data.yml, run_queries.py) lo corría también, sin tokens, y dejaba Brand Lift y seguidores
# en "stale"; por eso meta.json declara "skip_hub_cron": true (7-oct-2026).

on:
  schedule:
    - cron: '41 13 * * *'   # 07:41 CDMX
    - cron: '41 19 * * *'   # 13:41 CDMX (respaldo)
  workflow_dispatch:

# Mismo grupo que tv-diario.yml a propósito: los dos escriben salud-marca/data.json (una sola
# línea), así que dos commits cruzados siempre chocarían. En fila, cada uno parte del último.
concurrency:
  group: salud-marca-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar pytest y Pillow
        # Pillow achica las miniaturas del top de Instagram (~10 KB cada una en vez de ~100 KB).
        run: python -m pip install --quiet pytest pillow

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar contra BigQuery
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/adc.json
          # Mismo criterio que update-data.yml: el proyecto que FACTURA va fijo.
          gcloud config set project sellers-main-prod
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=/tmp/adc.json" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json" >> $GITHUB_ENV

      - name: Tests
        run: python -m pytest salud-marca/tests/ -q

      - name: Construir data.json
        env:
          # Token del system user "AgenteCreativo" (5-oct-2026): Brand Lift + seguidores FB/IG.
          # Reemplaza a META_ACCESS_TOKEN, que Meta bloquea desde el 25-sep. META_PCOM_TOKEN queda
          # de respaldo (build.py lo prueba si el primero sale bloqueado). Si Meta rechaza los
          # dos, Brand Lift y seguidores salen "stale" desde el caché y el resto se actualiza igual.
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_CREATIVO_TOKEN }}
          META_PCOM_TOKEN: ${{ secrets.META_PCOM_TOKEN }}
        run: cd salud-marca && python3 build.py

      - name: Commitear
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # questions.json: build.py mapea solo los estudios nuevos de Brand Lift (auto_map).
          # -A en ig_miniaturas: build.py agrega las del top nuevo y borra las que salieron.
          git add salud-marca/data.json salud-marca/brand_lift_cache.json \
                  salud-marca/social_cache.json salud-marca/questions.json
          git add -A salud-marca/ig_miniaturas salud-marca/fb_miniaturas
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "data(salud-marca): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then echo "push OK"; exit 0; fi
            git pull --rebase --autostash origin ${{ github.ref_name }} || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
