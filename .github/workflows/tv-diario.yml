name: Reporte diario TV → Google Chat

# 15:00 UTC = 09:00 CDMX, todos los días. La hora NO es arbitraria: se midió que el export de
# GA4 del día D aterriza en BigQuery entre las 13:00 y 13:48 UTC del día D+1, así que las 15:00
# dejan 1-2 horas de colchón. México no tiene horario de verano desde 2022, así que 15:00 UTC
# son siempre las 09:00 en CDMX y no hay que ajustar el cron dos veces al año.
#
# Workflow APARTE del de update-data.yml a propósito: comparten credenciales de BigQuery pero
# nada más, y un fallo de este no debe tocar la actualización del hub.

# RELOJ EXTERNO: el disparo principal NO es este cron sino un servicio externo que llama a la
# API de GitHub (`workflow_dispatch` con `solo_si_falta=true`), porque GitHub descarta cron en
# horas de carga: el 25-sep no corrió ninguno de los cuatro. GitHub nunca descarta un
# `workflow_dispatch`. Ver salud-marca/tv/README.md, "Reloj externo".
#
# CUATRO horarios (hora CDMX): 9:07, 9:31, 10:17 y 11:23, como respaldo. GitHub no garantiza los cron: en
# horas de carga los atrasa o directamente los salta, sobre todo los que caen en el minuto 0.
# El 25-sep el de las 15:00 UTC no corrió. Con cuatro intentos, uno sale. Los tres de respaldo
# NO duplican el mensaje: `--solo-si-falta` termina sin hacer nada si ese día ya se envió
# (ver `ultimo_envio.json`). Si un envío falla, no se marca y el siguiente horario reintenta.
on:
  schedule:
    - cron: '7 15 * * *'    # 09:07 CDMX
    - cron: '31 15 * * *'   # 09:31 CDMX
    - cron: '17 16 * * *'   # 10:17 CDMX
    - cron: '23 17 * * *'   # 11:23 CDMX
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Día a reportar (YYYY-MM-DD). Vacío = ayer'
        required: false
      enviar:
        description: 'Postear a Google Chat (false = solo calcular y ver el log)'
        type: boolean
        default: true
      solo_si_falta:
        description: 'No hacer nada si el reporte de ese día ya salió (lo usa el reloj externo)'
        type: boolean
        default: false

# Nunca dos a la vez: si GitHub atrasa varios horarios y los dispara juntos, corren en fila y el
# segundo ya ve el marcador que dejó el primero. `cancel-in-progress: false` para no matar un
# envío a la mitad.
concurrency:
  group: tv-diario
  cancel-in-progress: false

jobs:
  reporte:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para commitear el panel de TV en salud-marca/data.json

    steps:
      # `ref` explícito: sin él, checkout baja el commit del momento en que se DISPARÓ la
      # ejecución, y una que esperó en la fila no vería el `ultimo_envio.json` de la anterior.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El job corre con pura stdlib; solo pytest hace falta, para el paso de tests. openpyxl
      # solo lo usa `ingesta.py`, que convierte el xlsx de la central y se ejecuta en local.
      - name: Instalar pytest
        run: python -m pip install --quiet pytest

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar contra BigQuery
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/adc.json
          # Mismo criterio que update-data.yml: el proyecto que FACTURA va fijo. Estas
          # credenciales no tienen bigquery.jobs.create en ningún papyrus-*, aunque sí leen
          # sus tablas cross-project.
          gcloud config set project sellers-main-prod
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=/tmp/adc.json" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json" >> $GITHUB_ENV

      - name: Tests del estimador
        run: python -m pytest salud-marca/tv/tests/ -q
        # Corren antes de publicar: más vale un job en rojo que una cifra equivocada en el
        # canal. El estimador ya tuvo un bug que daba -88 visitas donde había +591.

      - name: Calcular y enviar
        env:
          GCHAT_WEBHOOK_TV: ${{ secrets.GCHAT_WEBHOOK_TV }}
          # Inversión y TRP agregados por día y franja. Van en secret y no en el repo porque
          # este repo es público y son tarifas negociadas. Si falta, el reporte sale sin
          # cifras de dinero en vez de fallar.
          TV_INVERSION_JSON: ${{ secrets.TV_INVERSION_JSON }}
        run: |
          python3 salud-marca/tv/reporte_diario.py \
            ${{ inputs.fecha && format('--fecha {0}', inputs.fecha) || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.enviar) && '--enviar' || '' }} \
            ${{ (github.event_name == 'schedule' || inputs.solo_si_falta) && '--solo-si-falta' || '' }}

      - name: Commitear el panel
        run: |
          # Solo data.json y el marcador de envío: el resto del repo no lo toca este job. Si no
          # cambió nada —porque GA4 no trajo datos nuevos, o porque este horario era de
          # respaldo y el reporte ya había salido— no se commitea.
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add salud-marca/data.json salud-marca/tv/ultimo_envio.json 2>/dev/null || git add salud-marca/data.json
          git diff --cached --quiet && echo "sin cambios en el panel" && exit 0
          git commit -m "data(tv): panel de TV $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
