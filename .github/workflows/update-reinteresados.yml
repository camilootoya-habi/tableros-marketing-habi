name: Actualizar reinteresados (10 min)

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 min — fuente hubspot.deals (~7 min de lag)
  workflow_dispatch:

# Evita solapamiento si una corrida tarda más de 10 min
concurrency:
  group: update-reinteresados
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate with user credentials
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' > /tmp/adc.json
          gcloud config set project ${{ secrets.GCP_PROJECT }}
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=/tmp/adc.json" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json" >> $GITHUB_ENV

      - name: Run reinteresados query
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: python3 scripts/run_queries.py --only funnel-reinteresados-mx

      - name: Run ciclo-asignados query
        run: |
          bq query --use_legacy_sql=false --format=json --max_rows=500 \
            < funnel-reinteresados-mx/query_ciclo_asignados.sql \
            > funnel-reinteresados-mx/ciclo_asignados.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funnel-reinteresados-mx/data.json funnel-reinteresados-mx/ciclo_asignados.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"; exit 0
          fi
          git commit -m "Auto-update reinteresados data.json $(date -u +%Y-%m-%dT%H:%MZ)"
          # reintenta ante carreras de push; resuelve conflictos de data.json a favor de NUESTRA versión (la más fresca)
          for i in 1 2 3 4 5; do
            if git push; then echo "push OK (intento $i)"; exit 0; fi
            echo "push rechazado, rebase y reintento ($i)"
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; git reset --hard origin/main; git checkout origin/main -- . ; }
            git add funnel-reinteresados-mx/data.json funnel-reinteresados-mx/ciclo_asignados.json
            git diff --staged --quiet || git commit -m "Auto-update reinteresados data.json $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          echo "No se pudo pushear tras 5 intentos"; exit 1
