// Gráfica de puntos (Chart.js scatter) con los mismos colores de ejes y grilla que mkMulti.
function mkScatter(id, puntos, o = {}) {
  const c = document.getElementById(id); if (!c || !window.Chart) return;
  const grid = cssv('--border'), tick = cssv('--text-muted-2');
  const eje = (fmt, titulo) => ({ ticks: { color: tick, callback: FMT_EJE[fmt], maxTicksLimit: 6 }, grid: { color: grid },
    title: { display: !!titulo, text: titulo, color: tick, font: { size: 11 } } });
  _charts.push(new Chart(c, {
    type: 'scatter',
    data: { datasets: [{ data: puntos.map(p => ({ x: p.x, y: p.y })), pointRadius: 5, pointHoverRadius: 7,
      pointBackgroundColor: puntos.map(p => p.color), pointBorderColor: puntos.map(p => p.color) }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => puntos[ctx.dataIndex].tip } } },
      scales: { x: eje(o.fmtX, o.xTitle), y: eje(o.fmtY, o.yTitle) } },
  }));
}

function drawBrandLift(host, serie) {
  const preguntas = ordenar(new Set(serie.map(r => r.question)));
  const TODOS = meses(serie);
  const L = recortar(TODOS, MESES);
  const visible = new Set(L);
  serie = serie.filter(r => visible.has(r.month));
  const recortado = L.length < rangoCalendario(TODOS[0], TODOS[TODOS.length - 1]).length;
  // Los meses de calendario sin estudio dentro de la ventana. Decirlo es el punto: MX estuvo un
  // año sin medir y eso no puede leerse como una serie continua.
  const conDato = new Set(TODOS);
  const huecos = L.filter(m => !conDato.has(m));
  const dato = (s, m, k) => (s.find(r => r.month === m) || {})[k] ?? null;

  // El mes en curso viene de un estudio que todavía no cerró: su cifra puede moverse. Se pinta
  // translúcido para que no se lea como un mes cerrado. Ojo: Meta llena su cuota de encuestados
  // a lo largo de la ventana, no en proporción a los días, así que un mes parcial suele traer
  // muestra casi completa e intervalo igual de estrecho — es provisional, no impreciso.
  const parciales = new Set(serie.filter(r => r.parcial).map(r => r.month));
  const conParcial = (color, alfa = '55') => parciales.size
    ? L.map(m => parciales.has(m) ? color + alfa : color) : color;
  const notaParcial = parciales.size
    ? ` · <strong>${[...parciales].join(', ')} en curso</strong>, el estudio no ha cerrado`
    : '';

  // Una FILA por indicador, TRES gráficas: no expuestos, expuestos y lift. Una variable por
  // panel, para que cada serie respire y el lift deje de estar aplastado contra un eje derecho
  // compartido con tasas de otro orden de magnitud.
  // ⚠ Los dos paneles de tasas COMPARTEN escala a la fuerza. Si cada uno autoescalara, dos series
  // con niveles muy distintos se verían del mismo tamaño y el lector concluiría que no hay
  // diferencia — justo lo contrario del dato.
  const avisoHuecos = huecos.length ? `<div class="nota-hueco">Sin estudio en
    <strong>${huecos.length} ${huecos.length === 1 ? 'mes' : 'meses'}</strong> de esta ventana
    (${huecos.length > 6 ? huecos[0] + ' … ' + huecos[huecos.length - 1] : huecos.join(', ')}).
    Meta no corrió Brand Lift esos meses; las barras faltan a propósito en vez de dibujarse en
    cero.</div>` : '';

  const ultMes = [...L].reverse().find(m => serie.some(r => r.month === m));
  host.innerHTML = fichaEstudio(serie, ultMes) + bloqueEntrega() + avisoHuecos + preguntas.map((q, i) => {
    const s = serie.filter(r => r.question === q);
    const ult = s[s.length - 1] || {};
    const lift = 100 * (ult.lift || 0);
    const pico = s.reduce((a, b) => (b.lift ?? -9) > (a.lift ?? -9) ? b : a, s[0] || {});
    // Cuatro datos del último mes, cortos y cada uno con su "?". El detalle (intervalo, probabilidad)
    // va en letra chica debajo del lift y en el tooltip de la gráfica.
    const movidas = ult.incremental > 0 && sigDe(ult) === 'si';
    const veces = ult.benchmark_region > 0 && ult.lift > 0 ? (ult.lift / ult.benchmark_region) : null;
    const kpi = (k, v, extra, help) => `<div class="kpi"><div class="k">${k}${ayuda(help)}</div><div class="v">${v}</div>${extra ? `<div class="v"><small>${extra}</small></div>` : ''}</div>`;
    const resumen = `<div class="kpis">
        ${kpi(`Lift · ${ult.month || '—'}`, `${lift >= 0 ? '+' : ''}${lift.toFixed(1)} pts ${sigBadge(ult)}`,
              ult.ci_lower != null ? `entre ${pts(ult.ci_lower)} y ${pts(ult.ci_upper)} pts` : '', 'bl_sig')}
        ${kpi('Expuestos vs no expuestos', `${(100 * (ult.exposed || 0)).toFixed(1)}% vs ${(100 * (ult.control || 0)).toFixed(1)}%`, '', 'bl_lift')}
        ${ult.benchmark_region != null ? kpi('Benchmark región · industria',
              `${pts(ult.benchmark_region)} · ${pts(ult.benchmark_vertical)} pts`,
              veces ? `el nuestro es ${veces.toFixed(1)}× el típico de la región` : '', 'bl_bench') : ''}
        ${movidas ? kpi('Personas movidas', fmtMil(ult.incremental), `a ${fmtUSD(ult.cost_per_incremental)} cada una`, 'bl_personas') : ''}
      </div>`;
    const pieResumen = `Máximo ${recortado ? 'del periodo' : 'histórico'}: ${(100 * (pico.lift || 0)).toFixed(1)} pts en ${pico.month || '—'}${notaParcial}`;

    return `<div class="fila${q.startsWith('sin_identificar') ? ' dudosa' : ''}">
      <div class="fila-h">
        <span class="n">${q.startsWith('sin_identificar') ? '?' : i + 1}</span>
        <h4>${NOMBRE_PREGUNTA[q] || q}</h4>
        <span class="q">${(PREGUNTA_TEXTO[PAIS] || {})[q] || ''}</span>
        ${AVISO_PREGUNTA[q] ? `<span class="aviso">⚠ ${AVISO_PREGUNTA[q]}</span>` : ''}
      </div>
      ${resumen}
      <div class="tres-vars">
        <div class="panel"><h3>No expuestos${ayuda('bl_control')}</h3>
          <div class="cap">Quienes no vieron la pauta: lo que la marca logra sola.</div>
          <div class="ch"><canvas id="bl-c-${i}"></canvas></div>${legend([[C.gris, 'No expuestos'], [C.gris, `Promedio ${VENTANA_MEDIA} meses`]])}</div>
        <div class="panel"><h3>Expuestos${ayuda('bl_expuestos')}</h3>
          <div class="cap">Quienes sí la vieron. Misma escala que el panel anterior.</div>
          <div class="ch"><canvas id="bl-e-${i}"></canvas></div>${legend([[C.azul, 'Expuestos'], [C.cian, `Promedio ${VENTANA_MEDIA} meses`]])}</div>
        <div class="panel"><h3>Lift${ayuda('bl_lift')}</h3>
          <div class="cap">Lo que causó la pauta. El bigote es el margen de error. ${pieResumen}.</div>
          <div class="ch"><canvas id="bl-l-${i}"></canvas></div>${legend([[C.verde, 'Subió (significativo)'], [C.rojo, 'Bajó (significativo)'], [C.gris, 'No concluyente'], [C.ambar, 'Benchmark región'], [C.rosa, 'Benchmark industria']])}</div>
      </div>
    </div>`;
  }).join('') + costoPorPersona(serie, L, preguntas) + bloqueMovidas(serie, preguntas) + bloqueInversionLift(serie, preguntas);
  dibujarCostos(serie, L, preguntas);
  dibujarEntrega(serie, L);
  dibujarMovidas(serie, L, preguntas);
  dibujarInversionLift(serie, preguntas);

  preguntas.forEach((q, i) => {
    const s = serie.filter(r => r.question === q);
    const col = k => L.map(m => dato(s, m, k));
    // Techo común a las dos tasas: la escala no puede depender de qué panel se mira.
    const tope = Math.max(...[...col('exposed'), ...col('control')].filter(v => v != null), 0);
    const ctrl = col('control'), expo = col('exposed');
    // Encuestados de cada grupo en el tooltip: un mes con muestra chica se mueve más por azar.
    const muestra = k => { const r = s.find(x => x.month === L[k]);
      return r && r.responders_test ? [`Encuestados: ${r.responders_test.toLocaleString('es-MX')} expuestos · ${(r.responders_control || 0).toLocaleString('es-MX')} no expuestos`] : []; };
    mkMulti(`bl-c-${i}`, L, [
      { type: 'bar', label: 'No expuestos', color: conParcial(C.gris + '88', '33'), data: ctrl },
      { type: 'line', label: `Promedio ${VENTANA_MEDIA} meses`, color: C.gris, data: mediaMovil(ctrl) },
    ], { fmt: 'pct', max: tope, pieTooltip: muestra });
    mkMulti(`bl-e-${i}`, L, [
      { type: 'bar', label: 'Expuestos', color: conParcial(C.azul), data: expo },
      { type: 'line', label: `Promedio ${VENTANA_MEDIA} meses`, color: C.cian, data: mediaMovil(expo) },
    ], { fmt: 'pct', max: tope, pieTooltip: muestra });
    // El signo del lift es la lectura entera del panel: verde = la pauta subió el indicador,
    // rojo = lo bajó. Un solo color obligaba a leer el eje para saber de qué lado está cada
    // barra. El mes en curso va translúcido igual que en los otros paneles.
    // El color ya no dice solo el signo sino si el efecto es real: verde/rojo cuando el intervalo
    // de 95% no toca el cero, gris cuando sí. La línea ámbar es el benchmark de Meta para la región.
    const lifts = col('lift'), lo = col('ci_lower'), hi = col('ci_upper'), bench = col('benchmark_region');
    const benchInd = col('benchmark_vertical');
    const fila = m => s.find(r => r.month === m);
    const extremos = [...lo, ...hi, ...bench, ...benchInd].filter(v => v != null);
    mkMulti(`bl-l-${i}`, L, [
      { type: 'bar', label: 'Lift', orden: 1, data: lifts,
        color: L.map(m => {
          const sg = sigDe(fila(m));
          const base = sg === 'si' ? C.verde : sg === 'neg' ? C.rojo : sg === 'no' ? C.gris : ((lifts[L.indexOf(m)] ?? 0) < 0 ? C.rojo : C.verde);
          return parciales.has(m) ? base + '55' : base;
        }) },
      { type: 'line', label: 'Benchmark región', color: C.ambar, data: bench, dash: [4, 3], puntoRadio: 0, grosor: 1.5 },
      { type: 'line', label: 'Benchmark industria', color: C.rosa, data: benchInd, dash: [2, 3], puntoRadio: 0, grosor: 1.5 },
    ], { fmt: 'pts', sMin: Math.min(0, ...extremos), sMax: Math.max(0, ...extremos),
         bigotes: { lo, hi, color: cssv('--text-muted-2') },
         pieTooltip: k => {
           const r = fila(L[k]);
           if (!r || r.ci_lower == null) return [];
           return [`Intervalo 95%: ${pts(r.ci_lower)} a ${pts(r.ci_upper)} pts`, SIG_TXT[sigDe(r)],
                   r.confidence != null ? `Prob. de efecto positivo: ${Math.round(100 * r.confidence)}%` : '',
                   r.incremental > 0 ? `Personas movidas: ${fmtMil(r.incremental)}` : ''].filter(Boolean).concat(muestra(k));
         } });
  });
}

// ── Tráfico ──────────────────────────────────────────────────────────────────
const porPlaza = (serie, campo) => {
  if (PLAZA !== 'Todas') return serie.filter(r => r.plaza === PLAZA);
  const acc = {};
  serie.forEach(r => {
    const a = acc[r.month] || (acc[r.month] = { month: r.month, users: 0, spend: null });
    a.users += r.users || 0;
    if (r.spend != null) a.spend = (a.spend || 0) + r.spend;
  });
  return Object.values(acc).sort((x, y) => x.month.localeCompare(y.month))
    .map(a => ({ ...a }));
};

// ── Agente encuestador (Pulso Inmobiliario) ──────────────────────────────────
// Una ola es un corte, no una serie: hoy hay una sola y dibujar una línea de un punto
// mentiría sobre la tendencia. Se pinta el corte más reciente y se dice de qué ola es.
// Cuando haya varias olas, el selector de abajo deja comparar sin tocar esto.
const BARRA = (label, pct, color, nota, valor) => `
  <div class="pulso-fila">
    <div class="pulso-label">${label}</div>
    <div class="pulso-riel"><div class="pulso-barra" style="width:${Math.max(pct, 1)}%;background:${color}"></div></div>
    <div class="pulso-pct">${valor === undefined ? pct + '%' : valor}</div>
  </div>${nota ? `<div class="pulso-nota">${nota}</div>` : ''}`;

// Lo que escribe la gente se pinta dentro del HTML: se escapa siempre.
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// El cuestionario vigente de Pulso (ENCUESTA.md del repo pulso-inmobiliario), en su orden.
// No hay Q6: Pulso la retiró al reducir el cuestionario y conservó la numeración.
const PULSO_Q = [
  ['q1', 'Espontánea', 'Cuando piensas en empresas o plataformas para vender una casa o departamento, ¿cuál es la primera que se te viene a la mente?'],
  ['q2', 'Espontánea (otras)', '¿Qué otras conoces? Escribe todas las que recuerdes.'],
  ['q3', 'Conocimiento asistido', '¿Cuáles de estas conoces, aunque sea solo de nombre?'],
  ['q4', 'Consideración', 'Si fueras a vender una vivienda, ¿cuáles de estas considerarías usar?'],
  ['q5', 'Primera opción', '¿Cuál sería tu primera opción?'],
  ['q7', 'Equity de marca', 'Pensando en {marca}, ¿qué tan de acuerdo estás con cada frase? (1 = totalmente en desacuerdo, 5 = totalmente de acuerdo)'],
  ['q8', 'Abierta sobre TuHabi', '¿Qué es lo primero que piensas cuando escuchas "TuHabi"?'],
];
const TOP_ABIERTAS = 7;
const pct0 = (n, base) => base ? Math.round(100 * n / base) : 0;
const colorMarca = id => id === 'tuhabi' ? C.azul : id === 'fake' ? C.gris : id === 'ninguna' ? C.rojo : C.verde;
const labelMarca = b => b.id === 'fake' ? `${esc(b.label)} <em>(marca ficticia)</em>`
  : b.id === 'ninguna' ? 'Ninguna' : esc(b.label);

function preguntaPulso(k, r) {
  const q = (r.preguntas || {})[k];
  if (!q) return '<div class="cap">Sin datos de esta pregunta en la ola.</div>';
  const barras = (lista, base) => lista.map(b => BARRA(labelMarca(b), pct0(b.n, base), colorMarca(b.id),
    null, `${pct0(b.n, base)}%`)).join('');
  const grupos = (lista, base, conEjemplo) => lista.slice(0, TOP_ABIERTAS).map(g =>
    BARRA(esc(g.grupo), pct0(g.n, base), g.grupo === 'TuHabi' ? C.azul : C.cian,
      conEjemplo && g.ejemplo ? `«${esc(g.ejemplo)}»` : null, `${g.n}`)).join('');
  const resto = lista => lista.length > TOP_ABIERTAS ? ` Se muestran los ${TOP_ABIERTAS} grupos más grandes de ${lista.length}.` : '';
  switch (k) {
    case 'q1': return `<div class="cap">Base: ${q.total} respuestas. Agrupadas por marca: las variantes
        mal escritas de una misma marca se juntan (ej. "Inmuebles 24", "I24").${resto(q.grupos)}</div>
      ${grupos(q.grupos, q.total)}`;
    case 'q2': return `<div class="cap">Menciones de marca, agrupadas igual que Q1: una respuesta puede nombrar
        varias. Sobre las ${q.muestra} respuestas más recientes que publica Pulso;
        ${q.ninguna} de ${q.total} marcaron "No conozco otras".${resto(q.grupos)}</div>
      ${grupos(q.grupos, q.muestra)}`;
    // La ficticia casi nunca aparece: quien la marca queda excluido por calidad antes de agregar.
    case 'q3': return `<div class="cap">Base: ${q.total} respuestas. Opción múltiple: los porcentajes suman más de 100%.
        ${q.barras.some(b => b.id === 'fake') ? 'La marca ficticia es un control de calidad, no un competidor.' : ''}</div>${barras(q.barras, q.total)}`;
    case 'q4': return `<div class="cap">Base: ${q.total} personas que reconocieron alguna marca real en Q3.
        Solo se ofrecen las que marcaron ahí.</div>${barras(q.barras, q.total)}`;
    case 'q5': return `<div class="cap">Base: ${q.total} personas que respondieron Q5 (se omite si en Q4 eligieron
        una sola marca o ninguna).</div>${barras(q.barras, q.total)}`;
    case 'q7': {
      const frases = (q.find(m => m.items.length) || { items: [] }).items;
      const filas = q.slice().sort((a, b) => (b.marca === 'tuhabi') - (a.marca === 'tuhabi') || b.n - a.n);
      return `<div class="cap">Cada persona evalúa TuHabi (si la conoce) y dos marcas conocidas al azar.
          <em>Evaluaron</em> = cuántos calificaron; <em>no la conocen bien</em> = marcaron "No la conozco lo suficiente".</div>
        <div class="pulso-q7-wrap"><table class="pulso-q7"><thead><tr><th>Marca</th>
          ${frases.map(f => `<th>${esc(f.text)}</th>`).join('')}<th>Evaluaron</th><th>No la conocen bien</th></tr></thead>
        <tbody>${filas.map(m => `<tr class="${m.marca === 'tuhabi' ? 'focal' : ''}"><td>${esc(m.label)}</td>
          ${frases.map(f => { const it = m.items.find(i => i.id === f.id);
            return `<td>${it && it.avg != null ? it.avg.toFixed(1) : '—'}</td>`; }).join('')}
          <td>${m.n}</td><td>${m.ns}</td></tr>`).join('')}</tbody></table></div>`;
    }
    case 'q8': return `<div class="cap">Solo a quien marcó TuHabi en Q3. Agrupadas por tema con palabras clave;
        bajo cada tema, la respuesta más corta del grupo como ejemplo. Sobre las ${q.muestra} respuestas más
        recientes de ${q.total}.${resto(q.grupos)}</div>${grupos(q.grupos, q.muestra, true)}`;
  }
  return '';
}

function drawEncuestador(host, serieTodas) {
  const aud = PUBLICOS[PUBLICO];
  // Filas de antes de separar públicos no traen `audiencia`: eran solo de dueños.
  const serie = serieTodas.filter(r => (r.audiencia || 'owner') === aud);
  const tabs = chips('Público', Object.keys(PUBLICOS), PUBLICO, 'publico');
  if (!serie.length) {
    host.innerHTML = tabs + `<div class="empty-metric"><span class="icon">—</span>
      <strong>Sin olas publicadas para ${PUBLICO.toLowerCase()}</strong><p>Pulso respondió, pero todavía no hay ninguna ola con respuestas de este público.</p></div>`;
    return;
  }
  const r = serie[serie.length - 1];
  const otras = serie.length > 1 ? ` · ${serie.length} olas, se muestra la última` : '';

  const esp = r.espontanea || [];
  const attr = r.atributos || [];
  const excl = r.excluidas ? ` · ${r.excluidas} excluidas por control de calidad (${r.excluidas_pct}%)` : '';

      <div class="panel">${preguntaPulso(k, r)}</div></div>`).join('');

  host.innerHTML = `${tabs}
  <p class="hint" style="margin:8px 0 0">${PUBLICO} · ola ${r.wave}${otras} · ${r.respuestas} encuestas completas${excl}.</p>
  <div class="pulso-bloque">Resultados pregunta por pregunta</div>

        el total de quienes completaron, no sobre el escalón anterior.</div>
      ${BARRA('La conocen', r.asistida_pct, C.azul)}
      ${BARRA('La considerarían', r.consideracion_pct, C.verde)}
      ${BARRA('Sería su primera opción', r.primera_opcion_pct, C.ambar)}
      ${BARRA('Marca inventada (piso de ruido)', r.ruido_pct, C.gris,
        'Pulso mete una marca que no existe en la lista. Lo que marque ahí es gente diciendo que sí a todo: lee el resto de las cifras descontando este piso.')}
    </div>
    <div class="panel">
      <h3>Notoriedad asistida, contra la categoría</h3>
      <div class="cap">Quién dice conocer cada marca, aunque sea de nombre. La marca inventada de control no aparece acá: su cifra está en el panel del embudo, como piso de ruido.</div>
      ${BARRA('TuHabi', r.asistida_pct, C.azul)}
      ${comp.map(c => BARRA(esc(c.marca), c.asistida_pct, C.gris)).join('')}
      ${BARRA('No reconoció ninguna', r.ninguna_pct || 0, C.rojo,
        'No es una marca: es quien no marcó ninguna de la lista. Se saca del ranking para que no se lea como un competidor.')}
    </div>
    <div class="panel">
      <h3>Recordación espontánea</h3>
      <div class="cap">La primera marca que se les viene a la mente, sin lista. Agrupada igual que Q1:
        las variantes mal escritas de una misma marca se juntan.</div>
      ${esp.length ? `<ol class="pulso-lista">${esp.map(e => `<li><span>${esc(e.texto)}</span><b>${e.n}</b></li>`).join('')}</ol>`
        : '<div class="cap">Sin respuestas abiertas en esta ola.</div>'}
    </div>
    <div class="panel">
      <h3>¿Con qué atributo nos relacionan?</h3>
      <div class="cap">Promedio de acuerdo con cada frase sobre TuHabi, de 1 a 5. Base: ${r.atributos_n} personas que dijeron conocerla lo suficiente.</div>
      ${attr.length ? attr.map(a => BARRA(esc(a.text || a.id), Math.round(((a.avg || 0) / 5) * 100), C.cian,
          null, a.avg == null ? '—' : a.avg.toFixed(1))).join('')
        : '<div class="cap">Nadie dijo conocer la marca lo suficiente para calificarla en esta ola.</div>'}
    </div>
  </div>`;
}

function drawTraffic(host, serie) {

      <div class="ch alto"><canvas id="tr-users"></canvas></div>${legend([[C.azul, 'Usuarios activos']])}</div>`;
  const val = k => L.map(m => { const r = s.find(x => x.month === m); return r ? r[k] : null; });

}

// ── Exit poll ─────────────────────────────────────────────────────────────────
function aggExit(serie) {
  if (PLAZA !== 'Todas') return serie.filter(r => r.plaza === PLAZA);
  const acc = {};
  serie.forEach(r => {
    const a = acc[r.month] || (acc[r.month] = { month: r.month, registros_web: 0, respuestas: 0, opciones: {} });
    a.registros_web += r.registros_web; a.respuestas += r.respuestas;
    Object.entries(r.opciones || {}).forEach(([k, v]) => a.opciones[k] = (a.opciones[k] || 0) + v);
  });
  return Object.values(acc).sort((x, y) => x.month.localeCompare(y.month))
    .map(a => ({ ...a, tasa: a.registros_web ? a.respuestas / a.registros_web : 0 }));
}

// Piso de volumen: la encuesta existía desde 2022 pero casi nadie la respondía, y un mes con
// 3 respuestas produce shares de 33% o 100% que no significan nada y aplastan la escala del
// resto de la serie. Se omiten esos meses y se dice cuáles.
const PISO_RESPUESTAS = 50;

function drawExitPoll(host, serie) {
  const todo = aggExit(serie);
  // Orden: primero el piso de respuestas, DESPUÉS la ventana. Al revés, los meses de 2022-2024
  // sin respuestas consumirían lugares de la ventana y quedarían 3 meses dibujados.
  const conVolumen = todo.filter(r => r.respuestas >= PISO_RESPUESTAS);
  const omitidos = todo.length - conVolumen.length;
  const L = recortar(conVolumen.map(r => r.month), MESES);
  const visibles = new Set(L);
  const s = conVolumen.filter(r => visibles.has(r.month));
  const recortado = s.length < conVolumen.length;
  const desde = L.length ? L[0] : null;
  if (!s.length) {
    host.innerHTML = `<div class="empty-metric"><span class="icon">—</span>
      <strong>Volumen insuficiente</strong><p>Ningún mes de esta plaza alcanza las
      ${PISO_RESPUESTAS} respuestas mínimas para calcular un share con sentido.</p></div>`;
    return;
  }
  // Todas las opciones, ordenadas por volumen total del periodo visible, en rejilla de 5. Antes
  // se apilaban las 6 más grandes en una sola gráfica: con 13 series superpuestas las pequeñas
  // —Uber, Cines, Revista— quedaban aplastadas contra el eje y no se podía leer su tendencia,
  // que es justo para lo que sirven. Una gráfica por opción le da a cada una su propia escala.
  const tot = {};
  s.forEach(r => Object.entries(r.opciones).forEach(([k, v]) => tot[k] = (tot[k] || 0) + v));
  const mostrar = Object.entries(tot).sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const share = (r, k) => r.respuestas ? (r.opciones[k] || 0) / r.respuestas : null;
  const ult = s[s.length - 1] || { opciones: {} };
  const totalResp = s.reduce((a, r) => a + r.respuestas, 0);

  host.innerHTML = `<div class="charts-grid">
      <div class="panel">
      <h3>Tasa de respuesta</h3>
      <div class="cap">Quién contesta "¿dónde nos conociste?" sobre registros WEB. Último mes: ${(100 * (ult.tasa || 0)).toFixed(1)}%.
        Serie desde ${desde}${recortado ? ` (ventana de ${MESES.toLowerCase()})` : ''}${omitidos ? ` · la encuesta existe desde 2022 pero hasta abr-2024 casi nadie la respondía: se omiten ${omitidos} ${omitidos === 1 ? 'mes' : 'meses'} con menos de ${PISO_RESPUESTAS} respuestas` : ''}.
        Es el denominador de todo lo de abajo: si cae, los shares se vuelven menos comparables.</div>
      <div class="ch"><canvas id="ep-tasa"></canvas></div>${legend([[C.gris, 'Tasa de respuesta']])}</div>
      <div class="panel">
        <h3>Todos los canales juntos</h3>
        <div class="cap">Las ${mostrar.length} opciones en una sola escala, para comparar tamaños
          entre sí. Abajo cada una por separado, donde sí se lee la tendencia de las pequeñas.</div>
        <div class="ch"><canvas id="ep-todas"></canvas></div>
        ${legend(mostrar.map((k, i) => [PALETA[i % PALETA.length], k]))}</div>
    </div>

    <p class="hint" style="margin:14px 0 8px">Share de cada canal declarado sobre el total de
      respuestas del mes, de mayor a menor. Es <strong>selección múltiple</strong>: una persona
      marca varios canales, así que los shares suman más de 100%. El texto libre de "Otro" no se
      guarda — traía datos personales.
      <br><strong>Ojo:</strong> el catálogo del formulario cambió a inicios de 2026 — "Redes
      sociales" dejó de usarse y apareció "Redes sociales de la empresa". La caída de una y el
      salto de la otra en enero 2026 es un renombre, no un cambio de comportamiento.</p>

    <div class="opciones-grid">${mostrar.map((k, i) => {
      const u = share(ult, k), tp = totalResp ? tot[k] / totalResp : 0;
      return `<div class="panel mini">
        <h3>${i + 1}. ${k}</h3>
        <div class="cap">${ult.month || '—'}: <strong>${u == null ? '—' : (100 * u).toFixed(1) + '%'}</strong>
          · ${(100 * tp).toFixed(1)}% del periodo</div>
        <div class="ch chico"><canvas id="ep-o-${i}"></canvas></div></div>`;
    }).join('')}</div>`;

  const fila = m => s.find(r => r.month === m);
  mkMulti('ep-tasa', L, [{ label: 'Tasa de respuesta', color: C.gris,
    data: L.map(m => (fila(m) || {}).tasa ?? null) }], { fmt: 'pct' });
  mkMulti('ep-todas', L, mostrar.map((k, i) => ({
    label: k, color: PALETA[i % PALETA.length],
    data: L.map(m => { const r = fila(m); return r ? share(r, k) : null; }) })), { fmt: 'pct' });
  mostrar.forEach((k, i) => {
    mkMulti(`ep-o-${i}`, L, [{ type: 'bar', label: k, color: PALETA[i % PALETA.length],
      data: L.map(m => { const r = fila(m); return r ? share(r, k) : null; }) }], { fmt: 'pct' });
  });
}

// ── Seguidores en redes ───────────────────────────────────────────────────────
// `series` viene POR MES (5 años de Facebook) y `diario` trae los últimos 45 días, donde vive
// Instagram: Meta solo da sus nuevos de los últimos 30 días y el total de hoy. El total de
// Facebook anterior al 4-oct-2024 viene reconstruido (`fb_total_est`) y se dibuja punteado.
const sumaCampo = (rows, k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
const ultimoCon = (rows, k) => [...rows].reverse().find(r => r[k] != null);
const conSigno = v => v == null ? '—' : (v >= 0 ? '+' : '') + Math.round(v).toLocaleString('es-MX');
const diasDelMes = m => { const [y, n] = m.split('-').map(Number); return new Date(Date.UTC(y, n, 0)).getUTCDate(); };
const totalFb = r => r ? (r.fb_total ?? r.fb_total_est ?? null) : null;

function drawFacebook(host, serie) { drawSeguidores(host, serie, 'fb'); }
function drawInstagram(host, serie) { drawSeguidores(host, serie, 'ig'); }

function drawSeguidores(host, serie, que) {
  const L = recortar(serie.map(r => r.month), MESES);
  const fila = m => serie.find(r => r.month === m);
  const mesActual = new Date().toISOString().slice(0, 7);
  // La serie arranca con la publicación más vieja (Habi y Propiedades.com: 2019); Facebook, en
  // oct-2021. Cada bloque recorta a los meses donde tiene dato.
  const primerFb = (serie.find(r => r.dias_fb || r.fb_total != null || r.fb_total_est != null) || {}).month;
  const Lfb = primerFb ? L.filter(m => m >= primerFb) : [];

  // ── Facebook ──
  // Meses cerrados: el en curso suma pocos días y se leería como una caída.
  const cerrados = serie.filter(r => r.dias_fb >= diasDelMes(r.month));
  const u12 = cerrados.slice(-12);
  const fbUlt = ultimoCon(serie, 'fb_total');
  const fbHace12 = serie[serie.indexOf(fbUlt) - 12];
  const crec12 = fbUlt && totalFb(fbHace12) != null ? fbUlt.fb_total - totalFb(fbHace12) : null;

  // ── Instagram ── (por mes: altas/bajas desde oct-2025, vistas e interacciones desde ago-2025)
  const conIg = serie.filter(r => r.ig_vistas != null || r.ig_altas != null || r.ig_total != null);
  const Lig = conIg.length ? L.filter(m => m >= conIg[0].month) : [];
  const igUlt = ultimoCon(serie, 'ig_total');
  const igCerr = serie.filter(r => r.ig_altas != null && r.month < mesActual).slice(-12);
  const igAltas = sumaCampo(igCerr, 'ig_altas'), igBajas = sumaCampo(igCerr, 'ig_bajas');
  const totalIg = r => r ? (r.ig_total ?? r.ig_total_est ?? null) : null;

  // De las altas con dato de origen (desde ~ago-2024), cuántas llegaron por pauta en 12 meses.
  const pag12 = sumaCampo(u12, 'fb_altas_pag'), org12 = sumaCampo(u12, 'fb_altas_org');
  const fbHtml = `${bloqueTendencia('fb')}
    <div class="pulso-bloque">Comunidad</div>
    <div class="ficha">
      <div><div class="k">Seguidores</div><div class="v">${fbUlt ? fbUlt.fb_total.toLocaleString('es-MX') : '—'}</div>
        <div class="d">${crec12 != null ? `${conSigno(crec12)} en 12 meses (${(100 * crec12 / totalFb(fbHace12)).toFixed(1)}%)` : ''}</div></div>
      <div><div class="k">Últimos 12 meses</div><div class="v">+${sumaCampo(u12, 'fb_altas').toLocaleString('es-MX')} / −${sumaCampo(u12, 'fb_bajas').toLocaleString('es-MX')}</div>
        <div class="d">Altas y bajas de los ${u12.length} meses cerrados</div></div>
      <div><div class="k">Se van</div><div class="v">${sumaCampo(u12, 'fb_altas') ? Math.round(100 * sumaCampo(u12, 'fb_bajas') / sumaCampo(u12, 'fb_altas')) + '%' : '—'}</div>
        <div class="d">Bajas por cada 100 altas en esos meses</div></div>
      <div><div class="k">Llegaron por pauta</div><div class="v">${pag12 + org12 ? Math.round(100 * pag12 / (pag12 + org12)) + '%' : '—'}</div>
        <div class="d">De los nuevos seguidores de esos 12 meses</div></div>
    </div>
    <div class="charts-grid">
      <div class="panel"><h3>Seguidores totales${ayuda('seg_fb_total')}</h3>
        <div class="cap">Al cierre de cada mes. Punteado: reconstruido con altas y bajas.</div>
        <div class="ch alto"><canvas id="sg-fb-total"></canvas></div>${legend([[C.azul, 'Medido por Meta'], [C.azul + '88', 'Reconstruido']])}</div>
      <div class="panel"><h3>Altas y bajas por mes${ayuda('seg_fb_mov')}</h3>
        <div class="cap">Quién empezó y quién dejó de seguir la página. La línea es el neto.</div>
        <div class="ch alto"><canvas id="sg-fb-mes"></canvas></div>${legend([[C.verde, 'Altas'], [C.rojo, 'Bajas'], [C.azul, 'Neto']])}</div>
      <div class="panel"><h3>Nuevos seguidores: pauta vs. orgánico${ayuda('fb_pag')}</h3>
        <div class="cap">Barras: altas por pauta y sin pauta. Línea: % por pauta (eje derecho).</div>
        <div class="ch alto"><canvas id="sg-fb-pag"></canvas></div>${legend([[C.ambar, 'Por pauta'], [C.verde, 'Orgánicas'], [C.azul, '% por pauta']])}</div>
    </div>
    ${bloqueFbAlcance(serie)}
    ${bloqueFbAudiencia(serie, mesActual)}
    ${bloqueFbContenido(serie)}`;

  const igHtml = `${bloqueTendencia('ig')}
    <div class="pulso-bloque">Comunidad</div>
    <div class="ficha">
      <div><div class="k">Seguidores</div><div class="v">${igUlt ? igUlt.ig_total.toLocaleString('es-MX') : '—'}</div>
        <div class="d">Hoy, según Meta</div></div>
      <div><div class="k">Últimos 12 meses</div><div class="v">+${igAltas.toLocaleString('es-MX')} / −${igBajas.toLocaleString('es-MX')}</div>
        <div class="d">Altas y bajas de los ${igCerr.length} meses cerrados</div></div>
      <div><div class="k">Se van</div><div class="v">${igAltas ? Math.round(100 * igBajas / igAltas) + '%' : '—'}</div>
        <div class="d">Bajas por cada 100 altas en esos meses</div></div>
    </div>
    <div class="charts-grid">
      <div class="panel"><h3>Seguidores totales${ayuda('ig_total')}</h3>
        <div class="cap">Sólido: medido (se guarda a diario desde oct-2026). Punteado: reconstruido hacia atrás.</div>
        <div class="ch alto"><canvas id="sg-ig-total"></canvas></div>${legend([[C.rosa, 'Medido'], [C.rosa + '88', 'Reconstruido']])}</div>
      <div class="panel"><h3>Altas y bajas por mes${ayuda('ig_mov')}</h3>
        <div class="cap">Quién empezó y quién dejó de seguir. La línea es el neto.</div>
        <div class="ch alto"><canvas id="sg-ig-mov"></canvas></div>${legend([[C.verde, 'Altas'], [C.rojo, 'Bajas'], [C.rosa, 'Neto']])}</div>
      <div class="panel"><h3>Se van: bajas por cada 100 altas${ayuda('ig_churn')}</h3>
        <div class="cap">Por mes. Instagram no separa altas por pauta; esto es lo que sí da.</div>
        <div class="ch alto"><canvas id="sg-ig-churn"></canvas></div>${legend([[C.rojo, 'Bajas por cada 100 altas']])}</div>
    </div>
    ${bloqueEmbudo(serie, mesActual)}
    ${bloqueAudiencia(serie, mesActual)}
    ${bloqueContenido(serie, L, mesActual)}`;
  // Cada hoja pinta solo su parte. Las gráficas de la otra se saltan solas: `mkMulti` no dibuja
  // si su canvas no existe.
  host.innerHTML = que === 'fb' ? fbHtml : igHtml;

  // Facebook. El reconstruido llega hasta el primer mes medido para que las dos líneas se toquen.
  const primerReal = Lfb.find(m => (fila(m) || {}).fb_total != null);
  mkMulti('sg-fb-total', Lfb, [
    { label: 'Reconstruido', color: C.azul + '88', dash: [5, 4], puntoRadio: 0, tension: .2,
      data: Lfb.map(m => m <= (primerReal || '9999') ? totalFb(fila(m)) : null) },
    { label: 'Medido por Meta', color: C.azul, puntoRadio: 0, tension: .2, data: Lfb.map(m => (fila(m) || {}).fb_total ?? null) },
  ], { fmt: 'num', desdeCero: false });
  const parcial = m => { const r = fila(m); return r && r.dias_fb < diasDelMes(m); };
  mkMulti('sg-fb-mes', Lfb, [
    { type: 'bar', label: 'Altas', orden: 1, color: Lfb.map(m => parcial(m) ? C.verde + '55' : C.verde), data: Lfb.map(m => (fila(m) || {}).dias_fb ? fila(m).fb_altas : null) },
    { type: 'bar', label: 'Bajas', orden: 1, color: Lfb.map(m => parcial(m) ? C.rojo + '55' : C.rojo), data: Lfb.map(m => (fila(m) || {}).dias_fb ? -fila(m).fb_bajas : null) },
    { type: 'line', label: 'Neto', color: C.azul, data: Lfb.map(m => (fila(m) || {}).dias_fb ? fila(m).fb_altas - fila(m).fb_bajas : null) },
  ], { fmt: 'num', pieTooltip: k => parcial(Lfb[k]) ? [`Mes en curso: ${fila(Lfb[k]).dias_fb} días con dato`] : [] });
  dibujarFacebook(serie, L, mesActual);
  dibujarTendencia(que);

  // Instagram. El mes en curso va translúcido en barras: todavía no termina.
  const ig = (m, k) => (fila(m) || {})[k] ?? null;
  const tenue = (color, m) => m === mesActual ? color + '55' : color;
  const enCurso = k => Lig[k] === mesActual ? ['Mes en curso: todavía no termina'] : [];
  // Punteado: meses ANTERIORES a la primera foto real (llega hasta ella para que las líneas se
  // toquen). Sólido: el cierre medido de cada mes, que se guarda a diario desde el 5-oct-2026.
  const primerMedido = Lig.find(m => ig(m, 'ig_total') != null);
  mkMulti('sg-ig-total', Lig, [
    { label: 'Reconstruido', color: C.rosa + '88', dash: [5, 4], puntoRadio: 0, tension: .2,
      data: Lig.map(m => ig(m, 'ig_total_est') ?? (m === primerMedido ? ig(m, 'ig_total') : null)) },
    { label: 'Medido', color: C.rosa, puntoRadio: 4, tension: .2, data: Lig.map(m => ig(m, 'ig_total')) },
  ], { fmt: 'num', desdeCero: false, sinBandas: true });
  mkMulti('sg-ig-mov', Lig, [
    { type: 'bar', label: 'Altas', orden: 1, color: Lig.map(m => tenue(C.verde, m)), data: Lig.map(m => ig(m, 'ig_altas')) },
    { type: 'bar', label: 'Bajas', orden: 1, color: Lig.map(m => tenue(C.rojo, m)), data: Lig.map(m => ig(m, 'ig_bajas') == null ? null : -ig(m, 'ig_bajas')) },
    { type: 'line', label: 'Neto', color: C.rosa, data: Lig.map(m => ig(m, 'ig_altas') == null ? null : ig(m, 'ig_altas') - ig(m, 'ig_bajas')) },
  ], { fmt: 'num', sinBandas: true, pieTooltip: enCurso });
  const Lmov = Lig.filter(m => ig(m, 'ig_altas') != null);
  mkMulti('sg-ig-churn', Lmov, [
    { label: 'Bajas por cada 100 altas', color: C.rojo, tension: .2, puntoRadio: 2,
      data: Lmov.map(m => ig(m, 'ig_altas') ? Math.round(1000 * ig(m, 'ig_bajas') / ig(m, 'ig_altas')) / 10 : null) },
  ], { fmt: 'num', sinBandas: true, pieTooltip: k => Lmov[k] === mesActual ? ['Mes en curso: todavía no termina'] : [] });
  dibujarContenido(serie, L, Lig);
  dibujarEmbudo(serie, L, mesActual);
  dibujarAudiencia(serie, L, mesActual);
}

// ── Instagram · contenido ─────────────────────────────────────────────────────
// Publicaciones por mes y formato (toda la historia), likes + comentarios por publicación (la
// única métrica que existe para toda la historia), vistas por publicación (desde ago-2025) y el
// top 5 con miniatura. Datos de sources_ig_posts.py.
const FORMATOS = [['video', 'Video', C.rosa], ['carrusel', 'Carrusel', C.cian], ['imagen', 'Imagen', C.ambar]];
// Filtro del top: con "Solo orgánicas" quedan fuera las publicaciones que tuvieron pauta, para ver
// qué contenido funciona por sí mismo.
const TOP_FILTROS = ['Todas', 'Solo orgánicas'];
let TOP_FILTRO = 'Todas';
const MESES_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const nombreMes = m => `${MESES_ES[+m.slice(5) - 1]}-${m.slice(0, 4)}`;
const pubs = r => FORMATOS.reduce((a, [f]) => a + ((r || {})[`pub_${f}`] || 0), 0);
const sumaF = (rows, pre) => rows.reduce((a, r) => a + FORMATOS.reduce((b, [f]) => b + (r[`${pre}_${f}`] || 0), 0), 0);
const ultimos12 = (serie, mesActual) => {
  const d = new Date(mesActual + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() - 12);
  const desde = d.toISOString().slice(0, 7);
  return serie.filter(r => r.month >= desde && r.month < mesActual);
};

function bloqueContenido(serie, L, mesActual) {
  const ult = [...serie].reverse().find(r => r.month < mesActual && pubs(r) > 0);
  const u12 = ultimos12(serie, mesActual);
  const n12 = sumaF(u12, 'pub');
  const porFmt = FORMATOS.map(([f, nombre]) => {
    const n = u12.reduce((a, r) => a + (r[`pub_${f}`] || 0), 0);
    const li = u12.reduce((a, r) => a + (r[`li_${f}`] || 0), 0);
    return { f, nombre, n, prom: n ? li / n : null };
  });
  const mejor = porFmt.filter(x => x.n >= 3).sort((a, b) => b.prom - a.prom)[0];
  const video = porFmt.find(x => x.f === 'video');
  const nv = sumaF(u12, 'nv'), vistas = sumaF(u12, 'vistas');
  const met = (DATA.metrics.seguidores || {})[PAIS] || {};
  const tops = met.top_posts || {};
  const pa = met.pauta_180;
  const filtro = TOP_FILTRO === 'Solo orgánicas' ? 'organicas' : 'todas';

  // En el top histórico se ordena por likes + comentarios (la métrica que tienen todos los posts);
  // en 180 días, por las interacciones de Meta. La tarjeta muestra la cifra con la que se ordenó.
  // `rango` falso = sin el número de lugar (la fila de lo más reciente no es un ranking).
  const tarjeta = (historico, rango = true) => (p, i) => `<a class="top-post" href="${esc(p.link)}" target="_blank" rel="noopener">
      <div class="img" style="${p.img ? `background-image:url('${p.img}')` : ''}">${rango ? `<span class="rank">#${i + 1}</span>` : ''}
        <span class="fmt">${(FORMATOS.find(x => x[0] === p.formato) || [, p.formato])[1]}</span>
        ${p.pauta ? '<span class="pauta">Con pauta</span>' : ''}</div>
      <div class="info">${historico
          ? `<b>${(p.likes + p.comentarios).toLocaleString('es-MX')}</b> likes + coment.`
          : `<b>${(p.interacciones ?? (p.likes + p.comentarios)).toLocaleString('es-MX')}</b> interacciones`}
        ${p.vistas ? ` · ${fmtMil(p.vistas)} vistas` : ''}<br>${p.fecha}
        <div class="txt">${esc(p.texto)}</div></div></a>`;
  const grupo = (titulo, lista, historico) => `<div class="flabel" style="margin:14px 0 8px">${titulo}</div>
      ${lista && lista.length ? `<div class="top-grid">${lista.map(tarjeta(historico)).join('')}</div>`
        : '<div class="cap">No hay publicaciones que cumplan el filtro.</div>'}`;
  const topHtml = tops['180'] ? `
      ${chips('Mostrar', TOP_FILTROS, TOP_FILTRO, 'toppauta')}
      ${pa ? `<div class="cap" style="margin-top:6px">En los últimos 180 días, <strong>${pa.con_pauta} de ${pa.total}</strong> publicaciones tuvieron pauta.</div>` : ''}
      ${grupo(`Últimos 180 días · por interacciones`, tops['180'][filtro], false)}
      ${grupo(`Toda la historia · por likes + comentarios`, tops.historico[filtro], true)}` : '';

  return `<div class="pulso-bloque">Contenido</div>
    <div class="ficha">
      <div><div class="k">Publicaciones${ult ? ` en ${nombreMes(ult.month)}` : ''}</div><div class="v">${ult ? pubs(ult) : '—'}</div>
        <div class="d">Promedio de los últimos 12 meses: ${(n12 / 12).toFixed(1)} por mes</div></div>
      <div><div class="k">Videos y Reels</div><div class="v">${n12 ? Math.round(100 * video.n / n12) + '%' : '—'}</div>
        <div class="d">De lo publicado en 12 meses (${n12} publicaciones)</div></div>
      <div><div class="k">Formato que más engancha</div><div class="v">${mejor ? mejor.nombre : '—'}</div>
        <div class="d">${porFmt.filter(x => x.n).map(x => `${x.nombre} ${Math.round(x.prom)}`).join(' · ')} likes + coment. por publicación</div></div>
      <div><div class="k">Vistas por publicación</div><div class="v">${nv ? fmtMil(vistas / nv) : '—'}</div>
        <div class="d">Promedio de 12 meses (solo hay desde ago-2025)</div></div>
    </div>
    <div class="charts-grid">
      <div class="panel"><h3>Publicaciones por mes${ayuda('ig_pub')}</h3>
        <div class="cap">Cuántas salieron cada mes, por formato.</div>
        <div class="ch alto"><canvas id="sg-ig-pub"></canvas></div>${legend(FORMATOS.map(([, n, c]) => [c, n]))}</div>
      <div class="panel"><h3>Likes + comentarios por mes${ayuda('ig_li')}</h3>
        <div class="cap">Barras: total del mes por formato. Línea: promedio por publicación (eje derecho).</div>
        <div class="ch alto"><canvas id="sg-ig-li"></canvas></div>${legend(FORMATOS.map(([, n, c]) => [c, n]).concat([[C.azul, 'Por publicación']]))}</div>
      <div class="panel"><h3>Vistas de las publicaciones por mes${ayuda('ig_vpp')}</h3>
        <div class="cap">Barras: vistas del mes por formato. Línea: promedio por publicación (eje derecho). Desde ago-2025.</div>
        <div class="ch alto"><canvas id="sg-ig-vpp"></canvas></div>${legend(FORMATOS.map(([, n, c]) => [c, n]).concat([[C.azul, 'Por publicación']]))}</div>
    </div>
    <div class="flabel" style="display:flex;align-items:center;margin-top:16px">Lo más reciente${ayuda('recientes')}</div>
    ${(met.ig_recientes || []).length ? `<div class="top-grid" style="margin-top:8px">${met.ig_recientes.map(tarjeta(false, false)).join('')}</div>`
      : '<div class="cap">Sin publicaciones.</div>'}
    <div class="flabel" style="display:flex;align-items:center;margin-top:16px">Las que más engancharon${ayuda('ig_top')}</div>
    ${topHtml || '<div class="cap">Sin publicaciones recientes.</div>'}`;
}

function dibujarContenido(serie, L, Lig) {
  const fila = m => serie.find(r => r.month === m) || {};
  const conPub = serie.find(r => pubs(r) > 0);
  const Lpub = conPub ? L.filter(m => m >= conPub.month) : [];
  mkMulti('sg-ig-pub', Lpub, FORMATOS.map(([f, n, c]) => (
    { type: 'bar', label: n, color: c, data: Lpub.map(m => fila(m)[`pub_${f}`] || 0) })),
    { fmt: 'num', apilado: true, sinBandas: true });
  // Apiladas van los TOTALES del mes por formato (suman algo con sentido); el promedio por
  // publicación va como línea aparte. Apilar promedios daría una altura que no significa nada.
  const prom = (m, num, den) => { const n = sumaF([fila(m)], den); return n ? sumaF([fila(m)], num) / n : null; };
  mkMulti('sg-ig-li', Lpub, FORMATOS.map(([f, n, c]) => (
    { type: 'bar', label: n, color: c, data: Lpub.map(m => fila(m)[`li_${f}`] || 0) })).concat([
    { type: 'line', label: 'Por publicación', eje: 'y1', color: C.azul, puntoRadio: 1.5, tension: .25,
      data: Lpub.map(m => prom(m, 'li', 'pub')) }]),
    { fmt: 'num', fmtDerecha: 'num', apilado: true, sinBandas: true });
  mkMulti('sg-ig-vpp', Lig, FORMATOS.map(([f, n, c]) => (
    { type: 'bar', label: n, color: c, data: Lig.map(m => fila(m)[`vistas_${f}`] || 0) })).concat([
    { type: 'line', label: 'Por publicación', eje: 'y1', color: C.azul, puntoRadio: 2, tension: .2,
      data: Lig.map(m => prom(m, 'vistas', 'nv')) }]),
    { fmt: 'compacto', fmtDerecha: 'compacto', apilado: true, sinBandas: true });
}

// ── Instagram · alcance e interacción (incluye el camino al sitio) ──────────────
// Dos líneas de 4 con el mismo eje de meses. Arriba, lo mismo que Facebook: vistas, personas
// alcanzadas, interacciones e interacciones por mil vistas. Abajo, del contenido al sitio: visitas al
// perfil, clics al sitio y las dos conversiones entre pasos.
const por = (a, b, base) => (a != null && b) ? base * a / b : null;

function bloqueEmbudo(serie, mesActual) {
  if (!serie.some(r => r.ig_vistas != null || r.ig_perfil != null)) return '';
  const panel = (id, titulo, cap, help) => `<div class="panel"><h3>${titulo}${ayuda(help)}</h3>
      <div class="cap">${cap}</div><div class="ch"><canvas id="${id}"></canvas></div></div>`;
  return `<div class="pulso-bloque">Alcance e interacción</div>
    <div class="cuatro">
      ${panel('sg-ig-e-vistas', 'Vistas', 'Veces que se vio el contenido.', 'ig_vistas')}
      ${panel('sg-ig-e-alc', 'Personas alcanzadas', 'Distintas, en 30 días del mes.', 'ig_alcance')}
      ${panel('sg-ig-e-inter', 'Interacciones', 'Likes, comentarios, compartidos y guardados.', 'ig_inter')}
      ${panel('sg-ig-e-tasa', 'Interacciones por mil vistas', 'Si el contenido engancha o solo se ve.', 'ig_inter')}
    </div>
    <div class="flabel" style="margin:12px 0 6px">Del contenido al sitio</div>
    <div class="cuatro">
      ${panel('sg-ig-e-perfil', 'Visitas al perfil', 'Personas que entraron al perfil.', 'ig_perfil_mes')}
      ${panel('sg-ig-e-clics', 'Clics al sitio', 'Clics al link del sitio web.', 'ig_perfil_mes')}
      ${panel('sg-ig-e-c1', 'Vistas → perfil', 'Visitas al perfil por cada 10 mil vistas.', 'ig_embudo')}
      ${panel('sg-ig-e-c2', 'Perfil → sitio', 'Clics al sitio por cada 100 visitas al perfil.', 'ig_embudo')}
    </div>`;
}

function dibujarEmbudo(serie, L, mesActual) {
  const fila = m => serie.find(r => r.month === m) || {};
  const primero = serie.find(r => r.ig_perfil != null || r.ig_vistas != null);
  const Lp = primero ? L.filter(m => m >= primero.month) : [];
  const tenue = (c, m) => m === mesActual ? c + '55' : c;
  const enCurso = k => Lp[k] === mesActual ? ['Mes en curso: todavía no termina'] : [];
  const col = (id, valor, label, color, fmt) => mkMulti(id, Lp, [
    { type: 'bar', label, color: Lp.map(m => tenue(color, m)), data: Lp.map(m => valor(fila(m))) },
  ], { fmt, sinBandas: true, pieTooltip: enCurso });
  const linea = (id, valor, label, color, fmt) => mkMulti(id, Lp, [
    { label, color, tension: .2, puntoRadio: 2, data: Lp.map(m => valor(fila(m))) },
  ], { fmt, sinBandas: true, pieTooltip: enCurso });
  const r1 = v => v == null ? null : Math.round(10 * v) / 10;
  col('sg-ig-e-vistas', r => r.ig_vistas ?? null, 'Vistas', C.rosa, 'compacto');
  linea('sg-ig-e-alc', r => r.ig_alc_seg != null ? r.ig_alc_seg + r.ig_alc_noseg : null, 'Personas alcanzadas', C.rosa, 'compacto');
  col('sg-ig-e-inter', r => r.ig_interacciones ?? null, 'Interacciones', C.cian, 'num');
  linea('sg-ig-e-tasa', r => r1(por(r.ig_interacciones, r.ig_vistas, 1000)), 'Por cada mil vistas', C.cian, 'num');
  col('sg-ig-e-perfil', r => r.ig_perfil ?? null, 'Visitas al perfil', C.azul, 'num');
  col('sg-ig-e-clics', r => r.ig_clics ?? null, 'Clics al sitio', C.azul, 'num');
  linea('sg-ig-e-c1', r => r1(por(r.ig_perfil, r.ig_vistas, 1e4)), 'Por cada 10 mil vistas', C.azul, 'num');
  linea('sg-ig-e-c2', r => r1(por(r.ig_clics, r.ig_perfil, 100)), 'Por cada 100 visitas', C.azul, 'num');
}

// ── Instagram · audiencia ─────────────────────────────────────────────────────
// A quién le llega (seguidores vs no seguidores, por mes desde oct-2025) y quiénes son: edad de
// seguidores contra la de alcanzados e interactuantes del mes en curso, género y ciudades de los
// seguidores. La demografía es la foto de hoy; desde oct-2026 se guarda una por mes.
const GENERO = { F: 'Mujeres', M: 'Hombres', U: 'Sin dato' };
const pctDe = obj => { const t = Object.values(obj || {}).reduce((a, b) => a + b, 0); return k => t ? (obj[k] || 0) / t : null; };

function bloqueAudiencia(serie, mesActual) {
  const dm = (((DATA.metrics.seguidores || {})[PAIS] || {}).demografia) || null;
  const ua = [...serie].reverse().find(r => r.month < mesActual && r.ig_alc_seg != null);
  const pSeg = ua ? ua.ig_alc_seg / (ua.ig_alc_seg + ua.ig_alc_noseg) : null;
  if (!dm && !ua) return '';
  const edad = dm ? pctDe(dm.edad) : null, gen = dm ? pctDe(dm.genero) : null;
  const totalSeg = dm ? Object.values(dm.edad || {}).reduce((a, b) => a + b, 0) : 0;
  const edadTop = dm ? Object.keys(dm.edad).sort((a, b) => dm.edad[b] - dm.edad[a])[0] : null;
  const ciudades = dm ? Object.entries(dm.ciudad || {}).sort((a, b) => b[1] - a[1]).slice(0, 10) : [];
  const corto = c => c.split(',')[0].replace('Mexico City', 'Ciudad de México');
  return `<div class="pulso-bloque">Audiencia</div>
    <div class="ficha">
      <div><div class="k">Alcance que viene de seguidores</div><div class="v">${pSeg == null ? '—' : (100 * pSeg).toFixed(1) + '%'}</div>
        <div class="d">${ua ? `En ${nombreMes(ua.month)}; el resto son personas que no siguen la cuenta` : ''}</div></div>
      <div><div class="k">Edad más común</div><div class="v">${edadTop ? `${edadTop} años` : '—'}</div>
        <div class="d">${edadTop ? `${Math.round(100 * edad(edadTop))}% de los seguidores` : ''}</div></div>
      <div><div class="k">Mujeres / hombres</div><div class="v">${gen ? `${Math.round(100 * gen('F'))}% / ${Math.round(100 * gen('M'))}%` : '—'}</div>
        <div class="d">${gen ? `${Math.round(100 * gen('U'))}% sin dato de género` : ''}</div></div>
      <div><div class="k">Ciudad principal</div><div class="v" style="font-size:16px">${ciudades.length ? corto(ciudades[0][0]) : '—'}</div>
        <div class="d">${ciudades.length && totalSeg ? `${(100 * ciudades[0][1] / totalSeg).toFixed(0)}% de los seguidores` : ''}</div></div>
    </div>
    <div class="charts-grid">
      <div class="panel"><h3>A quién le llega${ayuda('ig_alcance')}</h3>
        <div class="cap">Barras: alcance del mes. Línea: % que ya seguía la cuenta (eje derecho).</div>
        <div class="ch alto"><canvas id="sg-ig-alc"></canvas></div>${legend([[C.gris, 'Alcance'], [C.rosa, '% de seguidores']])}</div>
      <div class="panel"><h3>Edad: seguidores vs. a quién le llegamos${ayuda('ig_edad')}</h3>
        <div class="cap">% de cada público por grupo de edad. Alcanzados e interactúan: mes en curso.</div>
        <div class="ch alto"><canvas id="sg-ig-edad"></canvas></div>${legend([[C.rosa, 'Seguidores'], [C.gris, 'Alcanzados'], [C.cian, 'Interactúan']])}</div>
      <div class="panel"><h3>Género y ciudades${ayuda('ig_genero_ciudad')}</h3>
        <div class="cap">De los seguidores, hoy.</div>
        ${gen ? ['F', 'M', 'U'].map(g => BARRA(GENERO[g], Math.round(100 * gen(g)), g === 'F' ? C.rosa : g === 'M' ? C.azul : C.gris)).join('') : ''}
        <div class="flabel" style="margin-top:14px">Top 10 ciudades</div>
        ${ciudades.map(([c, n]) => BARRA(esc(corto(c)), Math.round(100 * n / totalSeg), C.cian, null,
          `${(100 * n / totalSeg).toFixed(1)}%`)).join('')}</div>
    </div>`;
}

function dibujarAudiencia(serie, L, mesActual) {
  const fila = m => serie.find(r => r.month === m) || {};
  const primero = serie.find(r => r.ig_alc_seg != null);
  const La = primero ? L.filter(m => m >= primero.month) : [];
  const total = r => (r.ig_alc_seg ?? null) == null ? null : r.ig_alc_seg + r.ig_alc_noseg;
  mkMulti('sg-ig-alc', La, [
    { type: 'bar', label: 'Alcance', orden: 1, color: La.map(m => m === mesActual ? C.gris + '55' : C.gris), data: La.map(m => total(fila(m))) },
    { type: 'line', label: '% de seguidores', eje: 'y1', color: C.rosa, tension: .2,
      data: La.map(m => total(fila(m)) ? fila(m).ig_alc_seg / total(fila(m)) : null) },
  ], { fmt: 'compacto', fmtDerecha: 'pctFino', sinBandas: true,
       pieTooltip: k => La[k] === mesActual ? ['Mes en curso: todavía no termina'] : [] });
  const dm = (((DATA.metrics.seguidores || {})[PAIS] || {}).demografia) || {};
  const edades = Object.keys(dm.edad || {}).sort();
  const serieEdad = obj => { const p = pctDe(obj); return edades.map(e => obj ? p(e) : null); };
  mkMulti('sg-ig-edad', edades, [
    { type: 'bar', label: 'Seguidores', color: C.rosa, data: serieEdad(dm.edad) },
    { type: 'bar', label: 'Alcanzados', color: C.gris, data: serieEdad(dm.edad_alcance) },
    { type: 'bar', label: 'Interactúan', color: C.cian, data: serieEdad(dm.edad_interaccion) },
  ], { fmt: 'pct', sinBandas: true });
}

// ── Tendencia: últimos 14 días / 14 semanas (Instagram y Facebook) ────────────
// Seis indicadores con minigráfica, el valor del periodo y su cambio contra el anterior:
// - 14 días: últimos 7 días contra los 7 anteriores.
// - 14 semanas (lunes a domingo): la última semana cerrada contra el promedio de las 4 anteriores.
// Solo días cerrados. Las publicaciones del día van como punto gris y, en Tuhabi, los días con
// spots de TV como línea ámbar. Datos: `diario` de data.json (130 días).
const TENDENCIAS = ['14 días', '14 semanas'];
let TENDENCIA = '14 días';
const sumaK = (rows, f) => rows.reduce((a, r) => { const v = f(r); return v == null ? a : a + v; }, 0);
const hayK = (rows, f) => rows.some(r => f(r) != null);
const IND_TENDENCIA = {
  ig: [
    { titulo: 'Nuevos seguidores netos', fmt: 'num', bueno: 'sube',
      agg: rs => hayK(rs, r => r.ig_altas_d) ? sumaK(rs, r => r.ig_altas_d) - sumaK(rs, r => r.ig_bajas_d) : null },
    { titulo: 'Vistas', fmt: 'compacto', bueno: 'sube', agg: rs => hayK(rs, r => r.ig_vistas_d) ? sumaK(rs, r => r.ig_vistas_d) : null },
    { titulo: 'Interacciones', fmt: 'num', bueno: 'sube', agg: rs => hayK(rs, r => r.ig_inter_d) ? sumaK(rs, r => r.ig_inter_d) : null },
    { titulo: 'Interacciones por mil vistas', fmt: 'dec', bueno: 'sube', tasa: true,
      agg: rs => { const v = sumaK(rs, r => r.ig_vistas_d); return v ? 1000 * sumaK(rs, r => r.ig_inter_d) / v : null; } },
    { titulo: 'Visitas al perfil', fmt: 'num', bueno: 'sube', agg: rs => hayK(rs, r => r.ig_perfil_d) ? sumaK(rs, r => r.ig_perfil_d) : null },
    { titulo: 'Clics al sitio', fmt: 'num', bueno: 'sube', agg: rs => hayK(rs, r => r.ig_clics_d) ? sumaK(rs, r => r.ig_clics_d) : null },
  ],
  fb: [
    { titulo: 'Nuevos seguidores netos', fmt: 'num', bueno: 'sube',
      agg: rs => hayK(rs, r => r.fb_altas) ? sumaK(rs, r => r.fb_altas) - sumaK(rs, r => r.fb_bajas) : null },
    { titulo: 'Vistas', fmt: 'compacto', bueno: 'sube', agg: rs => hayK(rs, r => r.fb_vistas) ? sumaK(rs, r => r.fb_vistas) : null },
    { titulo: 'Interacciones', fmt: 'compacto', bueno: 'sube', agg: rs => hayK(rs, r => r.fb_inter) ? sumaK(rs, r => r.fb_inter) : null },
    { titulo: 'Interacciones por mil vistas', fmt: 'dec', bueno: 'sube', tasa: true,
      agg: rs => { const v = sumaK(rs, r => r.fb_vistas); return v ? 1000 * sumaK(rs, r => r.fb_inter) / v : null; } },
    { titulo: 'Visitas a la página', fmt: 'num', bueno: 'sube', agg: rs => hayK(rs, r => r.fb_visitas) ? sumaK(rs, r => r.fb_visitas) : null },
    { titulo: '% de altas por pauta', fmt: 'pct', bueno: 'neutro', tasa: true,
      agg: rs => { const t = sumaK(rs, r => r.fb_altas_pag) + sumaK(rs, r => r.fb_altas_org); return t ? sumaK(rs, r => r.fb_altas_pag) / t : null; } },
  ],
};
const lunes = d => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7)); return t.toISOString().slice(0, 10); };
const masDias = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const fmtTend = { num: v => Math.round(v).toLocaleString('es-MX'), compacto: v => fmtMil(v), dec: v => v.toFixed(1),
                  pct: v => (100 * v).toFixed(0) + '%' };

// Cubetas: [{etiqueta, rows, parcial}] para los días o las semanas, más el periodo de comparación.
// Cada INDICADOR termina en su propio último día con dato: en Instagram las vistas llegan con ~1-2
// días de atraso y las altas/bajas con uno más. Si todos se cortaran en el último día de la serie,
// los "últimos 7 días" serían 5 contra 7 y la flecha mostraría una caída falsa.
const CAMPOS_TEND = { ig: ['ig_altas_d', 'ig_vistas_d', 'ig_inter_d', 'ig_vistas_d', 'ig_perfil_d', 'ig_clics_d'],
                      fb: ['fb_altas', 'fb_vistas', 'fb_inter', 'fb_vistas', 'fb_visitas', 'fb_altas_pag'] };
function cubetasTendencia(diario, campo) {
  const fechas = diario.filter(r => r[campo] != null).map(r => r.date).sort();
  if (!fechas.length) return null;
  const fin = fechas[fechas.length - 1];
  const fila = {};
  diario.forEach(r => { fila[r.date] = r; });
  if (TENDENCIA === '14 días') {
    const dias = Array.from({ length: 28 }, (_, i) => masDias(fin, i - 27));
    const c = dias.map(d => ({ etiqueta: d.slice(5), desde: d, hasta: d, rows: fila[d] ? [fila[d]] : [] }));
    return { cubetas: c.slice(-14), actual: c.slice(-7), previo: c.slice(-14, -7), fin };
  }
  const ultLunes = lunes(fin), semanaCompleta = masDias(ultLunes, 6) <= fin;
  const semanas = Array.from({ length: 18 }, (_, i) => masDias(ultLunes, 7 * (i - 17)));
  const c = semanas.map(s => ({ etiqueta: s.slice(5), desde: s, hasta: masDias(s, 6),
    rows: Array.from({ length: 7 }, (_, j) => fila[masDias(s, j)]).filter(Boolean),
    parcial: s === ultLunes && !semanaCompleta }));
  const cerradas = c.filter(x => !x.parcial);
  return { cubetas: c.slice(-14), actual: cerradas.slice(-1), previo: cerradas.slice(-5, -1), promedio: true, fin };
}

function bloqueTendencia(red) {
  const diario = (((DATA.metrics.seguidores || {})[PAIS] || {}).diario) || [];
  if (!diario.length) return '';
  const tarjetas = IND_TENDENCIA[red].map((ind, i) => {
    const b = cubetasTendencia(diario, CAMPOS_TEND[red][i]);
    if (!b) return `<div class="panel tend"><h3>${ind.titulo}</h3><div class="cap">Sin dato todavía.</div></div>`;
    const valor = ind.agg(b.actual.flatMap(x => x.rows));
    let base = ind.agg(b.previo.flatMap(x => x.rows));
    if (b.promedio && base != null && !ind.tasa) base = base / Math.max(1, b.previo.length);
    const delta = valor != null && base ? (valor - base) / Math.abs(base) : null;
    const cls = delta == null || ind.bueno === 'neutro' ? 'neutro' : delta >= 0 ? 'sube' : 'baja';
    return `<div class="panel tend"><h3>${ind.titulo}</h3>
      <div class="tend-v"><b>${valor == null ? '—' : fmtTend[ind.fmt](valor)}</b>
        ${delta == null ? '' : `<span class="delta ${cls}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(100 * delta).toFixed(0)}%</span>`}</div>
      <div class="ch chico"><canvas id="tend-${red}-${i}"></canvas></div>
      <div class="cap" style="margin:4px 0 0">Hasta el ${b.fin.slice(8)}-${b.fin.slice(5, 7)}</div></div>`;
  }).join('');
  return `<div class="pulso-bloque" style="margin-top:4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="display:flex;align-items:center">Tendencia${ayuda('tendencia')}</span>${chips('', TENDENCIAS, TENDENCIA, 'tendencia')}</div>
    <div class="cap" style="font-size:12px;margin:-4px 0 8px">Valor ${TENDENCIA === '14 días' ? 'de los últimos 7 días; la flecha compara con los 7 anteriores'
      : 'de la última semana cerrada; la flecha compara con el promedio de las 4 anteriores'}.
      ${PAIS === 'MX' ? 'Línea ámbar: hubo spots de TV. ' : ''}Punto gris: se publicó algo.</div>
    <div class="seis">${tarjetas}</div>`;
}

function dibujarTendencia(red) {
  const diario = (((DATA.metrics.seguidores || {})[PAIS] || {}).diario) || [];
  const spots = {};
  if (PAIS === 'MX') ((((DATA.metrics.tv || {}).MX) || {}).series || []).forEach(r => { if (r.spots) spots[r.fecha] = r.spots; });
  const enCubeta = (c, mapa) => Object.entries(mapa).reduce((a, [d, n]) => d >= c.desde && d <= c.hasta ? a + n : a, 0);
  const campoPubs = red === 'ig' ? 'ig_pubs' : 'fb_pubs';
  IND_TENDENCIA[red].forEach((ind, i) => {
    const b = cubetasTendencia(diario, CAMPOS_TEND[red][i]);
    if (!b) return;
    const pubs = b.cubetas.map(c => c.rows.reduce((a, r) => a + (r[campoPubs] || 0), 0));
    const tv = b.cubetas.map(c => enCubeta(c, spots));
    const vals = b.cubetas.map(c => c.rows.length ? ind.agg(c.rows) : null);
    const color = ind.bueno === 'neutro' ? C.ambar : red === 'ig' ? C.rosa : C.azul;
    mkMulti(`tend-${red}-${i}`, b.cubetas.map(c => c.etiqueta), [
      { type: 'bar', label: ind.titulo, orden: 1, color: b.cubetas.map(c => c.parcial ? color + '55' : color), data: vals },
      // Publicaciones: un punto sobre el eje en las cubetas con algo publicado.
      { type: 'line', label: 'Publicaciones', color: C.gris, grosor: 0, data: pubs.map(n => n ? 0 : null),
        puntoRadio: pubs.map(n => n ? 3 : 0) },
    ], { fmt: ind.fmt === 'pct' ? 'pct' : ind.fmt === 'compacto' ? 'compacto' : 'num', sinBandas: true,
         spots: { indices: tv.map((n, k) => n ? k : -1).filter(k => k >= 0), color: C.ambar },
         pieTooltip: k => [pubs[k] ? `Publicaciones: ${pubs[k]}` : '', tv[k] ? `Spots de TV: ${tv[k]}` : '',
                           b.cubetas[k].parcial ? 'Semana en curso' : ''].filter(Boolean) });
  });
}

// ── Facebook: alcance, contenido y audiencia ──────────────────────────────────
// Misma lógica que Instagram. Datos de sources_social.py (métricas diarias de la página, reales
// desde ~ago-2024; antes Meta da ceros y el build los borra) y sources_fb_posts.py.
const FB_FORMATOS = [['video', 'Video', C.rosa], ['foto', 'Foto', C.cian], ['texto', 'Texto', C.gris]];
const REACCIONES = [['like', 'Me gusta', C.azul], ['love', 'Me encanta', C.rosa], ['haha', 'Me divierte', C.ambar],
                    ['wow', 'Me asombra', C.cian], ['sorry', 'Me entristece', C.gris], ['anger', 'Me enoja', C.rojo]];
const fbPubs = r => FB_FORMATOS.reduce((a, [f]) => a + ((r || {})[`fbpub_${f}`] || 0), 0);
const desdeMes = (serie, L, cond) => { const r = serie.find(cond); return r ? L.filter(m => m >= r.month) : []; };

function bloqueFbAlcance(serie) {
  if (!serie.some(r => r.fb_vistas != null)) return '';
  const panel = (id, titulo, cap, help) => `<div class="panel"><h3>${titulo}${ayuda(help)}</h3>

  return `<div class="pulso-bloque">Alcance e interacción</div>
    <div class="cinco">
      ${panel('sg-fb-vistas', 'Vistas', 'Veces que se vio el contenido.', 'fb_alcance')}
      ${panel('sg-fb-alc', 'Personas alcanzadas', 'Distintas, en los 28 días al cierre del mes.', 'fb_alcance')}
      ${panel('sg-fb-inter', 'Interacciones', 'Reacciones, comentarios, compartidos y clics.', 'fb_alcance')}
      ${panel('sg-fb-visitas', 'Visitas a la página', 'Veces que se abrió la página.', 'fb_alcance')}
      ${panel('sg-fb-tasa', 'Interacciones por mil vistas', 'Si el contenido engancha o solo se ve.', 'fb_alcance')}
    </div>`;
}

function bloqueFbContenido(serie) {
  const met = ((DATA.metrics.seguidores || {})[PAIS] || {});
  const tops = met.fb_top || {};
  // `rango` falso = sin el número de lugar (la fila de lo más reciente no es un ranking).
  const tarjetaCon = rango => (p, i) => `<a class="top-post" href="${esc(p.link)}" target="_blank" rel="noopener">
      <div class="img" style="${p.img ? `background-image:url('${p.img}')` : ''}">${rango ? `<span class="rank">#${i + 1}</span>` : ''}
        <span class="fmt">${(FB_FORMATOS.find(x => x[0] === p.formato) || [, p.formato])[1]}</span></div>
      <div class="info"><b>${(p.reacciones + p.comentarios + p.compartidos).toLocaleString('es-MX')}</b> interacciones
        ${p.vistas ? ` · ${fmtMil(p.vistas)} vistas` : ''}<br>${p.fecha}
        <div class="txt">${esc(p.texto)}</div></div></a>`;
  const tarjeta = tarjetaCon(true);
  const grupo = (titulo, lista) => `<div class="flabel" style="margin:14px 0 8px">${titulo}</div>
      ${lista && lista.length ? `<div class="top-grid">${lista.map(tarjeta).join('')}</div>`
        : '<div class="cap">Sin publicaciones en este periodo.</div>'}`;

  return `<div class="pulso-bloque">Contenido</div>
    <div class="charts-grid">
      <div class="panel"><h3>Publicaciones por mes${ayuda('fb_pub')}</h3>
        <div class="cap">Cuántas salieron cada mes, por tipo.</div>
        <div class="ch alto"><canvas id="sg-fb-pub"></canvas></div>${legend(FB_FORMATOS.map(([, n, c]) => [c, n]))}</div>
      <div class="panel"><h3>Interacciones de las publicaciones por mes${ayuda('fb_int')}</h3>
        <div class="cap">Barras: reacciones + comentarios + compartidos por tipo. Línea: promedio por publicación (eje derecho).</div>
        <div class="ch alto"><canvas id="sg-fb-int"></canvas></div>${legend(FB_FORMATOS.map(([, n, c]) => [c, n]).concat([[C.azul, 'Por publicación']]))}</div>
    </div>
    <div class="flabel" style="display:flex;align-items:center;margin-top:16px">Lo más reciente${ayuda('recientes')}</div>
    ${(met.fb_recientes || []).length ? `<div class="top-grid" style="margin-top:8px">${met.fb_recientes.map(tarjetaCon(false)).join('')}</div>`
      : '<div class="cap">Sin publicaciones.</div>'}
    <div class="flabel" style="display:flex;align-items:center;margin-top:16px">Las que más engancharon${ayuda('fb_top')}</div>
    <div class="cap" style="margin-top:4px">Sin filtro de pauta: Facebook no dice si una publicación se promocionó.</div>
    ${grupo('Últimos 180 días · por reacciones + comentarios + compartidos', tops['180'])}
    ${grupo('Toda la historia · por reacciones + comentarios + compartidos', tops.historico)}`;
}

function bloqueFbAudiencia(serie, mesActual) {
  const dm = (((DATA.metrics.seguidores || {})[PAIS] || {}).demografia) || {};
  const ciudades = Object.entries(dm.fb_ciudad || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const fbUlt = ultimoCon(serie, 'fb_total');
  const total = fbUlt ? fbUlt.fb_total : 0;
  const u12 = ultimos12(serie, mesActual);
  const reac = REACCIONES.map(([k, n, c]) => [n, c, sumaCampo(u12, `fb_r_${k}`)]);
  const totReac = reac.reduce((a, x) => a + x[2], 0);
  if (!ciudades.length && !totReac) return '';
  const corto = c => c.split(',')[0].replace('Mexico City', 'Ciudad de México');
  return `<div class="pulso-bloque">Audiencia</div>
    <div class="charts-grid">
      <div class="panel"><h3>Top 10 ciudades de los seguidores${ayuda('fb_ciudades')}</h3>
        <div class="cap">% del total de seguidores de la página, hoy.</div>
        ${ciudades.map(([c, n]) => BARRA(esc(corto(c)), Math.round(100 * n / (total || 1)), C.cian, null,
          `${(100 * n / (total || 1)).toFixed(1)}%`)).join('') || '<div class="cap">Sin dato de ciudades.</div>'}</div>
      <div class="panel"><h3>Cómo reaccionan${ayuda('fb_reac')}</h3>
        <div class="cap">Reacciones de los últimos 12 meses, por tipo.</div>
        ${totReac ? reac.map(([n, c, v]) => BARRA(n, Math.round(100 * v / totReac), c, null,
          `${(100 * v / totReac).toFixed(1)}%`)).join('') : '<div class="cap">Sin dato de reacciones.</div>'}</div>
      <div class="panel"><h3>Reacciones negativas por mes${ayuda('fb_reac')}</h3>
        <div class="cap">"Me enoja" + "Me entristece", como % de todas las reacciones.</div>
        <div class="ch alto"><canvas id="sg-fb-neg"></canvas></div>${legend([[C.rojo, '% negativas']])}</div>
    </div>`;
}

function dibujarFacebook(serie, L, mesActual) {
  const fila = m => serie.find(r => r.month === m) || {};
  const tenue = (c, m) => m === mesActual ? c + '55' : c;
  const enCursoEn = Ls => k => Ls[k] === mesActual ? ['Mes en curso: todavía no termina'] : [];

  // Altas por pauta vs orgánicas (desde ~ago-2024).
  const Lpag = desdeMes(serie, L, r => r.fb_altas_pag != null);
  mkMulti('sg-fb-pag', Lpag, [
    { type: 'bar', label: 'Por pauta', color: Lpag.map(m => tenue(C.ambar, m)), data: Lpag.map(m => fila(m).fb_altas_pag ?? null) },
    { type: 'bar', label: 'Orgánicas', color: Lpag.map(m => tenue(C.verde, m)), data: Lpag.map(m => fila(m).fb_altas_org ?? null) },
    { type: 'line', label: '% por pauta', eje: 'y1', color: C.azul, tension: .2,
      data: Lpag.map(m => { const r = fila(m), t = (r.fb_altas_pag || 0) + (r.fb_altas_org || 0); return t ? r.fb_altas_pag / t : null; }) },
  ], { fmt: 'num', fmtDerecha: 'pct', apilado: true, sinBandas: true, pieTooltip: enCursoEn(Lpag) });

  // Alcance e interacción: 5 gráficas con el mismo eje de meses.
  const Lv = desdeMes(serie, L, r => r.fb_vistas != null);
  const col = (id, campo, label, color, fmt) => mkMulti(id, Lv, [
    { type: 'bar', label, color: Lv.map(m => tenue(color, m)), data: Lv.map(m => fila(m)[campo] ?? null) },
  ], { fmt, sinBandas: true, pieTooltip: enCursoEn(Lv) });
  col('sg-fb-vistas', 'fb_vistas', 'Vistas', C.azul, 'compacto');
  col('sg-fb-inter', 'fb_inter', 'Interacciones', C.cian, 'compacto');
  col('sg-fb-visitas', 'fb_visitas', 'Visitas a la página', C.verde, 'compacto');
  mkMulti('sg-fb-alc', Lv, [
    { label: 'Personas alcanzadas', color: C.azul, tension: .2, puntoRadio: 2, data: Lv.map(m => fila(m).fb_alcance28 ?? null) },
  ], { fmt: 'compacto', sinBandas: true, pieTooltip: enCursoEn(Lv) });
  mkMulti('sg-fb-tasa', Lv, [
    { label: 'Por cada mil vistas', color: C.cian, tension: .2, puntoRadio: 2,
      data: Lv.map(m => fila(m).fb_vistas ? Math.round(10000 * fila(m).fb_inter / fila(m).fb_vistas) / 10 : null) },
  ], { fmt: 'num', sinBandas: true, pieTooltip: enCursoEn(Lv) });

  // Contenido.
  const Lpub = desdeMes(serie, L, r => fbPubs(r) > 0);
  mkMulti('sg-fb-pub', Lpub, FB_FORMATOS.map(([f, n, c]) => (
    { type: 'bar', label: n, color: c, data: Lpub.map(m => fila(m)[`fbpub_${f}`] || 0) })),
    { fmt: 'num', apilado: true, sinBandas: true });
  mkMulti('sg-fb-int', Lpub, FB_FORMATOS.map(([f, n, c]) => (
    { type: 'bar', label: n, color: c, data: Lpub.map(m => fila(m)[`fbint_${f}`] || 0) })).concat([
    { type: 'line', label: 'Por publicación', eje: 'y1', color: C.azul, puntoRadio: 1.5, tension: .25,
      data: Lpub.map(m => { const n = fbPubs(fila(m)); return n ? FB_FORMATOS.reduce((a, [f]) => a + (fila(m)[`fbint_${f}`] || 0), 0) / n : null; }) }]),
    { fmt: 'compacto', fmtDerecha: 'num', apilado: true, sinBandas: true });

  // Reacciones negativas.
  const Lr = desdeMes(serie, L, r => r.fb_r_like != null);
  mkMulti('sg-fb-neg', Lr, [
    { label: '% negativas', color: C.rojo, tension: .2, puntoRadio: 2,
      data: Lr.map(m => { const r = fila(m), t = REACCIONES.reduce((a, [k]) => a + (r[`fb_r_${k}`] || 0), 0);
                          return t ? ((r.fb_r_anger || 0) + (r.fb_r_sorry || 0)) / t : null; }) },
  ], { fmt: 'pct', sinBandas: true, pieTooltip: enCursoEn(Lr) });
}

}

// La vista queda en la URL (?hoja=instagram&marca=habi): así se manda "el Instagram de Habi" por
// Slack en vez de "abre el tablero, dale a Instagram y luego a Habi".
function syncURL() {
  const q = new URLSearchParams({ hoja: SECCION, marca: HOJAS[PAIS].slug, meses: MESES, bloque: BLOQUE, leads: LEADS_SEL, publico: PUBLICO });
  history.replaceState(null, '', `?${q}`);
}
function readURL() {
  const q = new URLSearchParams(location.search);
  // Enlaces viejos: `pais` (antes de las hojas) y `hoja=<marca>` (hojas por marca, oct-2026). El de
  // la tarjeta de TV en Google Chat es `?pais=MX#h-tv`: el ancla `#h-<hoja>` abre esa hoja.
  if (['MX', 'CO'].includes(q.get('pais'))) PAIS = q.get('pais');
  const marca = Object.keys(HOJAS).find(k => HOJAS[k].slug === (q.get('marca') || q.get('hoja')));
  if (marca) PAIS = marca;
  if (SECCIONES.some(s => s.k === q.get('hoja'))) SECCION = q.get('hoja');
  const ancla = (location.hash || '').replace('#h-', '');
  if (SECCIONES.some(s => s.k === ancla)) SECCION = ancla;
  if (VENTANAS.includes(q.get('meses'))) MESES = q.get('meses');
  if (BLOQUES.includes(q.get('bloque'))) BLOQUE = q.get('bloque');
  if (q.get('leads') in LEADS_OPC) LEADS_SEL = q.get('leads');
  if (q.get('publico') in PUBLICOS) PUBLICO = q.get('publico');
}

document.addEventListener('click', e => {
  const h = e.target.closest('.help-btn[data-ayuda]');
  if (h) {
    const [titulo, cuerpo] = AYUDA[h.dataset.ayuda];
    document.getElementById('ayudaCuerpo').innerHTML = `<h3>${titulo}</h3>${cuerpo}`;
    document.getElementById('ayuda').showModal();
    return;
  }
  const t = e.target.closest('.tab[data-seccion]');
  if (t) {
    SECCION = t.dataset.seccion;
    syncURL();
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.pick === 'marca') {
    if (b.getAttribute('aria-disabled') === 'true') return;
    PAIS = b.dataset.val;
  }
  else if (b.dataset.pick === 'meses') MESES = b.dataset.val;
  else if (b.dataset.pick === 'bloque') BLOQUE = b.dataset.val;
  else if (b.dataset.pick === 'leads') LEADS_SEL = b.dataset.val;
  else if (b.dataset.pick === 'publico') PUBLICO = b.dataset.val;
  else if (b.dataset.pick === 'toppauta') TOP_FILTRO = b.dataset.val;
  else if (b.dataset.pick === 'tendencia') TENDENCIA = b.dataset.val;
  else return;
  syncURL();
  render();
});

(async () => {
  readURL();
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty-metric">
      <span class="icon">—</span><strong>Aún no hay data.json</strong>
      <p>Se genera con <code>python3 build.py</code> desde esta carpeta, y el cron del hub lo
      regenera cada 4 horas.</p></div>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
