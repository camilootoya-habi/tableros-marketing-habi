<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
<title>Salud de marca — Habi</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card-hover: #263348;
    --border: #334155; --border-strong: #4b5563; --row-border: #283548;
    --text: #e2e8f0; --text-title: #f8fafc;
    --text-muted: #cbd5e1; --text-muted-2: #94a3b8; --text-muted-3: #64748b;
    --accent: #818cf8; --accent-on: #f8fafc;
    --warn-bg: #78350f; --warn-fg: #fde68a;
    --banda-tv: rgba(251, 191, 36, .13); --banda-uber: rgba(52, 211, 153, .13);
  }
  body.light {
    --bg: #f5f7fa; --card: #ffffff; --card-hover: #f1f5f9;
    --border: #e2e8f0; --border-strong: #cbd5e1; --row-border: #f1f5f9;
    --text: #334155; --text-title: #0f172a;
    --text-muted: #475569; --text-muted-2: #64748b; --text-muted-3: #94a3b8;
    --accent: #6366f1; --accent-on: #ffffff;
    --warn-bg: #fef3c7; --warn-fg: #92400e;
    --banda-tv: rgba(217, 119, 6, .11); --banda-uber: rgba(5, 150, 105, .12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* El desborde se arregla en la causa, no escondiéndolo: las rejillas usan `minmax(0, 1fr)` y
     sus hijos `min-width: 0`. Una columna `1fr` no baja de su contenido mínimo, así que un título
     largo o un canvas ensanchaban la columna y la rejilla se salía de la pantalla. Nada de
     `overflow-x: hidden` acá: recortaría en silencio si algo volviera a desbordarse. */
  html, body { max-width: 100%; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px; transition: background .2s, color .2s; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted-2); text-decoration: none; font-size: 13px; transition: color .15s, border-color .15s; }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }

  /* Header fijo con una hoja por marca. Mismo patrón que marketing-sellers: sangra hasta el
     borde del viewport (el body tiene 24px de padding) para tapar lo que pasa por debajo. */
  .tabs { position: sticky; top: 0; z-index: 30; display: flex; gap: 10px; align-items: center;
    min-height: 61px; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 24px; margin: -24px -24px 20px; }
  .tabnav { flex: 1; display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 760px) { .tabs { flex-wrap: wrap; min-height: 0; } }
  .tab { cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text-muted);
    border-radius: 9px; padding: 8px 15px; font: inherit; font-size: 13.5px; font-weight: 600; white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s; }
  .tab:hover { color: var(--text); border-color: var(--border-strong); }
  .tab.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs .tab, .tabs .back-link { height: 37px; display: inline-flex; align-items: center; }
  .tabs { flex-wrap: wrap; row-gap: 8px; }
  .tabs .theme-btn { height: 37px; padding: 0 12px; }
  /* Segunda fila del header: filtros compactos, con la etiqueta al lado y no arriba. */
  .tabs .filters { flex-basis: 100%; justify-content: center; gap: 22px; margin: 0; }
  .tabs .fgroup { flex-direction: row; align-items: center; gap: 8px; }
  .tabs .chip { padding: 3px 11px; font-size: 12px; }
  .chip small { font-weight: 500; opacity: .7; font-size: 10.5px; }
  /* Marca sin datos en esta hoja: visible (para que se sepa que existe) pero sin acción. */
  .chip.off { opacity: .38; cursor: not-allowed; }
  .chip.off:hover { border-color: var(--border); color: var(--text-muted-2); }
  .tab small { font-weight: 500; opacity: .75; margin-left: 5px; font-size: 11.5px; }

  /* Ayuda: texto corto a la vista, "?" para la explicación larga (mismo patrón que
     marketing-sellers). Un solo <dialog> que se llena desde AYUDA[clave]. */
  .help-btn { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--border); color: var(--text-muted-2); border: none; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 5px; vertical-align: middle; padding: 0; line-height: 1; transition: background .15s, color .15s; flex: none; }
  .help-btn:hover { background: var(--accent); color: var(--accent-on); }
  .help-dialog { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 22px 26px; max-width: 560px; width: calc(100% - 32px); margin: auto; font-family: inherit; }
  .help-dialog::backdrop { background: rgba(2, 6, 23, .55); backdrop-filter: blur(2px); }
  .help-dialog h3 { color: var(--text-title); font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .help-dialog p, .help-dialog li { font-size: 13px; line-height: 1.6; color: var(--text-muted); margin-bottom: 9px; }
  .help-dialog ul { padding-left: 18px; margin-bottom: 9px; }
  .help-dialog strong { color: var(--text-title); }
  .help-dialog .ej { background: var(--bg); border-left: 3px solid var(--accent); border-radius: 6px; padding: 9px 12px; }
  .help-dialog .close-btn { margin-top: 8px; background: var(--border); color: var(--text); border: none; padding: 7px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .help-dialog .close-btn:hover { background: var(--border-strong); }

  /* Resumen de una pregunta de Brand Lift: 4 datos en fila, cada uno con su "?". */
  .kpis { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 11px; min-width: 0; }
  .kpi .k { font-size: 10.5px; color: var(--text-muted-3); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; display: flex; align-items: center; }
  .kpi .v { font-size: 15px; font-weight: 700; color: var(--text-title); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 11.5px; font-weight: 500; color: var(--text-muted-2); }

  /* Top de publicaciones de Instagram: miniatura cuadrada + datos + link. */
  .top-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .top-post { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; color: inherit; text-decoration: none; transition: border-color .15s; }
  .top-post:hover { border-color: var(--accent); }
  .top-post .img { aspect-ratio: 1; background: var(--row-border) center / cover no-repeat; position: relative; }
  .top-post .rank { position: absolute; top: 7px; left: 7px; background: rgba(0, 0, 0, .65); color: #fff; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 2px 7px; }
  .top-post .fmt { position: absolute; top: 7px; right: 7px; background: rgba(0, 0, 0, .65); color: #fff; font-size: 10.5px; border-radius: 5px; padding: 2px 7px; }
  .top-post .pauta { position: absolute; bottom: 7px; left: 7px; background: #f59e0b; color: #1c1917; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 2px 7px; }
  .top-post .info { padding: 8px 10px 10px; font-size: 11.5px; color: var(--text-muted-2); line-height: 1.45; }
  .top-post .info b { color: var(--text-title); font-size: 13px; }
  .top-post .txt { color: var(--text-muted-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }

  /* Tendencia: 6 tarjetas con minigráfica, valor del periodo y cambio contra el anterior. */
  .seis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .seis > * { min-width: 0; }
  @media (max-width: 1300px) { .seis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .seis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .panel.tend { padding: 10px 11px 8px; }
  .panel.tend h3 { font-size: 11.5px; line-height: 1.3; }
  .tend-v { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 4px; flex-wrap: wrap; }
  .tend-v b { font-size: 19px; color: var(--text-title); font-variant-numeric: tabular-nums; }
  .delta { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
  .delta.sube { color: #059669; background: rgba(52, 211, 153, .15); }
  .delta.baja { color: #dc2626; background: rgba(248, 113, 113, .15); }
  .delta.neutro { color: var(--text-muted-2); background: var(--row-border); }
  /* Alcance e interacción de Instagram: dos líneas de 4 con el mismo eje de meses. */
  .cuatro { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .cuatro > * { min-width: 0; }
  @media (max-width: 1100px) { .cuatro { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .cuatro { grid-template-columns: 1fr; } }
  /* Del contenido al sitio: 5 gráficas en una línea (3 valores + 2 conversiones). Rejilla FIJA
     para que las cinco compartan ancho y se lean de izquierda a derecha como un embudo. */
  .cinco { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .cinco > * { min-width: 0; }
  @media (max-width: 1300px) { .cinco { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 800px) { .cinco { grid-template-columns: 1fr; } }

  /* Eficiencia: una tarjeta por pregunta con veredicto en palabras. */
  .costo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .costo-grid > * { min-width: 0; }
  .costo-v { font-size: 22px; font-weight: 800; color: var(--text-title); font-variant-numeric: tabular-nums; }
  .costo-v small { font-size: 12px; font-weight: 500; color: var(--text-muted-2); }
  .costo-comp { font-size: 12px; color: var(--text-muted); margin: 4px 0 8px; line-height: 1.55; }
  .costo-comp b.mejor { color: #34d399; } .costo-comp b.peor { color: #f87171; }
  body.light .costo-comp b.mejor { color: #047857; } body.light .costo-comp b.peor { color: #b91c1c; }

  /* Brand Lift ampliado: ficha del estudio y tabla de eficiencia. */
  .ficha { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 0 0 16px; }
  .ficha > div { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; min-width: 0; }
  .ficha .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted-3); font-weight: 700; }
  .ficha .v { font-size: 19px; font-weight: 700; color: var(--text-title); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .ficha .d { font-size: 11px; color: var(--text-muted-3); margin-top: 2px; line-height: 1.4; }
  .sig { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 2px 7px; }
  .sig.si { background: rgba(52, 211, 153, .16); color: #34d399; }
  .sig.neg { background: rgba(248, 113, 113, .16); color: #f87171; }
  .sig.no { background: var(--row-border); color: var(--text-muted-2); }
  body.light .sig.si { color: #047857; } body.light .sig.neg { color: #b91c1c; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 22px; font-weight: 600; color: var(--text-title); }
  .header h1 span { color: var(--accent); }
  .cobertura { font-size: 11.5px; color: var(--text-muted-3); margin-left: auto; margin-right: 10px; }
  .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-muted-2); border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer; transition: background .15s, color .15s; }
  .theme-btn:hover { background: var(--card-hover); color: var(--accent); }
  .sub { color: var(--text-muted-2); font-size: 13px; line-height: 1.6; max-width: 820px; margin-bottom: 18px; }

  /* Selector estándar: grupos de chips. Single-select para país y para los filtros. */
  .filters { display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 20px; }
  .fgroup { display: flex; flex-direction: column; gap: 6px; }
  .flabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted-3); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--border); color: var(--text-muted-2); border-radius: 999px; padding: 5px 13px; font-size: 12.5px; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-weight: 600; }

  /* Encabezado de BLOQUE: agrupa indicadores por tipo de señal (Percepción / Búsqueda /
     Demanda). Es la jerarquía que hace legible un tablero de 7 indicadores: sin ella, siete
     secciones seguidas se leen como una lista sin argumento. */
  /* Leyenda de las bandas. Una franja sombreada sin explicación es un misterio: aparece en
     todas las gráficas del país y nada dice qué marca. */
  .leyenda-tv { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 12px;
                color: var(--text-muted-2); background: var(--card); border: 1px solid var(--border);
                border-radius: 8px; padding: 9px 13px; margin-bottom: 18px; }
  .leyenda-tv .muestra { width: 22px; height: 13px; border-radius: 3px; display: inline-block;
                         border: 1px solid var(--border-strong); flex: none; vertical-align: -2px; }
  .leyenda-tv .camp { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda-tv .camp em { color: var(--text-muted-3); font-style: normal; }
  .leyenda-tv .nota { flex-basis: 100%; font-size: 11.5px; color: var(--text-muted-3); line-height: 1.5; }
  .bloque { border-top: 2px solid var(--accent); padding-top: 10px; margin: 4px 0 14px; }
  .bloque-h { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); }
  .bloque-p { font-size: 12.5px; color: var(--text-muted-2); margin-top: 3px; }

  .section { margin-bottom: 26px; }
  .section > h2 { font-size: 15px; color: var(--text-title); font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .section > p.hint { font-size: 12.5px; color: var(--text-muted-3); margin-bottom: 12px; line-height: 1.55; max-width: 780px; }

  .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 5px; background: var(--warn-bg); color: var(--warn-fg); }
  .src { font-size: 10.5px; color: var(--text-muted-3); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .charts-grid > *, .opciones-grid > *, .tres-vars > * { min-width: 0; }
  /* Brand Lift va en rejilla fija de 3 para que las dos filas queden alineadas columna a columna:
     arriba el valor del indicador, abajo su descomposición. Si no fuera fija, el auto-fit podría
     acomodar 2 y 4 y se perdería la correspondencia vertical, que es todo el punto del layout. */
  .charts-grid.tres { grid-template-columns: repeat(3, 1fr); }
  .charts-grid.tres + .charts-grid.tres { margin-top: 14px; }
  @media (max-width: 1000px) { .charts-grid.tres { grid-template-columns: 1fr; } }

  /* Una fila = un indicador, una sola gráfica a lo ancho. Las columnas de expuestos y no
     expuestos ya llevan el lift en la línea del eje derecho: un panel aparte solo con el lift
     repetía el mismo dato en otra forma. */
  /* Exit poll: una gráfica por opción, 5 por fila. Rejilla FIJA de 5 —no auto-fit— para que las
     filas queden alineadas columna a columna y el orden por volumen se lea en zigzag limpio. */
  .opciones-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1300px) { .opciones-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 800px)  { .opciones-grid { grid-template-columns: 1fr; } }
  .panel.mini { padding: 10px 11px 9px; }
  .panel.mini h3 { font-size: 11.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .ch.chico { height: 125px; }

  .ch.alto { height: 260px; }
  .fila { margin-bottom: 18px; }
  .fila:last-child { margin-bottom: 0; }
  .fila > .fila-h { display: flex; align-items: baseline; gap: 9px; margin-bottom: 7px; flex-wrap: wrap; }
  .fila > .fila-h .n { font-size: 10.5px; font-weight: 700; color: var(--accent); border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 6px; }
  .fila > .fila-h h4 { font-size: 13.5px; font-weight: 700; color: var(--text-title); }
  .fila > .fila-h .q { font-size: 11.5px; color: var(--text-muted-3); }
  /* La fila de una pregunta sin nombre se marca visualmente: su serie es real, pero afirmar
     cuál pregunta es sería inventar. El punteado dice "esto todavía no está cerrado". */
  .fila.dudosa > .panel { border-style: dashed; border-color: var(--border-strong); }
  .fila.dudosa > .fila-h .n { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-bg); }
  .nota-hueco { background: var(--card); border: 1px dashed var(--border-strong); border-left: 3px solid var(--accent); border-radius: 8px; padding: 11px 14px; margin: 4px 0 14px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }
  .fila > .fila-h .aviso { font-size: 10.5px; font-weight: 600; background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 2px 7px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 15px 12px; display: flex; flex-direction: column; }
  .panel h3 { font-size: 12.5px; color: var(--text-title); font-weight: 700; margin-bottom: 2px; }
  .panel .cap { font-size: 11px; color: var(--text-muted-3); margin-bottom: 8px; }
  .ch { position: relative; height: 200px; }
  /* Variante de 3 gráficas: rejilla FIJA de 3 para que las tres variables del indicador queden
     alineadas columna a columna entre filas. Con auto-fit una fila podría acomodar 2 y otra 3. */
  .tres-vars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1000px) { .tres-vars { grid-template-columns: 1fr; } }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .legend span { font-size: 11px; color: var(--text-muted-2); display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* El vacío explícito: cuando falta la FUENTE, se explica. Nunca un chart en blanco ni ceros. */
  .empty-metric { background: var(--card); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 28px 24px; text-align: center; }
  .empty-metric.planeada { border-style: solid; border-color: var(--border); background: transparent; }
  .empty-metric .icon { font-size: 22px; color: var(--text-muted-3); display: block; margin-bottom: 8px; }
  .empty-metric strong { display: block; font-size: 13.5px; color: var(--text-muted); margin-bottom: 8px; }
  .empty-metric p { font-size: 12.5px; color: var(--text-muted-3); line-height: 1.65; max-width: 620px; margin: 0 auto; }

  /* Agente encuestador (Pulso): una ola es un corte, se dibuja con barras HTML
     y no con Chart.js — un solo punto no es una serie. */
  .pulso-fila { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 44px; align-items: center; gap: 10px; margin: 9px 0 0; }
  .pulso-label { font-size: 12.5px; color: var(--text-muted); line-height: 1.35; }
  .pulso-riel { height: 9px; background: var(--row-border); border-radius: 999px; overflow: hidden; }
  .pulso-barra { height: 100%; border-radius: 999px; }
  .pulso-pct { font-size: 12.5px; font-weight: 700; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .pulso-nota { font-size: 11px; color: var(--text-muted-3); line-height: 1.5; margin: 3px 0 0; padding-left: calc(34% + 10px); }
  .pulso-lista { list-style: decimal inside; margin: 8px 0 0; padding: 0; font-size: 12.5px; color: var(--text-muted); }
  .pulso-lista li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--row-border); }
  .pulso-lista li b { font-variant-numeric: tabular-nums; color: var(--text-muted-2); }
  .pulso-bloque { font-size: 13px; font-weight: 700; color: var(--text-title); margin: 22px 0 10px; }

<script>
// Modo claro por defecto (decisión de Camilo, 6-oct-2026); oscuro solo si alguien lo eligió.
if (localStorage.getItem('tablero-theme') !== 'dark') {
  document.body.classList.add('light');
} else {
  document.getElementById('themeToggle').textContent = '🌙';
}

const cssv = n => getComputedStyle(document.body).getPropertyValue(n).trim();

// ── Campañas con banda de fondo ───────────────────────────────────────────────
// Se pintan como banda en TODAS las gráficas mensuales para poder leer cualquier indicador
// contra el periodo de campaña sin cruzar dos pantallas.
// `hasta: null` = la campaña sigue abierta: la banda llega hasta el último mes de la ventana y
// se redibuja sola cuando entren meses nuevos, sin tener que acordarse de actualizar la fecha.
const CAMPANAS = {
  MX: [
    { desde: '2023-02', hasta: '2023-04', nombre: 'TV 2023', color: 'tv' },
    { desde: '2024-06', hasta: '2024-09', nombre: 'TV 2024', color: 'tv' },
    { desde: '2025-10', hasta: '2025-12', nombre: 'TV 2025', color: 'tv' },
    { desde: '2025-12', hasta: null, nombre: 'Uber brandeado', color: 'uber' },
  ],
  CO: [],
};
const COLOR_CAMPANA = { tv: '--banda-tv', uber: '--banda-uber' };

// Dibuja las bandas DEBAJO de las series (`beforeDatasetsDraw`): son contexto, no un dato más, y
// encima taparían las barras. Los bordes se recortan contra el área del chart, así que una
// campaña que empieza antes de la ventana se ve cortada en el borde en vez de desbordarse.
// Dos campañas solapadas (TV 2025 y Uber comparten diciembre) se superponen a propósito: los
// colores son translúcidos, así que el solape se ve más oscuro y eso ES la información.
const bandasTV = {
  id: 'bandasTV',
  beforeDatasetsDraw(chart) {
    const bandas = ((chart.options.plugins || {}).bandasTV || {}).bandas || [];
    if (!bandas.length) return;
    const labels = chart.data.labels || [];
    const x = chart.scales.x, a = chart.chartArea;
    if (!x || !a || !labels.length) return;
    const medio = (x.width / labels.length) / 2;
    const fin = labels[labels.length - 1];
    chart.ctx.save();
    bandas.forEach(b => {
      const hasta = b.hasta || fin;      // campaña abierta: hasta donde llegue la serie
      const i0 = labels.findIndex(m => m >= b.desde);
      let i1 = -1;
      labels.forEach((m, i) => { if (m <= hasta) i1 = i; });
      if (i0 < 0 || i1 < i0) return;     // la campaña cae fuera de la ventana visible
      chart.ctx.fillStyle = cssv(COLOR_CAMPANA[b.color] || '--banda-tv');
      const xa = Math.max(a.left, x.getPixelForValue(i0) - medio);
      const xb = Math.min(a.right, x.getPixelForValue(i1) + medio);
      chart.ctx.fillRect(xa, a.top, xb - xa, a.bottom - a.top);
    });
    chart.ctx.restore();
  },
};
// Una línea vertical por spot, en el bloque donde cayó la emisión. Va ENCIMA de las series
// (`afterDatasetsDraw`) porque aquí el spot es el dato que se busca, no contexto de fondo.
const marcasSpot = {
  id: 'marcasSpot',
  afterDatasetsDraw(chart) {
    const o = (chart.options.plugins || {}).marcasSpot || {};
    const idx = o.indices || [];
    const x = chart.scales.x, a = chart.chartArea;
    if (!idx.length || !x || !a) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = o.color; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
    [...new Set(idx)].forEach(i => {
      const px = x.getPixelForValue(i);
      ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
    });
    ctx.restore();
  },
};
// Intervalo de confianza del lift como bigote vertical sobre cada barra. Sin él, un +2 pts que
// Meta no distingue de cero se ve igual que un +2 pts real; con él, el lector ve si el intervalo
// cruza el cero (no concluyente) sin tener que leer el tooltip.
const bigotes = {
  id: 'bigotes',
  afterDatasetsDraw(chart) {
    const o = (chart.options.plugins || {}).bigotes || {};
    const lo = o.lo || [], hi = o.hi || [];
    const x = chart.scales.x, y = chart.scales.y;
    if (!lo.length || !x || !y) return;
    const ctx = chart.ctx, tapa = Math.max(3, Math.min(7, x.width / lo.length / 5));
    ctx.save();
    ctx.strokeStyle = o.color; ctx.lineWidth = 1.4;
    lo.forEach((a, i) => {
      const b = hi[i];
      if (a == null || b == null) return;
      const px = x.getPixelForValue(i), ya = y.getPixelForValue(a), yb = y.getPixelForValue(b);
      ctx.beginPath();
      ctx.moveTo(px, ya); ctx.lineTo(px, yb);
      ctx.moveTo(px - tapa, ya); ctx.lineTo(px + tapa, ya);
      ctx.moveTo(px - tapa, yb); ctx.lineTo(px + tapa, yb);
      ctx.stroke();
    });
    ctx.restore();
  },
};
if (window.Chart) Chart.register(bandasTV, marcasSpot, bigotes);
let _charts = [];
function destroyCharts() { _charts.forEach(c => c.destroy()); _charts = []; }

// Formatea un valor según el tipo de eje. `pct` y `pts` vienen como fracción en data.json.
const FMT = {
  pct: v => (100 * v).toFixed(2) + '%', pts: v => (100 * v).toFixed(1) + ' pts',
  pctFino: v => (100 * v).toFixed(3) + '%',
  compacto: v => v.toLocaleString('es-MX'),
  usdMil: v => 'US$' + Math.round(v).toLocaleString('es-MX'),
  money: v => '$' + v.toLocaleString('es-MX', { maximumFractionDigits: 2 }),
  num: v => v.toLocaleString('es-MX'),
};
const FMT_EJE = {
  pct: v => (100 * v).toFixed(0) + '%', pts: v => (100 * v).toFixed(0),
  // Tasas de interacción de Instagram (0.02-0.08%): con 0 decimales el eje dice "0%" en todo.
  pctFino: v => (100 * v).toFixed(2) + '%',
  // Millones en el eje ("18 M" y no "18,000,000"); el tooltip sí da la cifra completa.
  compacto: v => Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString('es-MX', { maximumFractionDigits: 1 }) + ' M'
    : Math.abs(v) >= 1e3 ? (v / 1e3).toLocaleString('es-MX', { maximumFractionDigits: 0 }) + ' mil' : v.toLocaleString('es-MX'),
  usdMil: v => Math.abs(v) >= 1e3 ? `$${(v / 1e3).toLocaleString('es-MX', { maximumFractionDigits: 0 })} mil` : `$${v}`,
  // Montos chicos (costo por persona: US$0.05-0.40) necesitan 2 decimales o el eje repite "$0.3".
  money: v => '$' + v.toLocaleString('es-MX', { maximumFractionDigits: Math.abs(v) < 10 ? 2 : 1 }),
  num: v => v.toLocaleString('es-MX'),
};

// Extiende el mkChart de la plantilla del repo a varias series y a doble eje. Brand Lift necesita
// las tasas (columnas, en %) y el lift (línea, en puntos) en el mismo chart: son magnitudes
// distintas y compartir eje aplastaría la línea contra el suelo.
function mkMulti(id, labels, datasets, o = {}) {
  const c = document.getElementById(id); if (!c || !window.Chart) return;
  const grid = cssv('--border'), tick = cssv('--text-muted-2');
  const izq = o.fmt || 'num', der = o.fmtDerecha;
  const usaDerecha = datasets.some(d => d.eje === 'y1');
  const scales = {
    // `o.apilado`: barras una sobre otra (publicaciones por formato suman el total del mes).
    x: { stacked: !!o.apilado, ticks: { color: tick, maxTicksLimit: 8 }, grid: { display: false } },
    // `o.max` fuerza el techo del eje. Se usa para que dos paneles hermanos compartan escala:
    // sin eso cada uno autoescala y dos series de niveles distintos se ven del mismo tamaño.
    // `sMin`/`sMax`: lo que no es una serie pero debe caber (los bigotes del intervalo).
    y: { beginAtZero: o.desdeCero ?? (izq !== 'pts'), stacked: !!o.apilado, max: o.max,
         suggestedMin: o.sMin, suggestedMax: o.sMax,
         ticks: { color: tick, callback: FMT_EJE[izq] }, grid: { color: grid } },
  };
  if (usaDerecha) {
    // `o.maxDerecha` sube el techo del eje derecho para que una serie de contexto (los spots
    // del día) quede baja, debajo de las líneas, en vez de competir con ellas por la altura.
    scales.y1 = { position: 'right', beginAtZero: !!o.maxDerecha, max: o.maxDerecha,
                  ticks: { color: tick, callback: FMT_EJE[der || 'pts'] },
                  grid: { drawOnChartArea: false } };
  }
  _charts.push(new Chart(c, {
    data: { labels, datasets: datasets.map(d => ({
      type: d.type || 'line', label: d.label, data: d.data, yAxisID: d.eje || 'y',
      order: d.orden != null ? d.orden : 0,
      borderColor: d.color, backgroundColor: d.fill || d.color,
      borderDash: d.dash || [], tension: d.tension != null ? d.tension : .35,
      // `puntoRadio`/`puntoColor` aceptan arreglo: es como se marcan los días anómalos sin
      // meter una serie aparte que ensucie la leyenda y el tooltip.
      pointRadius: d.puntoRadio != null ? d.puntoRadio : (d.type === 'line' ? 2 : 0),
      pointBackgroundColor: d.puntoColor || d.color,
      pointBorderColor: d.puntoColor || d.color,
      borderWidth: d.grosor != null ? d.grosor : 2, borderRadius: 3,
      // spanGaps: false a propósito — un mes sin medición debe dejar HUECO, no unir la línea
      // por encima. Ver el contrato de data.json.
      spanGaps: false })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        bandasTV: { bandas: o.sinBandas ? [] : (CAMPANAS[PAIS] || []) },
        marcasSpot: o.spots || {},
        bigotes: o.bigotes || {},
        tooltip: { callbacks: { label: ctx => {
        const y = ctx.parsed.y;
        if (y == null) return `${ctx.dataset.label}: sin dato`;
        const f = ctx.dataset.yAxisID === 'y1' ? (der || 'pts') : izq;
        return `${ctx.dataset.label}: ${FMT[f](y)}`; },
        afterBody: items => (o.pieTooltip && items.length) ? o.pieTooltip(items[0].dataIndex) : [] } } },
      scales,
    }
  }));
}

const C = { azul: '#818cf8', gris: '#94a3b8', ambar: '#fbbf24', verde: '#34d399',
            rojo: '#f87171',
            rosa: '#f472b6', cian: '#22d3ee' };
const PALETA = [C.azul, C.verde, C.ambar, C.cian, C.rosa, C.gris];
const NOMBRE_PREGUNTA = { ad_recall: 'Ad recall (recordación del anuncio)',
                          toma: 'Top of mind awareness', favorability: 'Brand favorability',
                          intent: 'Intent (intención de elegirnos)',
                          sin_identificar_alta: 'Pregunta sin identificar — la de tasa alta',
                          sin_identificar_baja: 'Pregunta sin identificar — la de tasa baja' };

// El texto LITERAL que ve el encuestado, leído de Ads Manager (2026-08-31). Cambia por país:
// la marca se llama Habi en CO y Tuhabi en MX, y la lista de competidores del TOMA no es la
// misma. Sin este texto, favorability en -4 pts se lee como una caída de marca en vez de como
// lo que es, una pregunta de opinión midiendo otra cosa.
const PREGUNTA_TEXTO = {
  CO: {
    ad_recall: '«¿Recuerdas haber visto un anuncio de Habi en internet o en un dispositivo móvil en los últimos dos días?»',
    toma: '«¿Cuál de las siguientes marcas te viene primero a la mente al pensar en compañías que compren vivienda de manera directa?» — Habi / Home Capital / Houm / Otra-ninguna',
    favorability: '«¿Cómo describirías tu opinión general sobre Habi?» — deseada: muy o bastante favorable',
    intent: '«¿Elegirás o tendrás en cuenta a Habi la próxima vez que necesites vender tu vivienda?»',
  },
  MX: {
    ad_recall: '«¿Recuerdas haber visto un anuncio de Tuhabi online o en un dispositivo móvil en los últimos dos días?»',
    toma: '«¿Cuál de los(as) siguientes marcas te viene primero a la mente al pensar en compañías que compren vivienda de manera directa?» — Tuhabi / Flat / Clikalia / Inmuebles24 / Otra-ninguna',
    favorability: '«¿Cómo describirías tu opinión general sobre Tuhabi?» — deseada: muy o algo favorable',
  },
};

// ⚠ El TOMA de CO (41-53%) y el de MX (11-20%) no se comparan como niveles, y la brecha tiene
// DOS causas que no se pueden separar con estos datos:
//   1. Marca real: Habi es más fuerte en Colombia — es donde se fundó, lleva más años y compra
//      más casas sobre una población menor. Es de esperar que le vaya mejor en top of mind.
//   2. Diseño de la pregunta: MX elige entre 4 marcas y CO entre 3, y menos opciones sube la
//      tasa mecánicamente.
// Lo que sí es limpio es la TENDENCIA dentro de cada país, porque ahí la pregunta no cambia.
// Se avisa en el tablero en vez de esconderlo, porque el toggle de país invita a esa comparación.
// (El aviso del TOMA se quitó del tablero por decisión de Camilo el 2026-08-31. El comentario de
// arriba se conserva: la advertencia sigue siendo cierta para quien lea el código, pero no se
// impone al lector del tablero.)
const AVISO_PREGUNTA = {
  intent: 'Solo Colombia: México no incluye esta pregunta en su estudio.',
  sin_identificar_alta: 'Es Top of mind awareness o Intent — la serie es real, el nombre no está confirmado.',
  sin_identificar_baja: 'Es Top of mind awareness o Intent — la serie es real, el nombre no está confirmado.',
};

// El texto que explica el hueco. Las dos preguntas están en el estudio de CO desde jul-2022 con
// datos completos; lo que falta es la ETIQUETA, y no se deduce: TOMA e Intent tienen la misma
// huella de benchmark. Se muestran con nombre posicional en vez de esconderse, porque el tablero
// explica sus huecos. Se resuelve leyendo el lift de la pestaña "Top of mind awareness" en
// Ads Manager (estudio Jul 2026-Aug 2026 de Colombia).
const NOTA_SIN_ID = 'Colombia pregunta cuatro cosas y dos ya no se distinguen por su huella de '
  + 'benchmark: <strong>Top of mind awareness</strong> e <strong>Intent</strong>. La serie de '
  + 'abajo es real y completa desde jul-2022 — lo único que falta es saber cuál es cuál. Se '
  + 'resuelve leyendo el lift de la pestaña "Top of mind awareness" en Ads Manager.';

const meses = s => [...new Set(s.map(r => r.month))].sort();

// Promedio móvil sobre una serie ya alineada a las etiquetas. La muestra mensual de Brand Lift
// es de ~500 encuestados por pregunta, así que un mes puede moverse varios puntos por azar; la
// media móvil separa el nivel de la marca del ruido del muestreo.
// Un mes sin dato NO aporta y NO interrumpe: se promedia sobre los valores que haya en la
// ventana. Si el mes en curso es nulo, el punto es nulo — dibujar media sobre un mes que no se
// midió inventaría un dato. ⚠ Con MX sin estudio entre abr-2024 y mar-2025, una ventana de 6
// puede promediar meses separados por un año: el punto sigue siendo honesto (solo usa lo que
// hay) pero conviene leerlo junto al aviso de huecos.
const VENTANA_MEDIA = 6;
const mediaMovil = (vals, n = VENTANA_MEDIA) => vals.map((v, i) => {
  if (v == null) return null;
  const w = vals.slice(Math.max(0, i - n + 1), i + 1).filter(x => x != null);
  return w.reduce((a, b) => a + b, 0) / w.length;
});

// Ventana común a todas las series mensuales. Brand Lift ya lleva 46 meses y el exit poll 28
// utilizables: toda la historia de golpe aplasta el detalle de lo reciente, que es lo que se mira
// para operar, y la historia completa queda a un clic. Es UN solo filtro para todo el tablero, no
// uno por indicador: dos ventanas distintas en la misma pantalla harían que dos gráficas vecinas
// cubran periodos distintos sin que nada lo diga.
// La ventana se cuenta sobre los meses QUE HAY, no sobre el calendario: un mes sin estudio (o sin
// respuestas suficientes en el exit poll) no debe consumir un lugar de la ventana.
const VENTANAS = ['12 meses', '24 meses', 'Todo'];

// La ventana se cuenta en MESES DE CALENDARIO, no en meses con dato. Contar los que hay parece
// más limpio pero miente: MX no tuvo estudio de Brand Lift entre abr-2024 y mar-2025, así que
// "24 meses" empaquetaba 24 estudios repartidos en 39 meses reales y el eje se veía continuo
// cuando no lo era. Los meses sin dato entran como hueco: `spanGaps: false` en mkMulti los deja
// vacíos en vez de unir la línea por encima, y una barra ausente se lee como ausencia.
const mesSiguiente = m => {
  let [y, n] = m.split('-').map(Number);
  return ++n > 12 ? `${y + 1}-01` : `${y}-${String(n).padStart(2, '0')}`;
};
const rangoCalendario = (desde, hasta) => {
  const out = [];
  for (let m = desde; m <= hasta; m = mesSiguiente(m)) out.push(m);
  return out;
};
// `hasta` es el último mes CON DATO, no el mes actual: no tiene sentido dibujar meses futuros ni
// arrastrar una cola vacía cuando la fuente todavía no publicó el mes en curso.
const recortar = (L, ventana) => {
  if (!L.length) return L;
  const completo = rangoCalendario(L[0], L[L.length - 1]);
  const n = parseInt(ventana, 10);
  return Number.isNaN(n) ? completo : completo.slice(-n);
};

const legend = items => `<div class="legend">${items.map(([c, t]) =>
  `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;

// Una hoja por marca, en el header fijo. La clave sigue siendo la de data.json (MX, CO) para no
// reescribir cada indicador: Tuhabi es la marca de México y Habi la de Colombia. Propiedades.com
// es una marca más (no un país) y por ahora solo tiene seguidores: no corre Brand Lift ni tiene
// el resto de las fuentes.
const HOJAS = {
  MX: { nombre: 'Tuhabi', pais: 'México', slug: 'tuhabi' },
  CO: { nombre: 'Habi', pais: 'Colombia', slug: 'habi' },
  PCOM: { nombre: 'Propiedades.com', pais: 'México', slug: 'propiedades' },
};
// Una hoja por FUENTE en el header (decisión de Camilo, 6-oct-2026) y la marca como selector
// aparte. Cada hoja declara qué marcas tiene; las demás salen deshabilitadas con `sinDato` como
// explicación. `metrica` es la clave de data.json (Instagram y Facebook comparten `seguidores`).
// `fn` se resuelve al dibujar: las funciones están declaradas más abajo.
const SECCIONES = [
  { k: 'brand_lift', nombre: 'Brand Lift', metrica: 'brand_lift', marcas: ['MX', 'CO'], ayuda: 'bl',
    titulo: 'Brand Lift continuo de Meta', fn: () => drawBrandLift,
    hint: 'Un experimento mensual de Meta: compara a quienes vieron la pauta con quienes no. La diferencia es lo que la pauta <strong>causó</strong>.',
    sinDato: 'Propiedades.com no corre estudios de Brand Lift con Meta.' },
  { k: 'instagram', nombre: 'Instagram', metrica: 'seguidores', marcas: ['MX', 'CO', 'PCOM'], ayuda: 'seg',
    titulo: 'Instagram', fn: () => drawInstagram,
    hint: 'Quién nos sigue, qué publicamos y qué engancha. Por mes.' },
  { k: 'facebook', nombre: 'Facebook', metrica: 'seguidores', marcas: ['MX', 'CO', 'PCOM'], ayuda: 'seg',
    titulo: 'Facebook', fn: () => drawFacebook,
    hint: 'Cuánta gente decide seguir la página y cuánta deja de hacerlo. Por mes.' },
  { k: 'exit_poll', nombre: 'Exit poll', metrica: 'exit_poll', marcas: ['MX'],
    titulo: 'Atribución declarada — exit poll de registro', fn: () => drawExitPoll,
    hint: 'Lo que la gente dice cuando se le pregunta dónde nos conoció, al momento de registrarse. Es declarado, no medido: sirve para leer tendencia, nunca para atribuir cierres.',
    sinDato: 'El exit poll solo existe en el registro de Tuhabi (México). En Colombia la pregunta dejó de capturarse en abr-2025.' },
  { k: 'encuestador', nombre: 'Pulso', metrica: 'encuestador', marcas: ['MX'],
    titulo: 'Agente encuestador de marca — Pulso Inmobiliario', fn: () => drawEncuestador,
    hint: 'Encuesta por WhatsApp y por un agente de voz a dueños que publican vivienda en propiedades.com y a brokers independientes; el selector de <strong>Público</strong> muestra cada uno por separado. Responde <strong>¿nos conocen?</strong> y <strong>¿con qué atributo nos relacionan?</strong>, y agrega el embudo de consideración. Es la única fuente de este tablero que le pregunta a gente que <em>no</em> ha interactuado con nosotros.',
    sinDato: 'Pulso solo encuesta en México: la línea de WhatsApp, la base y el cuestionario son de MX.' },
  { k: 'traffic', nombre: 'Tráfico', metrica: 'traffic', marcas: ['MX'],
    titulo: 'Tráfico al sitio', fn: () => drawTraffic,
    hint: 'Usuarios únicos que llegan al sitio. Si la marca funciona, el tráfico sube sin que suba la inversión.',
    sinDato: 'Solo hay export de GA4 utilizable para México. El tráfico de Colombia se mide en el WBR 2.0.' },
  { k: 'tv', nombre: 'TV', metrica: 'tv', marcas: ['MX'],
    titulo: 'Impacto de la TV abierta', fn: () => drawTV,
    hint: 'Campaña nacional con Televisa, sep-nov 2026. El efecto de un spot dura unos 30 minutos y es chico frente al tráfico diario, así que solo se separa del ruido mirando el minuto exacto de la emisión. La cifra de incrementalidad con su intervalo se publica cada mañana en Google Chat; acá se ve la forma.',
    sinDato: 'La campaña de TV abierta es solo de Tuhabi en México.' },
];
let SECCION = 'brand_lift';
let DATA = null, PAIS = 'MX', PLAZA = 'Todas', MESES = '24 meses';
// Ancho del bloque del gráfico intradía, en minutos. 10 por defecto: un spot mueve
// ~20-25 visitas en sus primeros 15 minutos, que en un bloque de 10 (~70 esperadas, ruido ±8)
// se separan del fondo; en uno de 30 (~210, ±14) se diluyen. El de 30 queda como opción para
// cuando el horario es proyectado y el spot pudo salir un cuarto de hora antes o después.
const BLOQUES = ['10', '30'];
let BLOQUE = '10';
// Qué leads mira el panel de incrementalidad. "Directo" va primero porque es lo que una emisión
// puede mover sin pasar por ningún anuncio; "Todos WEB" queda de contexto.
const LEADS_OPC = { 'Directo': 'directo', 'Búsqueda de marca': 'marca', 'Todos WEB': 'web' };
let LEADS_SEL = 'Directo';
// Público del encuestador. Dueños primero: son el cliente de TuHabi y sobre ellos se lee la
// salud de marca. Brokers va aparte porque conocen la categoría como canal, no como cliente.
const PUBLICOS = { 'Dueños': 'owner', 'Brokers': 'broker' };
let PUBLICO = 'Dueños';

// ── El corazón del tablero: cada métrica se dibuja según su `status`, no según si su
// serie viene vacía. Un `not_available` explica qué fuente falta; jamás pinta un chart
// en blanco ni una serie de ceros, porque un cero se lee como "el valor es cero" en vez
// de "la fuente no está conectada". Ver el contrato en contract.py.
function renderMetric(host, metric, drawFn) {
  if (!metric) {
    host.innerHTML = `<div class="empty-metric"><span class="icon">—</span>
      <strong>Métrica no declarada</strong><p>No aparece en data.json para este país.</p></div>`;
    return '';
  }
  if (metric.status === 'not_available' || metric.status === 'error') {
    const t = metric.status === 'error' ? 'Falló la última actualización'
      : metric.planned ? 'Todavía no existe' : 'Sin fuente conectada';
    const ic = metric.status === 'error' ? '⚠' : metric.planned ? '○' : '—';
    host.innerHTML = `<div class="empty-metric${metric.planned ? ' planeada' : ''}"><span class="icon">${ic}</span>
      <strong>${t}</strong><p>${metric.reason || ''}</p></div>`;
    return '';
  }
  drawFn(host, metric.series || []);
  // El badge de vencido: si no hubo NINGÚN refresco exitoso, `last_updated` no existe y
  // decirlo es más honesto que mostrar un guion donde debería ir una fecha.
  const cuando = metric.last_updated
    ? `sin refrescar desde ${metric.last_updated.slice(0, 16).replace('T', ' ')} UTC`
    : 'nunca se ha refrescado con éxito: se sirve el histórico en caché';
  return metric.status === 'stale' ? `<span class="badge">${cuando}</span>` : '';
}

const srcTag = m => (m && m.source)
  ? `<span class="src">fuente: ${{ bq: 'BigQuery', api: 'Meta API', cache: 'caché en repo', pulso: 'Pulso Inmobiliario (API pública)' }[m.source] || m.source}</span>` : '';

// ── TV abierta ────────────────────────────────────────────────────────────────
// Dos lentes sobre la misma campaña. La serie DIARIA es descriptiva: la brecha contra el
// contrafactual incluye todo lo que movió el día —pauta digital, feriados, estacionalidad—,
// no solo televisión, y se rotula así. El MINUTO A MINUTO es donde sí se ve una emisión:
// alrededor de un spot el ruido es una fracción del diario y el pico se separa del fondo.
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

function drawTV(host, serie) {
  const m = ((DATA.metrics.tv || {})[PAIS] || {}).minuto;
  const ld = ((DATA.metrics.tv || {})[PAIS] || {}).leads;

  host.innerHTML = `<div class="panel"><h3>Tráfico diario contra el contrafactual</h3>
      <div class="cap">Sesiones observadas frente a lo que predice el baseline sin televisión
      (20-jul a 6-sep, previo a la campaña). <strong>La brecha no es atribuible a TV por sí
      sola</strong>: incluye pauta digital, feriados y estacionalidad. Las <strong>barras
      ámbar</strong> son los spots de cada día (eje derecho): más tenues donde el conteo sale del
      horario proyectado y no del as-run de la central. Los puntos rojos marcan días con alguna
      hora anómala.</div>
      <div class="ch alto"><canvas id="tv-dia"></canvas></div>
      ${legend([[C.azul, 'Observado'], [C.gris, 'Contrafactual'], [C.ambar, 'Spots del día'],
                [C.rojo, 'Día con hora anómala']])}</div>`
    + panelLeads(ld)
    + (m ? `<div class="panel"><h3>Intradía · ${m.fecha} · bloques de ${BLOQUE} min</h3>
      <div class="cap">El último día cerrado, sumado en bloques de ${BLOQUE} minutos. Por minuto
      llegan tan pocas visitas (~7) que el azar solo ya da agujas de ±3, y la gráfica parecía
      estar siempre por encima de lo esperado; sumadas en bloques, ese ruido se cancela y lo que
      queda arriba de la línea gris es exceso real. Las <strong>líneas ámbar</strong> son los
      spots${m.spots_origen === 'proyectado'
        ? ' <strong>según el horario proyectado</strong> (aún no llega el as-run de la central: pudieron salir minutos antes o después)'
        : ' del as-run de la central'}. El contrafactual va reescalado al nivel del día
      (factor ${m.factor_dia}), así que un día globalmente bajo no pinta toda la serie por debajo.
      ${m.horas_anomalas.length
        ? '<strong>Horas anómalas: ' + m.horas_anomalas.map(a =>
            String(a.hora).padStart(2, '0') + 'h (' + a.sigmas + ' sigmas, ' +
            Math.round(a.exceso) + ' visitas sobre lo esperado)').join(' · ') + '</strong>'
        : 'Sin horas anómalas: ninguna superó 4 sigmas sobre su dispersión histórica.'}</div>
      ${chips('Bloque (minutos)', BLOQUES, BLOQUE, 'bloque')}
      <div class="ch alto"><canvas id="tv-min"></canvas></div>
      ${legend([[C.azul, 'Observado'], [C.gris, 'Contrafactual']]
        .concat((m.spots || []).length ? [[C.ambar, 'Spot']] : []))}</div>` : '');

  const L = serie.map(r => r.fecha.slice(5));
  // Barras al fondo (orden mayor = se dibuja antes) y con techo al triple del máximo: son
  // contexto para leer la brecha, no una tercera serie del mismo tamaño que las líneas.
  const maxSpots = Math.max(0, ...serie.map(r => r.spots || 0));
  const proy = r => r.spots_origen === 'proyectado';
  mkMulti('tv-dia', L, [
    { label: 'Contrafactual', color: C.gris, data: serie.map(r => r.esperado), dash: [5, 4], puntoRadio: 0 },
    { label: 'Observado', color: C.azul, data: serie.map(r => r.observado),
      puntoRadio: serie.map(r => r.anomalia ? 5 : 2),
      puntoColor: serie.map(r => r.anomalia ? C.rojo : C.azul) },
    { type: 'bar', label: 'Spots', eje: 'y1', orden: 1, color: C.ambar, grosor: 0,
      fill: serie.map(r => proy(r) ? C.ambar + '40' : C.ambar + 'b3'),
      data: serie.map(r => r.spots || null) },
  ], { fmt: 'num', fmtDerecha: 'num', sinBandas: true, maxDerecha: maxSpots ? maxSpots * 3 : undefined,
       pieTooltip: i => proy(serie[i]) ? ['Spots según horario proyectado'] : [] });

  drawLeads(ld);
  if (!m) return;
  // Se suma, no se promedia: el eje queda en "visitas por bloque", que es la unidad en la que
  // se lee el exceso de un spot. tension 0: suavizar redondearía justo el bloque del pico.
  const n = +BLOQUE, B = [];
  for (let i = 0; i < m.puntos.length; i += n) {
    const g = m.puntos.slice(i, i + n);
    B.push([g[0][0], g.reduce((a, p) => a + p[1], 0), g.reduce((a, p) => a + p[2], 0)]);
  }
  const spots = m.spots || [];
  const spotsDe = i => spots.filter(sp => Math.floor(sp[0] / n) === i);
  mkMulti('tv-min', B.map(b => hhmm(b[0])), [
    { label: 'Contrafactual', color: C.gris, data: B.map(b => b[2]), dash: [5, 4], puntoRadio: 0, tension: 0 },
    { label: 'Observado', color: C.azul, data: B.map(b => b[1]), puntoRadio: 0, tension: 0 },
  ], { fmt: 'num', sinBandas: true,
       spots: { indices: spots.map(sp => Math.floor(sp[0] / n)), color: C.ambar },
       pieTooltip: i => spotsDe(i).map(sp => `Spot ${hhmm(sp[0])} · ${sp[1]}${sp[2] ? ' · ' + sp[2] : ''}`) });
}

// ── Leads diarios contra su contrafactual ─────────────────────────────────────────
// Mismo formato que el tráfico diario, para leerlos lado a lado. Dos cosas que el texto dice con
// números en vez de dejarlas a la intuición: cuánto se mueve un día normal (`ruido`) y cómo
// venía la serie la semana ANTES del primer spot — si ya subía, el alza no es de la TV.
const PRIMER_SPOT = '2026-09-07';
const LEADS_NOTA = {
  directo: 'Leads WEB sin UTM: llegaron escribiendo la URL o por orgánico.',
  marca: 'Leads de Google Ads en campañas de búsqueda de marca (<code>sem_brand</code>): alguien buscó "habi". También se mueve con el presupuesto de esas campañas.',
  web: 'Todos los leads WEB. <strong>La mayoría es pauta de Meta y Google</strong> y sube o baja con el presupuesto digital (el salto del 17-30 ago fue eso), así que aquí la TV queda enterrada: va como contexto.',
};
function panelLeads(ld) {
  if (!ld) return '';
  const k = LEADS_OPC[LEADS_SEL], S = ld.series[k] || [], ruido = (ld.ruido || {})[k];
  const suma = f => S.filter(f).reduce((a, r) => a + (r.exceso || 0), 0);
  const esp = f => S.filter(f).reduce((a, r) => a + (r.esperado || 0), 0);
  const camp = r => r.fecha >= PRIMER_SPOT, previa = r => r.fecha < PRIMER_SPOT;
  const dias = S.filter(camp).length, ex = suma(camp), pct = esp(camp) ? 100 * ex / esp(camp) : null;
  const fmtS = v => (v >= 0 ? '+' : '') + Math.round(v).toLocaleString('es-MX');
  const exPrev = suma(previa), nPrev = S.filter(previa).length;
  const avisoPrev = ruido && nPrev && Math.abs(exPrev / nPrev) > ruido / 3
    ? ` <strong>Ojo: la semana previa al primer spot ya iba ${fmtS(exPrev)} (${fmtS(exPrev / nPrev)}/día)</strong>, así que una parte del alza venía de antes y no es atribuible a TV.` : '';
  return `<div class="panel"><h3>Leads diarios contra el contrafactual · ${LEADS_SEL}</h3>
    <div class="cap">${LEADS_NOTA[k]} El contrafactual es la <strong>mediana de cada día de semana</strong>
    del ${ld.base_desde.slice(8)}-${ld.base_desde.slice(5, 7)} al ${ld.base_hasta.slice(8)}-${ld.base_hasta.slice(5, 7)},
    antes de la TV. <strong>Desde el primer spot (${dias} días): ${fmtS(ex)} leads${pct != null ? ` (${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%)` : ''},
    ${fmtS(ex / (dias || 1))} por día.</strong> Un día normal se mueve ±${ruido} leads solo por azar: los
    puntos verdes y rojos marcan días que se salen de dos veces eso.${avisoPrev}
    Es descriptivo, igual que el tráfico diario: la brecha incluye todo lo que movió el día, no solo TV.</div>
    ${chips('Leads', Object.keys(LEADS_OPC), LEADS_SEL, 'leads')}
    <div class="ch alto"><canvas id="tv-leads"></canvas></div>
    ${legend([[C.azul, 'Observado'], [C.gris, 'Contrafactual'], [C.ambar, 'Spots del día'],
              [C.verde, 'Día sobre lo normal (>2σ)'], [C.rojo, 'Día bajo lo normal']])}</div>`;
}
function drawLeads(ld) {
  if (!ld) return;
  const k = LEADS_OPC[LEADS_SEL], S = ld.series[k] || [], r2 = 2 * ((ld.ruido || {})[k] || Infinity);
  const color = r => r.exceso > r2 ? C.verde : r.exceso < -r2 ? C.rojo : C.azul;
  const maxSpots = Math.max(0, ...S.map(r => r.spots || 0));
  const proy = r => r.spots_origen === 'proyectado';
  mkMulti('tv-leads', S.map(r => r.fecha.slice(5)), [
    { label: 'Contrafactual', color: C.gris, data: S.map(r => r.esperado), dash: [5, 4], puntoRadio: 0 },
    { label: 'Observado', color: C.azul, data: S.map(r => r.observado),
      puntoRadio: S.map(r => color(r) === C.azul ? 2 : 5), puntoColor: S.map(color) },
    { type: 'bar', label: 'Spots', eje: 'y1', orden: 1, color: C.ambar, grosor: 0,
      fill: S.map(r => proy(r) ? C.ambar + '40' : C.ambar + 'b3'),
      data: S.map(r => r.spots || null) },
  ], { fmt: 'num', fmtDerecha: 'num', sinBandas: true, maxDerecha: maxSpots ? maxSpots * 3 : undefined,
       pieTooltip: i => [`Diferencia: ${S[i].exceso >= 0 ? '+' : ''}${S[i].exceso} leads`]
         .concat(proy(S[i]) ? ['Spots según horario proyectado'] : []) });
}

const ayuda = k => AYUDA[k] ? `<button type="button" class="help-btn" data-ayuda="${k}" aria-label="Más información">?</button>` : '';

// ── Brand Lift ────────────────────────────────────────────────────────────────
// TOMA va primero en los dos países: es el indicador de marca por excelencia —cuánta gente nos
// nombra a nosotros cuando piensa en vender su casa— y el resto son señales de apoyo. Detrás va
// el embudo: recordar el anuncio, que la marca guste, y elegirnos.
const ORDEN_PREGUNTAS = ['toma', 'ad_recall', 'favorability', 'intent',
                         'sin_identificar_alta', 'sin_identificar_baja'];
const ordenar = qs => [...qs].sort((a, b) => {
  const ia = ORDEN_PREGUNTAS.indexOf(a), ib = ORDEN_PREGUNTAS.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
});

// Significancia de un lift, con el intervalo de 95% que entrega Meta (`ci_lower`/`ci_upper`, en
// las mismas unidades que el lift). Si el intervalo cruza el cero, la pauta pudo no haber movido
// nada: el número se publica, pero se rotula como no concluyente en vez de leerse como un efecto.
const sigDe = r => (!r || r.ci_lower == null || r.ci_upper == null) ? null
  : r.ci_lower > 0 ? 'si' : r.ci_upper < 0 ? 'neg' : 'no';
const SIG_TXT = { si: 'Significativo ▲', neg: 'Significativo ▼', no: 'No concluyente' };
const sigBadge = r => { const s = sigDe(r); return s ? `<span class="sig ${s}">${SIG_TXT[s]}</span>` : ''; };
const fmtUSD = v => v == null ? '—' : 'US$' + (Math.abs(v) >= 100
  ? Math.round(v).toLocaleString('es-MX') : v.toFixed(2));
const fmtMil = v => v == null ? '—' : v >= 1e6 ? (v / 1e6).toFixed(1) + ' M'
  : v >= 1e3 ? Math.round(v / 1e3).toLocaleString('es-MX') + ' mil' : Math.round(v).toLocaleString('es-MX');
const pts = v => v == null ? '—' : `${v >= 0 ? '+' : ''}${(100 * v).toFixed(1)}`;

// La ficha es del ESTUDIO, no de una pregunta: inversión, impresiones, alcance y frecuencia son
// las mismas en las 3-4 preguntas del mes, así que se toman de cualquiera de sus filas.
function fichaEstudio(serie, mes) {
  const r = serie.find(x => x.month === mes);
  if (!r || r.spend == null) return '';
  const muestra = serie.filter(x => x.month === mes)
    .reduce((a, x) => a + (x.responders_test || 0) + (x.responders_control || 0), 0);
  return `<div class="flabel" style="display:flex;align-items:center;margin-bottom:6px">Ficha del estudio de ${mes}${r.parcial ? ' · en curso' : ''}${ayuda('bl_ficha')}</div>
    <div class="ficha">
      <div><div class="k">Inversión medida</div><div class="v">${fmtUSD(r.spend)}</div><div class="d">Gasto de las campañas del estudio</div></div>
      <div><div class="k">Alcance</div><div class="v">${fmtMil(r.reached)}</div><div class="d">Personas que vieron la pauta</div></div>
      <div><div class="k">Impresiones</div><div class="v">${fmtMil(r.impressions)}</div><div class="d">Veces que se mostró un anuncio</div></div>
      <div><div class="k">Frecuencia</div><div class="v">${r.frequency == null ? '—' : r.frequency.toFixed(1) + '×'}</div><div class="d">Veces que la vio cada persona</div></div>
      <div><div class="k">Encuestados</div><div class="v">${muestra.toLocaleString('es-MX')}</div><div class="d">Respuestas del mes</div></div>
    </div>`;
}

// Lo que la pauta logra en cada pregunta, en palabras: es la frase del costo por persona.
const LOGRO = { ad_recall: 'recuerda el anuncio', toma: 'nos nombra primero',
                favorability: 'tiene una opinión favorable', intent: 'nos tendría en cuenta para vender' };
const vsBench = (v, b) => {
  if (v == null || !b) return '—';
  const d = v / b - 1;
  return d <= 0 ? `<b class="mejor">${Math.round(-100 * d)}% más barato</b>` : `<b class="peor">${Math.round(100 * d)}% más caro</b>`;
};

// ¿Cuánto cuesta mover a una persona? Una tarjeta por pregunta con el último mes donde hubo efecto
// medible, comparado en palabras con lo que pagan otros. Reemplaza una tabla de 6 meses × 3
// preguntas con dos benchmarks por celda que no se entendía sin leer la explicación.
// Solo cuenta lift significativo y positivo: sin efecto no hay personas movidas que dividir.
function costoPorPersona(serie, L, preguntas) {
  const conCosto = r => r && sigDe(r) === 'si' && r.incremental > 0 && r.cost_per_incremental != null;
  const tarjetas = preguntas.filter(q => !q.startsWith('sin_identificar')).map((q, i) => {
    const s = serie.filter(r => r.question === q);
    const ult = [...s].reverse().find(conCosto);
    if (!ult) return `<div class="panel" style="align-self:start"><h3>${NOMBRE_PREGUNTA[q] || q}</h3>
      <div class="cap">Ningún mes de esta ventana tuvo un efecto significativo y positivo: no hay
      personas movidas, así que no hay costo que medir.</div></div>`;
    return `<div class="panel"><h3>${NOMBRE_PREGUNTA[q] || q}</h3>
      <div class="costo-v">${fmtUSD(ult.cost_per_incremental)} <small>por persona · ${ult.month}</small></div>
      <div class="costo-comp">Cada persona que ${LOGRO[q] || 'cambió su respuesta'} gracias a la pauta.<br>
        Contra la región (${fmtUSD(ult.cpi_region)}): ${vsBench(ult.cost_per_incremental, ult.cpi_region)} ·
        contra la industria (${fmtUSD(ult.cpi_vertical)}): ${vsBench(ult.cost_per_incremental, ult.cpi_vertical)}</div>
      <div class="ch"><canvas id="bl-cpp-${i}"></canvas></div>
      ${legend([[C.azul, 'Nuestro costo'], [C.ambar, 'Región'], [C.gris, 'Industria']])}</div>`;
  }).join('');
  return `<div class="pulso-bloque" style="display:flex;align-items:center">¿Cuánto cuesta mover a una persona?${ayuda('bl_costo')}</div>
    <div class="cap" style="font-size:12.5px;margin:-4px 0 10px">Inversión ÷ personas a las que la pauta les cambió la respuesta. Más bajo es mejor.</div>
    <div class="costo-grid">${tarjetas}</div>`;
}

function dibujarCostos(serie, L, preguntas) {
  preguntas.filter(q => !q.startsWith('sin_identificar')).forEach((q, i) => {
    const s = serie.filter(r => r.question === q);
    const f = m => s.find(r => r.month === m);
    const vale = r => r && sigDe(r) === 'si' && r.incremental > 0;
    mkMulti(`bl-cpp-${i}`, L, [
      { type: 'bar', label: 'Nuestro costo', orden: 1, color: C.azul, data: L.map(m => vale(f(m)) ? f(m).cost_per_incremental : null) },
      { type: 'line', label: 'Región', color: C.ambar, dash: [4, 3], puntoRadio: 0, grosor: 1.5, data: L.map(m => (f(m) || {}).cpi_region ?? null) },
      { type: 'line', label: 'Industria', color: C.gris, dash: [4, 3], puntoRadio: 0, grosor: 1.5, data: L.map(m => (f(m) || {}).cpi_vertical ?? null) },
    ], { fmt: 'money', pieTooltip: k => vale(f(L[k])) ? [] : ['Sin efecto significativo ese mes: no hay costo'] });
  });
}

// ── Brand Lift: entrega, personas movidas e inversión vs lift ─────────────────
// Inversión, alcance, impresiones y frecuencia son del ESTUDIO (iguales en sus 3-4 preguntas):
// se toman de cualquier fila del mes.
const porMesEstudio = serie => {
  const out = {};
  serie.forEach(r => { if (!out[r.month] && r.spend != null) out[r.month] = r; });
  return out;
};
const preguntasReales = preguntas => preguntas.filter(q => !q.startsWith('sin_identificar'));

function bloqueEntrega() {
  const panel = (id, titulo, cap) => `<div class="panel"><h3>${titulo}</h3>
      <div class="cap">${cap}</div><div class="ch"><canvas id="${id}"></canvas></div></div>`;
  return `<div class="flabel" style="display:flex;align-items:center;margin:2px 0 6px">Inversión y entrega por mes${ayuda('bl_entrega')}</div>
    <div class="charts-grid" style="margin-bottom:16px">
      ${panel('bl-ent-spend', 'Inversión medida', 'USD de las campañas de cada estudio.')}
      ${panel('bl-ent-reach', 'Alcance', 'Personas distintas que vieron la pauta.')}
      ${panel('bl-ent-freq', 'Frecuencia', 'Veces que la vio cada persona.')}
      ${panel('bl-ent-imp', 'Impresiones', 'Veces que se mostró un anuncio.')}
    </div>`;
}

function dibujarEntrega(serie, L) {
  const e = porMesEstudio(serie);
  const v = k => L.map(m => (e[m] || {})[k] ?? null);
  const tenue = c => L.map(m => (e[m] || {}).parcial ? c + '55' : c);
  mkMulti('bl-ent-spend', L, [{ type: 'bar', label: 'Inversión (USD)', color: tenue(C.verde), data: v('spend') }], { fmt: 'usdMil' });
  mkMulti('bl-ent-reach', L, [{ type: 'bar', label: 'Alcance', color: tenue(C.azul), data: v('reached') }], { fmt: 'compacto' });
  mkMulti('bl-ent-freq', L, [{ label: 'Frecuencia', color: C.ambar, puntoRadio: 2, tension: .2,
    data: v('frequency').map(x => x == null ? null : Math.round(10 * x) / 10) }], { fmt: 'num' });

// Correlación de Pearson: qué tanto se mueven juntos inversión y lift. Con pocos meses es una pista,
// no una prueba: el texto lo dice en palabras y con cuántos meses se calculó.
function pearson(xs, ys) {
  const n = xs.length;
  if (n < 4) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; syy += (ys[i] - my) ** 2; });
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
const leerR = r => r == null ? 'Pocos meses para decir algo.'
  : Math.abs(r) < .3 ? 'Sin relación clara: más inversión no trajo más efecto.'
  : r > 0 ? `${Math.abs(r) < .6 ? 'Relación moderada' : 'Relación fuerte'}: los meses con más inversión tuvieron más lift.`
  : `${Math.abs(r) < .6 ? 'Relación moderada' : 'Relación fuerte'} pero al revés: más inversión, menos lift.`;

function bloqueInversionLift(serie, preguntas) {
  const qs = preguntasReales(preguntas);
  return `<div class="pulso-bloque" style="display:flex;align-items:center">¿Más inversión, más efecto?${ayuda('bl_scatter')}</div>
    <div class="cap" style="font-size:12.5px;margin:-4px 0 10px">Cada punto es un mes: inversión del estudio contra el lift de la pregunta.</div>

      const s = serie.filter(r => r.question === q && r.spend != null && r.lift != null && !r.parcial);

      return `<div class="panel"><h3>${NOMBRE_PREGUNTA[q] || q}</h3>
        <div class="cap">${leerR(r)}${r == null ? '' : ` (correlación ${r.toFixed(2)}, ${s.length} meses)`}</div>
        <div class="ch"><canvas id="bl-sc-${i}"></canvas></div>
        ${legend([[C.verde, 'Subió (significativo)'], [C.gris, 'No concluyente'], [C.rojo, 'Bajó (significativo)']])}</div>`;

}
