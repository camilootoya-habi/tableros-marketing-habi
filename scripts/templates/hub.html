<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📢</text></svg>">
<title>Tableros Marketing — Habi</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #1e2942;
    --border: #334155;
    --text-title: #f8fafc;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --text-muted-2: #64748b;
    --accent: #818cf8;
  }
  body.light {
    --bg: #f5f7fa;
    --card: #ffffff;
    --card-hover: #eef2ff;
    --border: #e2e8f0;
    --text-title: #0f172a;
    --text: #334155;
    --text-muted: #64748b;
    --text-muted-2: #94a3b8;
    --accent: #6366f1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 24px; transition: background 0.2s, color 0.2s; }
  .theme-btn { position: fixed; top: 20px; right: 24px; background: var(--card); border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer; transition: background 0.15s, color 0.15s; z-index: 10; }
  .theme-btn:hover { color: var(--accent); }
  .header { text-align: center; margin-bottom: 48px; max-width: 720px; }
  .header h1 { font-size: 32px; font-weight: 600; color: var(--text-title); margin-bottom: 12px; }
  .header h1 span { color: var(--accent); }
  .header p { font-size: 15px; color: var(--text-muted); line-height: 1.5; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; max-width: 960px; width: 100%; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; text-decoration: none; color: inherit; transition: transform 0.15s, border-color 0.15s, background 0.15s; display: flex; flex-direction: column; gap: 6px; }
  .card:hover { transform: translateY(-1px); border-color: var(--accent); background: var(--card-hover); }
  .card h2 { font-size: 15px; color: var(--text-title); font-weight: 600; line-height: 1.3; }
  .card h2 .country { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .card p { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }

  footer { margin-top: 48px; font-size: 12px; color: var(--text-muted-2); }

  .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 36px; max-width: 1400px; width: 100%; }
  .section-title { font-size: 22px; font-weight: 600; color: var(--text-title); margin: 0 0 16px; padding: 0 4px; }
  .section-title span { color: var(--accent); }
  .card-stack { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 820px) {
    .columns { gap: 28px; }
  }

  .owner-title { font-size: 26px; font-weight: 700; color: var(--text-title); margin: 8px 4px 20px; padding-top: 24px; border-top: 1px solid var(--border); width: 100%; max-width: 1400px; }
  .owner-title:first-of-type { border-top: none; padding-top: 0; }
</style>
<script>
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('tablero-theme', isLight ? 'light' : 'dark');
    document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
  }
</script>
</head>
<body>
  <button type="button" class="theme-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Cambiar tema">🌙</button>
  <div class="header">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
{{CONTENT}}
  <footer>habi · marketing analytics</footer>
<script>
  // Init theme from localStorage (default: light)
  (function(){
    const saved = localStorage.getItem('tablero-theme');
    if (saved !== 'dark') document.body.classList.add('light');
    document.getElementById('themeToggle').textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
  })();
</script>
</body>
</html>
